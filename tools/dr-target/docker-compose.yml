services:
  hope-dr-postgres:
    image: postgres:17-alpine
    container_name: hope-dr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DR_POSTGRES_USER:-hope}
      POSTGRES_PASSWORD: ${DR_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${DR_POSTGRES_DB:-hope_dr}
    ports:
      - "${DR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - hope_dr_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DR_POSTGRES_USER:-hope} -d ${DR_POSTGRES_DB:-hope_dr}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  hope_dr_postgres_data:
