openapi: 3.0.3
info:
  title: HOPE API
  version: 3.1.0
  description: HOPE marketplace API contract. Payment routes expose the marketplace state machine; the configured payment provider is behind a provider boundary.
servers:
  - url: https://api.example.com/api/v1
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, properties: {code: {type: string}, message: {type: string}, requestId: {type: string}}}
    Wallet:
      type: object
      required: [id, userId, currency, availableBalance, lockedBalance, status]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        currency: {type: string, example: TOMAN}
        availableBalance: {type: string, description: Integer amount in the wallet currency}
        lockedBalance: {type: string, description: Integer amount currently locked}
        status: {type: string, enum: [ACTIVE, SUSPENDED, CLOSED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WalletTransaction:
      type: object
      required: [id, entryType, direction, amount, currency, referenceType, financialOperationId]
      properties:
        id: {type: string, format: uuid}
        entryType: {type: string}
        direction: {type: string, enum: [CREDIT, DEBIT]}
        amount: {type: string}
        currency: {type: string, example: TOMAN}
        referenceType: {type: string}
        referenceId: {type: string, nullable: true}
        financialOperationId: {type: string}
        balanceAfter: {type: string, nullable: true}
        metadata: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time, nullable: true}
    WalletTransactionsPage:
      type: object
      required: [currency, transactions]
      properties:
        currency: {type: string, example: TOMAN}
        transactions:
          type: array
          items: {$ref: '#/components/schemas/WalletTransaction'}
        nextCursor: {type: string, nullable: true}
    Payout:
      type: object
      required: [id, walletId, amount, currency, provider, status, idempotencyKey]
      properties:
        id: {type: string, format: uuid}
        walletId: {type: string, format: uuid}
        amount: {type: string}
        currency: {type: string, example: TOMAN}
        provider: {type: string}
        status: {type: string}
        idempotencyKey: {type: string}
        providerRef: {type: string, nullable: true}
        referenceType: {type: string, nullable: true}
        referenceId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    PayoutList:
      type: object
      required: [currency, payouts]
      properties:
        currency: {type: string, example: TOMAN}
        payouts:
          type: array
          items: {$ref: '#/components/schemas/Payout'}
    Notification:
      type: object
      required: [id, type, title, body]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        createdAt: {type: string, format: date-time, nullable: true}
        readAt: {type: string, format: date-time, nullable: true}
        data: {type: object, additionalProperties: true}
    NotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        unreadCount: {type: integer, minimum: 0}
    NotificationPreferences:
      type: object
      required: [inApp, push, email, jobAlerts, applicationUpdates, paymentUpdates, marketing]
      properties:
        inApp: {type: boolean}
        push: {type: boolean}
        email: {type: boolean}
        jobAlerts: {type: boolean}
        applicationUpdates: {type: boolean}
        paymentUpdates: {type: boolean}
        marketing: {type: boolean}
    Application:
      type: object
      required: [id, jobId, jobTitle, jobKind, resumeText, skills, status]
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        jobTitle: {type: string}
        jobCity: {type: string, nullable: true}
        jobKind: {type: string, enum: [JOB, MISSION]}
        resumeText: {type: string}
        skills: {type: string}
        status: {type: string, enum: [PENDING, SHORTLISTED, FORWARDED, INTERVIEW, OFFERED, ACCEPTED, REJECTED, WITHDRAWN]}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    ApplicationList:
      type: array
      items: {$ref: '#/components/schemas/Application'}
    ProviderProfile:
      type: object
      required: [providerType, capacity, verificationStatus, trustSignals]
      properties:
        providerType: {type: string}
        capacity: {type: string}
        verificationStatus: {type: string}
        trustSignals: {type: object, additionalProperties: true}
    Session:
      type: object
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {type: string}
    Job:
      type: object
      required: [id, title, description, categoryId, jobType, budgetType, budgetMin, budgetMax, duration, acceptanceCriteria, status, ownerId, providerId, category, owner, provider, offerCount, city, kind, visibility, schedule, monthlySalary, applicationDeadline, feePolicy, createdAt, updatedAt, verticalId, attributes]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        categoryId: {type: string}
        category: {type: object, additionalProperties: true}
        jobType: {type: string, enum: [FIXED, HOURLY, TASK]}
        budgetType: {type: string, enum: [FIXED, RANGE]}
        budgetMin: {type: string, description: Integer amount in the job currency}
        budgetMax: {type: string, description: Integer amount in the job currency}
        duration: {type: integer}
        acceptanceCriteria: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED, ASSIGNED, FUNDED, IN_PROGRESS, DELIVERED, UNDER_REVIEW, COMPLETED, CANCELLED, SETTLED]}
        ownerId: {type: string, format: uuid}
        providerId: {type: string, format: uuid, nullable: true}
        owner: {type: object, nullable: true, additionalProperties: true}
        provider: {type: object, nullable: true, additionalProperties: true}
        offerCount: {type: integer, minimum: 0}
        city: {type: string, nullable: true}
        kind: {type: string, enum: [JOB, MISSION]}
        visibility: {type: string, enum: [PUBLIC, PRIVATE]}
        schedule: {type: string, nullable: true}
        monthlySalary: {type: string, nullable: true, description: Integer amount in the job currency}
        applicationDeadline: {type: string, format: date, nullable: true}
        feePolicy: {type: object, required: [employerRate, candidateRate, model], properties: {employerRate: {type: number}, candidateRate: {type: number}, model: {type: string}}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        verticalId: {type: string, format: uuid, nullable: true}
        attributes: {type: object, additionalProperties: true}
    Offer:
      type: object
      required: [id, jobId, providerId, price, message, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        providerId: {type: string, format: uuid}
        price: {type: string, description: Integer amount in the job currency}
        message: {type: string}
        status: {type: string}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    Payment:
      type: object
      required: [status, amount, job]
      properties:
        id: {type: string, format: uuid, nullable: true}
        jobId: {type: string, format: uuid, nullable: true}
        amount: {type: string, nullable: true, description: Integer amount in the payment currency}
        status: {type: string, enum: [NO_TRANSACTION, HOLD_PENDING, HELD, HOLD_FAILED, REFUND_PENDING, REFUNDED, RELEASE_PENDING, RELEASE_FAILED, RELEASED]}
        paymentStatus: {type: string}
        providerRef: {type: string, nullable: true}
        job: {$ref: '#/components/schemas/Job'}
        fees: {$ref: '#/components/schemas/PaymentFees'}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    PaymentFees:
      type: object
      required: [baseAmount, employerFee, workerFee, platformFee, employerCharge, providerPayout, policyVersion, currency]
      properties:
        baseAmount: {type: string, nullable: true}
        employerFee: {type: string}
        workerFee: {type: string}
        platformFee: {type: string}
        employerCharge: {type: string}
        providerPayout: {type: string}
        policyVersion: {type: string}
        currency: {type: string}
    ChatAttachment:
      type: object
      required: [id, filename, contentType, size, downloadPath]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string, maxLength: 255}
        contentType: {type: string, enum: [application/pdf, image/png, image/jpeg, image/webp, text/plain, audio/mp4, audio/mpeg, audio/wav]}
        size: {type: integer, minimum: 1}
        downloadPath: {type: string}
    ChatReadReceipt:
      type: object
      required: [userId, userName, readAt]
      properties:
        userId: {type: string, format: uuid}
        userName: {type: string}
        readAt: {type: string, format: date-time}
    ChatPresence:
      type: object
      required: [userId, userName, online, typing]
      properties:
        userId: {type: string, format: uuid}
        userName: {type: string}
        online: {type: boolean}
        typing: {type: boolean}
        lastSeenAt: {type: string, format: date-time, nullable: true}
    ChatConversation:
      type: object
      required: [id, kind, jobId, status, title, lastMessageBody, lastMessageType, unreadCount, isPinned, isImportant, isArchived]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [JOB, ADMIN]}
        jobId: {type: string, description: Empty for the admin room}
        status: {type: string, enum: [OPEN, CLOSED]}
        title: {type: string}
        otherUserName: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        lastMessageBody: {type: string}
        lastMessageType: {type: string, enum: [TEXT, ATTACHMENT, VOICE]}
        lastMessageAt: {type: string, format: date-time, nullable: true}
        unreadCount: {type: integer, minimum: 0}
        isPinned: {type: boolean}
        isImportant: {type: boolean}
        isArchived: {type: boolean}
    ChatMessage:
      type: object
      required: [id, conversationId, senderId, senderName, body, messageType, createdAt, attachments, readReceipts]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        senderId: {type: string, format: uuid}
        senderName: {type: string}
        body: {type: string, maxLength: 4000}
        messageType: {type: string, enum: [TEXT, ATTACHMENT, VOICE]}
        createdAt: {type: string, format: date-time}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/ChatAttachment'}
        readReceipts:
          type: array
          items: {$ref: '#/components/schemas/ChatReadReceipt'}
    ChatPresenceUpdate:
      type: object
      required: [conversationId, userId, online, typing]
      properties:
        conversationId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        online: {type: boolean}
        typing: {type: boolean}
        lastSeenAt: {type: string, format: date-time, nullable: true}
    ChatConversationPreferences:
      type: object
      required: [conversationId, isPinned, isImportant, isArchived, updatedAt]
      properties:
        conversationId: {type: string, format: uuid}
        isPinned: {type: boolean}
        isImportant: {type: boolean}
        isArchived: {type: boolean}
        updatedAt: {type: string, format: date-time, nullable: true}
    ChatUpload:
      type: object
      required: [key, filename, contentType, size, uploadedBy, createdAt]
      properties:
        key: {type: string}
        filename: {type: string, maxLength: 255}
        contentType: {type: string, enum: [application/pdf, image/png, image/jpeg, image/webp, text/plain, audio/mp4, audio/mpeg, audio/wav]}
        size: {type: integer, minimum: 1, description: Positive byte count bounded by server configuration}
        uploadedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    UploadIntent:
      type: object
      properties: {intentId: {type: string, format: uuid}, key: {type: string}, url: {type: string, format: uri}, uploadedBy: {type: string, format: uuid}}
paths:
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready
        '503':
          description: Dependency is unavailable
  /health:
    get: {responses: {'200': {description: Healthy}, '503': {description: Degraded}}}
  /auth/register:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password, displayName], properties: {email: {type: string}, password: {type: string, minLength: 8}, displayName: {type: string}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {description: Conflict}}
  /auth/login:
    post: {responses: {'200': {description: Session}, '401': {description: Unauthorized}}}
  /auth/refresh:
    post: {responses: {'200': {description: Rotated session}, '401': {description: Invalid or reused refresh token}}}
  /auth/logout:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Logged out}}}
  /auth/password-reset/request:
    post: {responses: {'202': {description: Generic accepted response}, '503': {description: Delivery unavailable}}}
  /auth/password-reset/confirm:
    post: {responses: {'200': {description: Password changed}, '400': {description: Invalid or expired reset token}}}
  /providers/me:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Provider profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderProfile'}}}}}}
  /categories:
    get: {responses: {'200': {description: Categories}}}
  /jobs/recommended:
    get:
      responses:
        '200': {description: Ranked published jobs for discovery with backend-provided ranking metadata}
        '400': {description: Invalid recommendation query or coordinates}
  /jobs:
    get: {responses: {'200': {description: Job list}, '401': {description: Authentication required for private states}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Created job}}}
  /jobs/{id}:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Job}, '404': {description: Not found}}}
  /jobs/{id}/publish:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Published}}}
  /jobs/{id}/start:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Started}, '409': {description: Payment/state conflict}}}
  /jobs/{id}/deliver:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Delivered}}}
  /jobs/{id}/accept:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Completed}}}
  /jobs/{id}/evidence:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Evidence created}}}
  /jobs/{id}/offers:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Offers}}}
  /offers:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Offers visible to the authenticated viewer for a job}
        '400': {description: Missing jobId}
        '404': {description: Job not found}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Offer created}, '409': {description: Duplicate pending offer}}}
  /offers/mine:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Authenticated provider's offers}
  /offers/{id}:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Offer detail visible only to the job owner or offer provider}
        '404': {description: Offer not found}
  /offers/{id}/accept:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Offer accepted}, '409': {description: Concurrent/invalid state}}}
  /applications:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Candidate's applications, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationList'}}}}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Application created}, '409': {description: Application closed or duplicate}}}
  /applications/{id}/withdraw:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Application withdrawn}, '409': {description: Invalid application state}}}
  /admin/summary:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Admin dashboard summary}, '403': {description: Forbidden}}}
  /admin/users:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: User management list}, '403': {description: Forbidden}}}
  /admin/users/{id}/status:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: User status updated}, '400': {description: Invalid status}, '403': {description: Forbidden}}}
  /admin/audit:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Audit event list}, '403': {description: Forbidden}}}
  /admin/security-alerts/{eventId}/replay:
    post:
      security: [{bearerAuth: []}]
      summary: Replay one terminal refresh-token-reuse security alert as the verified primary administrator
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200': {description: Replay queued, or same-key idempotent result}
        '400': {description: Invalid event ID, reason, or idempotency key}
        '403': {description: Requires verified primary admin and current-session WRITE step-up}
        '404': {description: Security alert event not found}
        '409': {description: Event is not replayable or its one replay has already been used}
        '503': {description: PostgreSQL persistence or a valid HTTPS security-alert receiver is unavailable}
  /admin/reconciliation-cases/outbox-events:
    get:
      security: [{bearerAuth: []}]
      summary: List active Outbox-event reconciliation quarantines
      description: Read-only. Requires admin.view_payouts and current-session READ step-up. Returns a versioned SHA-256 digest of the exact reconciliation-case and Outbox evidence snapshot; payloads and raw delivery errors are never returned.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: Active event-scoped financial quarantines, including the opaque reviewed-evidence digest and investigation-only disposition state
          content:
            application/json:
              schema:
                type: object
                required: [cases, hasMore, nextCursor]
                properties:
                  cases:
                    type: array
                    items:
                      type: object
                      required: [id, caseType, resourceType, resourceId, severity, status, caseEvidenceDigest, investigationStatus, reReviewRequired, hasCurrentDigestAttestation]
                      properties:
                        id: {type: string, format: uuid}
                        caseType: {type: string}
                        resourceType: {type: string, enum: [outbox_event]}
                        resourceId: {type: string, format: uuid}
                        severity: {type: string}
                        status: {type: string, enum: [OPEN, INVESTIGATING]}
                        expected: {type: object, additionalProperties: true}
                        observed: {type: object, additionalProperties: true}
                        eventType: {type: string, nullable: true}
                        eventStatus: {type: string, nullable: true}
                        aggregateType: {type: string, nullable: true}
                        aggregateId: {type: string, nullable: true}
                        caseEvidenceDigest: {type: string, pattern: '^[a-f0-9]{64}$', description: Version 1 SHA-256 digest of the case evidence and associated Outbox snapshot; submit unchanged when recording an attestation}
                        investigationStatus: {type: string, enum: [NOT_STARTED, IN_PROGRESS, CLOSED_UNRESOLVED]}
                        reReviewRequired: {type: boolean}
                        hasCurrentDigestAttestation: {type: boolean}
                  hasMore: {type: boolean}
                  nextCursor: {type: string, nullable: true}
        '400': {description: Invalid pagination cursor}
        '403': {description: Requires admin.view_payouts and current-session READ step-up}
  /admin/reconciliation-cases/outbox-events/{caseId}/investigation-notes:
    get:
      security: [{bearerAuth: []}]
      summary: Read append-only investigation history for one Outbox event case
      description: Requires admin.view_payouts and current-session READ step-up. Returns stable actor UUID and evidence provenance, but never session JTI, idempotency key, request hash, or raw provider payload.
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200': {description: Sanitized append-only evidence and disposition history}
        '400': {description: Invalid pagination cursor}
        '403': {description: Requires admin.view_payouts and current-session READ step-up}
        '404': {description: Outbox event reconciliation case not found}
    post:
      security: [{bearerAuth: []}]
      summary: Append a legacy investigation note to an Outbox event case
      description: Requires admin.manage_reconciliation_cases and current-session WRITE step-up. Primary-admin-only. Evidence-only; an investigation note cannot resolve or dismiss the financial case. Closed investigations must be reopened through the attestation endpoint before another note can be appended.
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, evidenceReference, verification, idempotencyKey]
              properties:
                reason: {type: string, minLength: 10, maxLength: 1000}
                evidenceReference: {type: string, minLength: 8, maxLength: 500}
                verification:
                  type: object
                  required: [eventIdentity, canonicalPayout, providerOutcome]
                  properties:
                    eventIdentity: {type: string, enum: [MISMATCH_CONFIRMED, UNRESOLVED]}
                    canonicalPayout: {type: string, enum: [MATCHED, MISMATCHED, NOT_FOUND, NOT_VERIFIED]}
                    providerOutcome: {type: string, enum: [SUCCEEDED_CONFIRMED, FAILED_CONFIRMED, UNKNOWN, NOT_CHECKED]}
                idempotencyKey: {type: string, pattern: '^[A-Za-z0-9._:-]{16,128}$'}
      responses:
        '200': {description: Investigation note appended or same-session idempotent replay}
        '400': {description: Invalid note fields}
        '403': {description: Requires verified primary administrator and current-session WRITE step-up}
        '404': {description: Active Outbox event reconciliation case not found}
        '409': {description: Closed investigation, stale state, or idempotency conflict}
  /admin/reconciliation-cases/outbox-events/{caseId}/investigation-attestations:
    post:
      security: [{bearerAuth: []}]
      summary: Record an event-scoped evidence attestation or investigation disposition
      description: Requires admin.manage_reconciliation_cases, verified Primary Admin identity, and current-session WRITE step-up. Revalidates actor/session inside the SQL transaction. The request must contain the exact caseEvidenceDigest returned by the active queue. Idempotency is actor-plus-key and semantic-payload based; every replay still requires fresh authorization. INVESTIGATION_CLOSED_UNRESOLVED and INVESTIGATION_REOPENED are investigation-only events: the financial reconciliation case stays OPEN/INVESTIGATING and quarantined. This endpoint never changes payout, wallet, Hold, journal, ledger, Outbox delivery state, or calls a provider.
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason, sourceType, issuer, evidenceReference, verification, reviewedCaseDigest, idempotencyKey]
              properties:
                action: {type: string, enum: [INVESTIGATION_ATTESTATION_RECORDED, INVESTIGATION_CLOSED_UNRESOLVED, INVESTIGATION_REOPENED]}
                reason: {type: string, minLength: 10, maxLength: 1000}
                sourceType: {type: string, enum: [BANK_STATEMENT, INTERNAL_LEDGER, OUTBOX_EVENT, OPERATOR_REPORT, PROVIDER_ARTIFACT, SUPPORT_TICKET, OTHER]}
                issuer: {type: string, minLength: 2, maxLength: 160}
                evidenceReference: {type: string, minLength: 8, maxLength: 500, description: Opaque reference only; the server never fetches URLs from this value}
                artifactSha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
                sourceObservedAt: {type: string, format: date-time}
                reviewedCaseDigest: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
                idempotencyKey: {type: string, pattern: '^[A-Za-z0-9._:-]{16,128}$'}
                verification:
                  type: object
                  additionalProperties: false
                  required: [eventIdentity, canonicalPayout, providerOutcome]
                  properties:
                    eventIdentity:
                      type: object
                      additionalProperties: false
                      required: [result, verificationLevel]
                      properties:
                        result: {type: string, enum: [MATCHED, MISMATCH_CONFIRMED, UNRESOLVED, NOT_CHECKED]}
                        verificationLevel: {type: string, enum: [OPERATOR_REPORTED, SOURCE_ARTIFACT_REVIEWED, INDEPENDENTLY_CORROBORATED, CONFLICTING, INCONCLUSIVE, NOT_CHECKED]}
                    canonicalPayout:
                      type: object
                      additionalProperties: false
                      required: [result, verificationLevel]
                      properties:
                        result: {type: string, enum: [MATCHED, MISMATCHED, NOT_FOUND, NOT_VERIFIED, NOT_CHECKED]}
                        verificationLevel: {type: string, enum: [OPERATOR_REPORTED, SOURCE_ARTIFACT_REVIEWED, INDEPENDENTLY_CORROBORATED, CONFLICTING, INCONCLUSIVE, NOT_CHECKED]}
                    providerOutcome:
                      type: object
                      additionalProperties: false
                      required: [result, verificationLevel]
                      properties:
                        result: {type: string, enum: [SUCCEEDED_CONFIRMED, FAILED_CONFIRMED, UNKNOWN, NOT_CHECKED]}
                        verificationLevel: {type: string, enum: [OPERATOR_REPORTED, SOURCE_ARTIFACT_REVIEWED, INDEPENDENTLY_CORROBORATED, CONFLICTING, INCONCLUSIVE, NOT_CHECKED]}
      responses:
        '200': {description: Immutable attestation/disposition appended, or same-actor semantic idempotent replay; financial quarantine remains active}
        '400': {description: Invalid attestation fields or verification values}
        '403': {description: Requires verified Primary Admin identity, dedicated permission and current-session WRITE step-up}
        '404': {description: Exact active Outbox event reconciliation case not found}
        '409': {description: Stale evidence digest, closed/not-closed investigation state, or idempotency conflict}
