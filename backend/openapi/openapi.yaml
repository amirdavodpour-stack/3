                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ChatPresence'}
        '404': {description: Conversation not found or not visible to the participant}
    post:
      security: [{bearerAuth: []}]
      summary: Update the authenticated participant's online and typing state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                online: {type: boolean, default: true}
                typing: {type: boolean, default: false}
      responses:
        '200':
          description: Presence state updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ChatPresenceUpdate'}
        '404': {description: Conversation not found or not visible to the participant}
  /messaging/conversations/{conversationId}/preferences:
    parameters:
      - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      security: [{bearerAuth: []}]
      summary: Update the authenticated participant's pin, importance, or archive preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                isPinned: {type: boolean}
                isImportant: {type: boolean}
                isArchived: {type: boolean}
      responses:
        '200':
          description: Updated per-user conversation preferences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ChatConversationPreferences'}
        '400': {description: Conversation preferences must be boolean}
        '404': {description: Conversation not found or not visible to the participant}
  /messaging/attachments/{attachmentId}/content:
    parameters:
      - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{bearerAuth: []}]
      summary: Download an attachment after participant authorization
      responses:
        '200':
          description: Private binary attachment content
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {description: Attachment not found or not visible to the participant}
  /storage/upload:
    post:
      security: [{bearerAuth: []}]
      summary: Upload one private chat attachment or voice-note source file
      description: >
        Multipart upload accepts only validated PDF, PNG, JPEG, WebP, plain text,
        M4A/MP4 audio, MP3, and WAV data. The server validates content signatures,
        rejects MIME/signature mismatches, and enforces the configured maximum upload size.
        When a multipart client reports application/octet-stream, the server may infer
        a supported MIME only from an allowlisted filename extension and still validates
        the file signature.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Private upload stored and associated with the authenticated uploader
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ChatUpload'}
        '400': {description: Missing, empty, or malformed multipart file}
        '401': {description: Authentication required}
        '413': {description: File exceeds the configured upload size limit}
        '415': {description: Unsupported type, mismatched extension, or invalid file signature}
  /storage/presign:
    post:
      security: [{bearerAuth: []}]
      description: >-
        The response includes `requiredHeaders` for the exact presigned upload
        mode. Send every listed header without modification. Generic S3 mode
        uses `If-None-Match: *`; Supabase Storage uses its native signed-upload
        URL with `x-upsert: false`. Existing objects must never be overwritten; the contract is single-write, with the first successful upload winning.
        `intentExpiresIn` is the HOPE ownership/completion window; Supabase
        signed URL tokens have a separate two-hour lifetime.
      responses: {'200': {description: Presigned upload intent}, '409': {description: Direct upload unsupported}}
  /storage/complete:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Completed upload}, '200': {description: Idempotent existing upload}, '403': {description: Invalid or unauthorized upload intent}, '410': {description: Expired intent}, '415': {description: Content type mismatch}}}

