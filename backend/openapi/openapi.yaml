openapi: 3.0.3
info:
  title: HOPE API
  version: 3.1.0
  description: HOPE marketplace API contract. Payment routes expose the marketplace state machine; the configured payment provider is behind a provider boundary.
servers:
  - url: https://api.example.com/api/v1
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, properties: {code: {type: string}, message: {type: string}, requestId: {type: string}}}
    Wallet:
      type: object
      required: [id, userId, currency, availableBalance, lockedBalance, status]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        currency: {type: string, example: TOMAN}
        availableBalance: {type: string, description: Integer amount in the wallet currency}
        lockedBalance: {type: string, description: Integer amount currently locked}
        status: {type: string, enum: [ACTIVE, SUSPENDED, CLOSED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WalletTransaction:
      type: object
      required: [id, entryType, direction, amount, currency, referenceType, financialOperationId]
      properties:
        id: {type: string, format: uuid}
        entryType: {type: string}
        direction: {type: string, enum: [CREDIT, DEBIT]}
        amount: {type: string}
        currency: {type: string, example: TOMAN}
        referenceType: {type: string}
        referenceId: {type: string, nullable: true}
        financialOperationId: {type: string}
        balanceAfter: {type: string, nullable: true}
        metadata: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time, nullable: true}
    WalletTransactionsPage:
      type: object
      required: [currency, transactions]
      properties:
        currency: {type: string, example: TOMAN}
        transactions:
          type: array
          items: {$ref: '#/components/schemas/WalletTransaction'}
        nextCursor: {type: string, nullable: true}
    Payout:
      type: object
      required: [id, walletId, amount, currency, provider, status, idempotencyKey]
      properties:
        id: {type: string, format: uuid}
        walletId: {type: string, format: uuid}
        amount: {type: string}
        currency: {type: string, example: TOMAN}
        provider: {type: string}
        status: {type: string}
        idempotencyKey: {type: string}
        providerRef: {type: string, nullable: true}
        referenceType: {type: string, nullable: true}
        referenceId: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    PayoutList:
      type: object
      required: [currency, payouts]
      properties:
        currency: {type: string, example: TOMAN}
        payouts:
          type: array
          items: {$ref: '#/components/schemas/Payout'}
    Notification:
      type: object
      required: [id, type, title, body]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        createdAt: {type: string, format: date-time, nullable: true}
        readAt: {type: string, format: date-time, nullable: true}
        data: {type: object, additionalProperties: true}
    NotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        unreadCount: {type: integer, minimum: 0}
    NotificationPreferences:
      type: object
      required: [inApp, push, email, jobAlerts, applicationUpdates, paymentUpdates, marketing]
      properties:
        inApp: {type: boolean}
        push: {type: boolean}
        email: {type: boolean}
        jobAlerts: {type: boolean}
        applicationUpdates: {type: boolean}
        paymentUpdates: {type: boolean}
        marketing: {type: boolean}
    Application:
      type: object
      required: [id, jobId, jobTitle, jobKind, resumeText, skills, status]
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        jobTitle: {type: string}
        jobCity: {type: string, nullable: true}
        jobKind: {type: string, enum: [JOB, MISSION]}
        resumeText: {type: string}
        skills: {type: string}
        status: {type: string, enum: [PENDING, SHORTLISTED, FORWARDED, INTERVIEW, OFFERED, ACCEPTED, REJECTED, WITHDRAWN]}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    ApplicationList:
      type: array
      items: {$ref: '#/components/schemas/Application'}
    ProviderProfile:
      type: object
      required: [providerType, capacity, verificationStatus, trustSignals]
      properties:
        providerType: {type: string}
        capacity: {type: string}
        verificationStatus: {type: string}
        trustSignals: {type: object, additionalProperties: true}
    Session:
      type: object
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        role: {type: string}
    Job:
      type: object
      required: [id, title, description, categoryId, jobType, budgetType, budgetMin, budgetMax, duration, acceptanceCriteria, status, ownerId, providerId, category, owner, provider, offerCount, city, kind, visibility, schedule, monthlySalary, applicationDeadline, feePolicy, createdAt, updatedAt, verticalId, attributes]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        categoryId: {type: string}
        category: {type: object, additionalProperties: true}
        jobType: {type: string, enum: [FIXED, HOURLY, TASK]}
        budgetType: {type: string, enum: [FIXED, RANGE]}
        budgetMin: {type: string, description: Integer amount in the job currency}
        budgetMax: {type: string, description: Integer amount in the job currency}
        duration: {type: integer}
        acceptanceCriteria: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED, ASSIGNED, FUNDED, IN_PROGRESS, DELIVERED, UNDER_REVIEW, COMPLETED, CANCELLED, SETTLED]}
        ownerId: {type: string, format: uuid}
        providerId: {type: string, format: uuid, nullable: true}
        owner: {type: object, nullable: true, additionalProperties: true}
        provider: {type: object, nullable: true, additionalProperties: true}
        offerCount: {type: integer, minimum: 0}
        city: {type: string, nullable: true}
        kind: {type: string, enum: [JOB, MISSION]}
        visibility: {type: string, enum: [PUBLIC, PRIVATE]}
        schedule: {type: string, nullable: true}
        monthlySalary: {type: string, nullable: true, description: Integer amount in the job currency}
        applicationDeadline: {type: string, format: date, nullable: true}
        feePolicy: {type: object, required: [employerRate, candidateRate, model], properties: {employerRate: {type: number}, candidateRate: {type: number}, model: {type: string}}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        verticalId: {type: string, format: uuid, nullable: true}
        attributes: {type: object, additionalProperties: true}
    Offer:
      type: object
      required: [id, jobId, providerId, price, message, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        providerId: {type: string, format: uuid}
        price: {type: string, description: Integer amount in the job currency}
        message: {type: string}
        status: {type: string}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    Payment:
      type: object
      required: [status, amount, job]
      properties:
        id: {type: string, format: uuid, nullable: true}
        jobId: {type: string, format: uuid, nullable: true}
        amount: {type: string, nullable: true, description: Integer amount in the payment currency}
        status: {type: string, enum: [NO_TRANSACTION, HOLD_PENDING, HELD, HOLD_FAILED, REFUND_PENDING, REFUNDED, RELEASE_PENDING, RELEASE_FAILED, RELEASED]}
        paymentStatus: {type: string}
        providerRef: {type: string, nullable: true}
        job: {$ref: '#/components/schemas/Job'}
        fees: {$ref: '#/components/schemas/PaymentFees'}
        createdAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    PaymentFees:
      type: object
      required: [baseAmount, employerFee, workerFee, platformFee, employerCharge, providerPayout, policyVersion, currency]
      properties:
        baseAmount: {type: string, nullable: true}
        employerFee: {type: string}
        workerFee: {type: string}
        platformFee: {type: string}
        employerCharge: {type: string}
        providerPayout: {type: string}
        policyVersion: {type: string}
        currency: {type: string}
    UploadIntent:
      type: object
      properties: {intentId: {type: string, format: uuid}, key: {type: string}, url: {type: string, format: uri}, uploadedBy: {type: string, format: uuid}}
paths:
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready
        '503':
          description: Dependency is unavailable
  /health:
    get: {responses: {'200': {description: Healthy}, '503': {description: Degraded}}}
  /auth/register:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password, displayName], properties: {email: {type: string}, password: {type: string, minLength: 8}, displayName: {type: string}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {description: Conflict}}
  /auth/login:
    post: {responses: {'200': {description: Session}, '401': {description: Unauthorized}}}
  /auth/refresh:
    post: {responses: {'200': {description: Rotated session}, '401': {description: Invalid or reused refresh token}}}
  /auth/logout:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Logged out}}}
  /auth/password-reset/request:
    post: {responses: {'202': {description: Generic accepted response}, '503': {description: Delivery unavailable}}}
  /auth/password-reset/confirm:
    post: {responses: {'200': {description: Password changed}, '400': {description: Invalid or expired reset token}}}
  /providers/me:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Provider profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderProfile'}}}}}}
  /categories:
    get: {responses: {'200': {description: Categories}}}
  /jobs/recommended:
    get:
      responses:
        '200': {description: Ranked published jobs for discovery with backend-provided ranking metadata}
        '400': {description: Invalid recommendation query or coordinates}
  /jobs:
    get: {responses: {'200': {description: Job list}, '401': {description: Authentication required for private states}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Created job}}}
  /jobs/{id}:
    get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Job}, '404': {description: Not found}}}
  /jobs/{id}/publish:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Published}}}
  /jobs/{id}/start:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Started}, '409': {description: Payment/state conflict}}}
  /jobs/{id}/deliver:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Delivered}}}
  /jobs/{id}/accept:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Completed}}}
  /jobs/{id}/evidence:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Evidence created}}}
  /jobs/{id}/offers:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Offers}}}
  /offers:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Offers visible to the authenticated viewer for a job}
        '400': {description: Missing jobId}
        '404': {description: Job not found}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Offer created}, '409': {description: Duplicate pending offer}}}
  /offers/mine:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Authenticated provider's offers}
  /offers/{id}:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Offer detail visible only to the job owner or offer provider}
        '404': {description: Offer not found}
  /offers/{id}/accept:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Offer accepted}, '409': {description: Concurrent/invalid state}}}
  /applications:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Candidate's applications, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationList'}}}}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Application created}, '409': {description: Application closed or duplicate}}}
  /applications/{id}/withdraw:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Application withdrawn}, '409': {description: Invalid application state}}}
  /admin/summary:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Admin dashboard summary}, '403': {description: Forbidden}}}
  /admin/users:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: User management list}, '403': {description: Forbidden}}}
  /admin/users/{id}/status:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: User status updated}, '400': {description: Invalid status}, '403': {description: Forbidden}}}
  /admin/audit:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Audit event list}, '403': {description: Forbidden}}}
  /admin/jobs/{id}/moderate:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Opportunity moderation result}, '403': {description: Forbidden}, '409': {description: Opportunity is locked by lifecycle state}}}
  /admin/applications/{id}/shortlist:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Application shortlisted}, '403': {description: Forbidden}}}
  /admin/applications/{id}/select:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Candidate forwarded to employer}, '409': {description: Invalid application state}}}
  /admin/applications/{id}/reject:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Application rejected}, '409': {description: Invalid application state}}}
  /jobs/{id}/candidates:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Forwarded candidates with identity minimized}}}
  /jobs/{id}/candidates/{applicationId}/interview:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Interview stage}}}
  /jobs/{id}/candidates/{applicationId}/offer:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Offer stage}}}
  /jobs/{id}/candidates/{applicationId}/hire:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Candidate hired}, '409': {description: Another candidate is already hired}}}
  /payments/jobs/{jobId}:
    get: {security: [{bearerAuth: []}], parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Payment status}}}
  /payments/fund/{jobId}:
    post: {security: [{bearerAuth: []}], parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], responses: {'201': {description: Funded}, '200': {description: Idempotent replay}, '409': {description: State conflict}}}
  /payments/release/{jobId}:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Released}, '409': {description: Payment state conflict}}}
  /storage/upload:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Uploaded}}}
  /storage/presign:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Presigned upload intent}, '409': {description: Direct upload unsupported}}}
  /storage/complete:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Completed upload}, '200': {description: Idempotent existing upload}, '403': {description: Invalid or unauthorized upload intent}, '410': {description: Expired intent}, '415': {description: Content type mismatch}}}

  /payments/refund/{jobId}:
    post:
      summary: Request a full payment refund before work release
  /payments/financials/{jobId}:
    get:
      summary: Get participant-safe payment breakdown and ledger
  /payments/webhook:
    post:
      summary: Receive a signed payment-provider webhook
  /admin/finance/summary:
    get:
      summary: Get platform financial summary

  /jobs/mine:
    get:
      security: [{bearerAuth: []}]
      summary: List the authenticated provider's jobs
      responses:
        '200': {description: Provider jobs}
  /providers/me:
    get:
      security: [{bearerAuth: []}]
      summary: Get the authenticated provider profile
      responses:
        '200': {description: Provider profile, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderProfile'}}}}
  /notifications:
    get:
      security: [{bearerAuth: []}]
      summary: List authenticated-user notifications
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Notification page, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
  /notifications/{id}/read:
    post:
      security: [{bearerAuth: []}]
      summary: Mark a notification as read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Notification, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
  /notifications/read-all:
    post:
      security: [{bearerAuth: []}]
      summary: Mark all notifications as read
      responses:
        '200': {description: Updated notification count}
  /notifications/preferences:
    get:
      security: [{bearerAuth: []}]
      summary: Get notification preferences
      responses:
        '200': {description: Notification preferences}
    put:
      security: [{bearerAuth: []}]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: {type: boolean}}
      responses:
        '200': {description: Updated notification preferences, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
  /wallet/me:
    get:
      security: [{bearerAuth: []}]
      summary: Get authenticated user's wallet
      responses:
        '200': {description: Wallet, content: {application/json: {schema: {type: object, properties: {wallet: {$ref: '#/components/schemas/Wallet'}, currency: {type: string}}}}}}
  /wallet/transactions:
    get:
      security: [{bearerAuth: []}]
      summary: List wallet transactions
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Wallet transactions page, content: {application/json: {schema: {$ref: '#/components/schemas/WalletTransactionsPage'}}}}
  /wallet/payouts:
    get:
      security: [{bearerAuth: []}]
      summary: List wallet payouts
      responses:
        '200': {description: Wallet payouts, content: {application/json: {schema: {$ref: '#/components/schemas/PayoutList'}}}}
  /wallet/transfer:
    post:
      security: [{bearerAuth: []}]
      summary: Transfer wallet funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationWalletId, amount, idempotencyKey]
              properties:
                destinationWalletId: {type: string}
                amount: {type: string}
                idempotencyKey: {type: string}
      responses:
        '200': {description: Transfer result}
        '409': {description: Wallet or idempotency conflict}
  /wallet/withdraw:
    post:
      security: [{bearerAuth: []}]
      summary: Request a wallet payout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotencyKey]
              properties:
                amount: {type: string}
                idempotencyKey: {type: string}
      responses:
        '202': {description: Payout accepted, content: {application/json: {schema: {type: object, properties: {payout: {$ref: '#/components/schemas/Payout'}, currency: {type: string}, status: {type: string}}}}}}
        '409': {description: Wallet or idempotency conflict}
  /wallet/top-up:
    post:
      security: [{bearerAuth: []}]
      summary: Top up the wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotencyKey]
              properties:
                amount: {type: string}
                idempotencyKey: {type: string}
      responses:
        '200': {description: Top-up result}
        '409': {description: Wallet or idempotency conflict}
  /saved-searches:
    get:
      security: [{bearerAuth: []}]
      summary: List saved searches
      responses:
        '200': {description: Saved searches}
    put:
      security: [{bearerAuth: []}]
      summary: Create or update a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: {type: string}
                name: {type: string}
                query: {type: string}
                kind: {type: string}
                visibility: {type: string}
                city: {type: string}
                category: {type: string}
                updatedAt: {type: string}
      responses:
        '200': {description: Saved search}
    delete:
      description: Not implemented; deletion is addressed by the item route.
      responses:
        '405': {description: Method not allowed}
  /saved-searches/{id}:
    delete:
      security: [{bearerAuth: []}]
      summary: Delete a saved search
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Deleted}
  /admin/jobs:
    get:
      security: [{bearerAuth: []}]
      summary: List jobs for admin moderation
      responses:
        '200': {description: Admin jobs}
  /admin/jobs/{id}:
    delete:
      security: [{bearerAuth: []}]
      summary: Delete an admin-visible job
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Deleted}
  /admin/applications:
    get:
      security: [{bearerAuth: []}]
      summary: List applications for admin review
      responses:
        '200': {description: Admin applications}

  /notifications/devices:
    get:
      security: [{bearerAuth: []}]
      summary: List registered notification devices
      responses:
        '200': {description: Notification devices}
    post:
      security: [{bearerAuth: []}]
      summary: Register a notification device
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Device registration result}
  /notifications/devices/{deviceId}:
    delete:
      security: [{bearerAuth: []}]
      summary: Unregister a notification device
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Device unregistered}
