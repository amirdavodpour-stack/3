name: HOPE One-shot Backend Check All

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17

permissions:
  contents: write

jobs:
  check-all:
    name: Backend check:all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4d2c9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend check:all
        id: check_all
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run check:all 2>&1 | tee "$RUNNER_TEMP/check-all.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload check:all log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-check-all-${{ github.run_id }}
          path: ${{ runner.temp }}/check-all.log
          if-no-files-found: error

      - name: Remove one-shot verifier
        if: ${{ always() }}
        shell: bash
        env:
          RESULT: ${{ steps.check_all.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/hope-one-shot-check-all.yml
          git commit -m "[CI-CLEANUP] remove one-shot check-all verifier" || true
          git push origin HEAD:hope/full-stack-hardening-2026-09-17
