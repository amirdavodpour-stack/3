name: HOPE analyzer cleanup (one-shot)

on:
  push:
    branches:
      - feat/google-sign-in-2026-09-20

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[analyzer-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify lockfile and dependencies
        run: |
          bash tools/verify-pubspec-lock-fresh.sh
          flutter pub get --enforce-lockfile

      - name: Preview analyzer fixes
        run: dart fix --dry-run

      - name: Apply analyzer fixes
        run: dart fix --apply

      - name: Analyze after cleanup
        run: flutter analyze

      - name: Full Flutter tests
        run: timeout --foreground --signal=TERM --kill-after=30s 15m flutter test --no-pub

      - name: Commit cleanup and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hope-analyzer-cleanup-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No analyzer changes were produced."
            exit 0
          fi
          git commit -m "fix(flutter): clear analyzer diagnostics [analyzer-cleanup] [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
