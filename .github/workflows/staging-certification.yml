name: Staging certification

on:
  push:
    branches:
      - feat/staging-ntfy-provider-2026-09-18
      - chore/staging-dr-recovery-2026-09-18
  pull_request:
    branches:
      - Main
      - hope/full-stack-hardening-2026-09-17
  workflow_call:
    secrets:
      STAGING_BASE_URL:
        required: false
      API_BASE_URL_STAGING:
        required: false
      STAGING_DATABASE_URL:
        required: false
      RAILWAY_TOKEN:
        required: false
      RAILWAY_API_TOKEN:
        required: false
      RAILWAY_SSH_PRIVATE_KEY:
        required: false
      SOURCE_DATABASE_URL:
        required: false
      DRILL_DATABASE_URL:
        required: false
      STAGING_S3_ENDPOINT:
        required: false
      STAGING_S3_BUCKET:
        required: false
      STAGING_S3_REGION:
        required: false
      STAGING_AWS_ACCESS_KEY_ID:
        required: false
      STAGING_AWS_SECRET_ACCESS_KEY:
        required: false
      STAGING_METRICS_TOKEN:
        required: false
      STAGING_PRODUCT_PASSWORD:
        required: false
      PAYMENT_PROVIDER_TOKEN:
        required: false
      PAYMENT_PROVIDER_CREATE_URL:
        required: false
      PAYMENT_PROVIDER_RELEASE_URL:
        required: false
      PAYMENT_PROVIDER_REFUND_URL:
        required: false
      NOTIFICATION_PUSH_URL:
        required: false
      NOTIFICATION_EMAIL_URL:
        required: false
      NOTIFICATION_PROVIDER_TOKEN:
        required: false
      POSTHOG_PROJECT_TOKEN:
        required: false
      POSTHOG_HOST:
        required: false
  workflow_dispatch:

concurrency:
  group: hope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-certification:
    name: Staging certification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      certification_run_id: ${{ github.run_id }}
      certification_status: ${{ steps.certification_status.outputs.certification_status }}
      certification_sha: ${{ steps.certification_status.outputs.certification_sha }}
      certification_attempt: ${{ steps.certification_status.outputs.certification_attempt }}
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || secrets.API_BASE_URL_STAGING || 'https://v2hope-production-7e9e.up.railway.app' }}
      STAGING_PAYMENT_PROVIDER: internal
      STAGING_PAYMENT_CURRENCY: TOMAN
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || secrets.SOURCE_DATABASE_URL }}
      DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
      STAGING_S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
      STAGING_S3_BUCKET: ${{ secrets.STAGING_S3_BUCKET }}
      STAGING_S3_REGION: ${{ secrets.STAGING_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN || secrets.METRICS_TOKEN }}
      STAGING_PRODUCT_PASSWORD: ${{ secrets.STAGING_PRODUCT_PASSWORD }}
      PAYMENT_PROVIDER_TOKEN: ${{ secrets.PAYMENT_PROVIDER_TOKEN }}
      PAYMENT_PROVIDER_CREATE_URL: ${{ secrets.PAYMENT_PROVIDER_CREATE_URL }}
      PAYMENT_PROVIDER_RELEASE_URL: ${{ secrets.PAYMENT_PROVIDER_RELEASE_URL }}
      PAYMENT_PROVIDER_REFUND_URL: ${{ secrets.PAYMENT_PROVIDER_REFUND_URL }}
      NOTIFICATION_PUSH_URL: ${{ secrets.NOTIFICATION_PUSH_URL }}
      NOTIFICATION_EMAIL_URL: ${{ secrets.NOTIFICATION_EMAIL_URL }}
      NOTIFICATION_PROVIDER_TOKEN: ${{ secrets.NOTIFICATION_PROVIDER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install adb for runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          adb version

      - name: Install PostgreSQL 18 client for DR
        shell: bash
        run: |
          set -euo pipefail
          if ! apt-cache show postgresql-client-18 >/dev/null 2>&1; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/pgdg.asc >/dev/null
            echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -y
          fi
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Runtime certification preflight
        run: bash tools/runtime-certification-preflight.sh

      - name: Verify Flutter lockfile
        run: bash tools/verify-pubspec-lock-fresh.sh

      - name: Staging external integration gate
        id: provider_integration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${STAGING_BASE_URL:-}" ] || { echo 'STAGING_BASE_URL is required.' >&2; exit 1; }
          [[ "$STAGING_BASE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo 'STAGING_BASE_URL must use HTTPS and contain no whitespace.' >&2; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 20 "$STAGING_BASE_URL/live" >/tmp/staging-live.json
          case "${STAGING_PAYMENT_PROVIDER:-}" in
            internal)
              [ "${STAGING_PAYMENT_CURRENCY:-}" = 'TOMAN' ] || { echo 'Internal staging payment mode requires PAYMENT_CURRENCY=TOMAN.' >&2; exit 1; }
              echo 'staging payment provider: internal (no external PSP required)'
              ;;
            webhook)
              node -e "const u=process.env.PAYMENT_PROVIDER_CREATE_URL;if(!u)throw new Error('PAYMENT_PROVIDER_CREATE_URL is required for webhook staging external integration');new URL(u);if(!u.startsWith('https://'))throw new Error('PAYMENT_PROVIDER_CREATE_URL must use HTTPS');console.log('payment provider endpoint configured:',new URL(u).origin)"
              ;;
            *)
              echo "Unsupported STAGING_PAYMENT_PROVIDER=${STAGING_PAYMENT_PROVIDER:-unset}; expected internal or webhook." >&2
              exit 1
              ;;
          esac

      - name: Staging product workflow
        id: product_workflow
        working-directory: backend
        env:
          STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: node ../tools/staging-product-smoke.mjs

      - name: Notification delivery
        id: notification_delivery
        if: ${{ env.NOTIFICATION_PROVIDER_TOKEN != '' && (env.NOTIFICATION_PUSH_URL != '' || env.NOTIFICATION_EMAIL_URL != '') }}
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          node ../tools/staging-notification-delivery.mjs 2>&1 | tee "$RUNNER_TEMP/staging-notification-delivery.log"

      - name: Postgres runtime probe
        id: postgres_runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-connrefused --max-time 20 "$STAGING_BASE_URL/ready" >/tmp/staging-ready.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/staging-ready.json', 'utf8'));
          const ready = body?.data?.ready === true || body?.ready === true;
          const databaseStatus = body?.data?.database?.status ?? body?.database?.status;
          const database = body?.data?.database ?? body?.database;
          if (!ready || databaseStatus !== 'ok') {
            throw new Error(`Staging readiness did not confirm PostgreSQL health: ${JSON.stringify(body)}`);
          }
          console.log(JSON.stringify({ status: 'PASS', database }));
          NODE

      - name: Runtime gate - postgres
        id: postgres_runtime_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.postgres_runtime.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate postgres_runtime \
            --command 'GET /ready with database health assertion' \
            --result "$GATE_RESULT"

      - name: S3 runtime probe
        id: s3_runtime
        if: ${{ env.STAGING_S3_ENDPOINT != '' && env.STAGING_S3_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        working-directory: backend
        env:
          STAGING_S3_ENDPOINT: ${{ env.STAGING_S3_ENDPOINT }}
          S3_ENDPOINT: ${{ env.STAGING_S3_ENDPOINT }}
          S3_BUCKET: ${{ env.STAGING_S3_BUCKET }}
          S3_REGION: ${{ env.STAGING_S3_REGION }}
          S3_REQUIRE_HTTPS: '0'
          S3_INTEGRATION: '1'
          S3_REQUIRE_LIVE: '1'
          S3_FORCE_PATH_STYLE: 'true'
        run: |
          set -euo pipefail
          node tests/s3-integration.test.mjs

      - name: Runtime gate - s3
        id: s3_runtime_evidence
        if: ${{ always() && steps.s3_runtime.outcome != 'skipped' }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.s3_runtime.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate s3_runtime \
            --command 'S3_INTEGRATION=1 node tests/s3-integration.test.mjs' \
            --result "$GATE_RESULT"

      - name: Staging performance smoke
        id: perf_gate
        working-directory: backend
        env:
          PERF_BASE_URL: ${{ env.STAGING_BASE_URL }}
          PERF_REQUESTS: '500'
          PERF_CONCURRENCY: '50'
          PERF_P95_BUDGET_MS: '500'
          PERF_P99_BUDGET_MS: '1000'
          PERF_MAX_5XX_RATE: '0.01'
        run: node ../tools/perf-smoke.mjs

      - name: Runtime gate - performance
        id: perf_runtime_evidence
        if: ${{ always() && steps.perf_gate.outcome != 'skipped' }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.perf_gate.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate perf_run \
            --command 'PERF_REQUESTS=500 PERF_CONCURRENCY=50 PERF_P95_BUDGET_MS=500 PERF_P99_BUDGET_MS=1000 PERF_MAX_5XX_RATE=0.01 node ../tools/perf-smoke.mjs' \
            --result "$GATE_RESULT" \
            --artifact perf-smoke.json

      - name: PostHog staging ingestion preflight
        id: posthog_runtime
        shell: bash
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_PROJECT_TOKEN:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'PostHog staging ingestion preflight: SKIPPED (no project token configured)'
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          node --input-type=module - <<'NODE'
          const rawHost = (process.env.POSTHOG_HOST || '').trim();
          const token = process.env.POSTHOG_PROJECT_TOKEN || '';
          if (!rawHost) throw new Error('POSTHOG_HOST is required when PostHog is configured.');
          if (!token) throw new Error('POSTHOG_PROJECT_TOKEN is required.');
          let parsed;
          try {
            parsed = new URL(rawHost);
          } catch {
            throw new Error('POSTHOG_HOST must be a valid HTTPS URL.');
          }
          if (parsed.protocol !== 'https:' || parsed.username || parsed.password || parsed.search || parsed.hash) {
            throw new Error('POSTHOG_HOST must be an HTTPS host URL without credentials, query, or fragment.');
          }
          const hostAliases = new Map([
            ['eu.posthog.com', 'https://eu.i.posthog.com'],
            ['us.posthog.com', 'https://us.i.posthog.com'],
          ]);
          const host = hostAliases.get(parsed.hostname);
          const resolvedHost = host ?? (parsed.hostname === 'eu.i.posthog.com' || parsed.hostname === 'us.i.posthog.com'
            ? 'https://' + parsed.hostname
            : '');
          if (!resolvedHost) {
            throw new Error('POSTHOG_HOST must use the PostHog EU/US ingestion host (for example https://eu.i.posthog.com).');
          }
          const response = await fetch(resolvedHost + '/i/v0/e/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
            body: JSON.stringify({
              api_key: token,
              event: 'hope_staging_ingestion_smoke',
              distinct_id: 'ci-staging-' + process.env.GITHUB_RUN_ID,
              properties: {
                '$process_person_profile': false,
                environment: 'staging',
                source: 'github_actions',
                result: 'preflight'
              }
            })
          });
          if (!response.ok) throw new Error('PostHog ingestion preflight failed: HTTP ' + response.status);
          console.log('PostHog staging ingestion preflight: PASS');
          NODE

      - name: Runtime gate - PostHog
        id: posthog_runtime_evidence
        if: ${{ always() && steps.posthog_runtime.outputs.configured == 'true' }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.posthog_runtime.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate posthog_runtime \
            --command 'POST /i/v0/e/ with staging smoke event' \
            --result "$GATE_RESULT"

      - name: Android quality gates
        id: android_quality
        env:
          API_BASE_URL: ${{ env.STAGING_BASE_URL }}
          BUILD_PROFILE: pilot
          HOPE_ENV: staging
          POSTHOG_ENABLED: ${{ secrets.POSTHOG_PROJECT_TOKEN != '' && 'true' || 'false' }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: bash tools/build_apk_debug.sh

      # Uses a Railway Project Token when available; falls back to the workspace API token
      # with a run-scoped workspace SSH key for GitHub-hosted DR access.
      - name: Start Railway Postgres SSH tunnel for DR
        id: postgres_tunnel
        if: ${{ env.DATABASE_URL != '' && env.DRILL_DATABASE_URL != '' }}
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${RAILWAY_SSH_PRIVATE_KEY:?RAILWAY_SSH_PRIVATE_KEY is required for the GitHub-hosted DR tunnel}"

          RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n')"
          RAILWAY_API_TOKEN="$(printf '%s' "${RAILWAY_API_TOKEN:-}" | tr -d '\r\n')"
          RAILWAY_SSH_PRIVATE_KEY="$(printf '%s' "$RAILWAY_SSH_PRIVATE_KEY" | tr -d '\r')"

          install -d -m 700 "$HOME/.ssh"
          umask 077
          raw_key="$RAILWAY_SSH_PRIVATE_KEY"
          key_file="$HOME/.ssh/id_ed25519"
          if printf '%s' "$raw_key" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            printf '%s\n' "$raw_key" | sed 's/\\\\n/\n/g' > "$key_file"
          else
            compact_key="$(printf '%s' "$raw_key" | tr -d '[:space:]')"
            decoded_key="$RUNNER_TEMP/railway-dr-key.bin"
            if ! printf '%s' "$compact_key" | base64 --decode > "$decoded_key" 2>/dev/null; then
              echo 'RAILWAY_SSH_PRIVATE_KEY is neither an armored private key nor valid base64' >&2
              exit 1
            fi
            if head -c 15 "$decoded_key" | grep -aq '^openssh-key-v1'; then
              {
                printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
                base64 --wrap=64 "$decoded_key"
                printf '%s\n' '-----END OPENSSH PRIVATE KEY-----'
              } > "$key_file"
            else
              decoded_text="$RUNNER_TEMP/railway-dr-key.txt"
              tr -d '\r' < "$decoded_key" > "$decoded_text"
              grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$decoded_text" || { echo 'Decoded Railway SSH secret is not an OpenSSH private key' >&2; exit 1; }
              cat "$decoded_text" > "$key_file"
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$HOME/.ssh/id_ed25519.pub"
          key_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/id_ed25519.pub" | awk '{print $2}')"
          echo "RAILWAY_SSH_KEY_FINGERPRINT=$key_fingerprint"
          test "$key_fingerprint" = 'SHA256:/Lrb+F+ajiLSfE93dOL7jMsajR7AMlKoSNTLchVjn3w'

          npm install -g --allow-scripts=@railway/cli @railway/cli@5.30.1 >/dev/null
          project_id='8c686259-09c6-4609-bbe7-4ea25e769e18'
          environment_id='5a435e97-1e7a-4a5c-952c-19da2f10d955'
          workspace_id='e6af3417-6d75-46e1-b1e3-e1aae3374974'

          tunnel_log="$RUNNER_TEMP/railway-postgres-tunnel.log"
          tunnel_pid="$RUNNER_TEMP/railway-postgres-tunnel.pid"
          rm -f "$tunnel_log" "$tunnel_pid"

          project_ok=false
          if [ -n "$RAILWAY_TOKEN" ]; then
            env -u RAILWAY_API_TOKEN -u RAILWAY_TOKEN RAILWAY_TOKEN="$RAILWAY_TOKEN" \
              railway connect Postgres --tunnel-only --port 15432 \
              --project "$project_id" --environment "$environment_id" \
              >"$tunnel_log" 2>&1 &
            echo $! > "$tunnel_pid"
            for _ in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then
                project_ok=true
                echo 'Railway Postgres SSH tunnel is ready (project token auth).'
                break
              fi
              if ! kill -0 "$(cat "$tunnel_pid")" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [ "$project_ok" != true ]; then
              cat "$tunnel_log" >&2 || true
              kill "$(cat "$tunnel_pid")" 2>/dev/null || true
              rm -f "$tunnel_pid"
              echo 'Railway project token rejected; trying workspace API-token fallback.'
            fi
          fi

          if [ "$project_ok" != true ]; then
            : "${RAILWAY_API_TOKEN:?RAILWAY_API_TOKEN is required for the workspace fallback}"
            rm -f "$key_file" "$HOME/.ssh/id_ed25519.pub"
            ssh-keygen -t ed25519 -N '' -C "hope-github-actions-dr-$GITHUB_RUN_ID" -f "$key_file" >/dev/null
            chmod 600 "$key_file"
            workspace_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/id_ed25519.pub" | awk '{print $2}')"
            echo "Generated workspace SSH key: $workspace_fingerprint"
            workspace_key_name="hope-github-actions-dr-$GITHUB_RUN_ID"
            env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN" \
              railway ssh keys add --workspace "$workspace_id" \
              --key "$HOME/.ssh/id_ed25519.pub" --name "$workspace_key_name"
            echo 'Registered run-scoped workspace SSH key.'
            cleanup_workspace_key() {
              set +e
              env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN" \
                railway ssh keys remove --workspace "$workspace_id" "$workspace_key_name" >/tmp/hope-dr-key-cleanup.log 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "Removed run-scoped workspace SSH key: $workspace_key_name"
              else
                echo "Warning: could not remove run-scoped workspace SSH key: $workspace_key_name" >&2
                cat /tmp/hope-dr-key-cleanup.log >&2 || true
              fi
              return 0
            }
            # Remove the run-scoped workspace key when the job exits, including failures.
            trap cleanup_workspace_key EXIT

            rm -f "$tunnel_log" "$tunnel_pid"
            env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN" \
              railway connect Postgres --tunnel-only --port 15432 \
              --project "$project_id" --environment "$environment_id" \
              >"$tunnel_log" 2>&1 &
            echo $! > "$tunnel_pid"
            for _ in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then
                echo 'Railway Postgres SSH tunnel is ready (workspace API token auth).'
                break
              fi
              if ! kill -0 "$(cat "$tunnel_pid")" 2>/dev/null; then
                cat "$tunnel_log" >&2
                exit 1
              fi
              sleep 1
            done
          fi

          pg_isready -h 127.0.0.1 -p 15432

      - name: Prepare tunneled source URL
        id: tunneled_source
        if: ${{ env.DATABASE_URL != '' && env.DRILL_DATABASE_URL != '' }}
        shell: bash
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          source_url="$(node -e 'const u=new URL(process.env.DATABASE_URL); u.hostname="127.0.0.1"; u.port="15432"; process.stdout.write(u.toString())')"
          echo "SOURCE_DATABASE_TUNNELED_URL=$source_url" >> "$GITHUB_ENV"

      - name: DR restore drill
        id: dr_drill
        if: ${{ env.DATABASE_URL != '' && env.DRILL_DATABASE_URL != '' }}
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          DRILL_DATABASE_URL: ${{ env.DRILL_DATABASE_URL }}
          RTO_TARGET_SECONDS: '900'
          DRILL_EVIDENCE_FILE: ${{ runner.temp }}/hope-dr-restore-evidence.txt
        run: |
          set -euo pipefail
          SOURCE_DATABASE_URL="$SOURCE_DATABASE_TUNNELED_URL" bash backend/scripts/dr-restore-drill.sh

      - name: Runtime gate - dr restore
        id: dr_restore_evidence
        if: ${{ always() && steps.dr_drill.outcome != 'skipped' }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.dr_drill.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate dr_restore \
            --command 'bash backend/scripts/dr-restore-drill.sh' \
            --result "$GATE_RESULT" \
            --artifact "$RUNNER_TEMP/hope-dr-restore-evidence.txt"

      - name: Resolve staging host for Android guest fallback
        id: resolve_staging_host
        shell: bash
        env:
          STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          host="$(node -e "console.log(new URL(process.env.STAGING_BASE_URL).hostname)")"
          ips="$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u | paste -sd, -)"
          test -n "$ips" || { echo "Runner DNS could not resolve $host." >&2; exit 1; }
          echo "Resolved $host to $ips"
          echo "ips=$ips" >> "$GITHUB_OUTPUT"

      - name: Android emulator certification
        id: emulator_certification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          API_BASE_URL_STAGING: ${{ env.STAGING_BASE_URL }}
          CI_DEVICE_INTEGRATION: 'true'
          POSTHOG_ENABLED: ${{ secrets.POSTHOG_PROJECT_TOKEN != '' && 'true' || 'false' }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 1.1.1.1,8.8.8.8 -writable-system
          # Keep the guest stable on GitHub-hosted Linux; animations are not required by the runtime smoke suite.
          disable-animations: true
          script: |
            export STAGING_RESOLVED_IPS="${{ steps.resolve_staging_host.outputs.ips }}"
            bash tools/android-staging-network-preflight.sh
            flutter test --no-pub integration_test/runtime/app_smoke_test.dart \
              --dart-define=API_BASE_URL="$API_BASE_URL_STAGING" \
              --dart-define=CI_DEVICE_INTEGRATION=true \
              --dart-define=HOPE_ENV=staging \
              --dart-define=POSTHOG_ENABLED="${POSTHOG_ENABLED:-false}" \
              --dart-define=POSTHOG_PROJECT_TOKEN="${POSTHOG_PROJECT_TOKEN:-}" \
              --dart-define=POSTHOG_HOST="${POSTHOG_HOST:-https://us.i.posthog.com}"

      - name: Runtime gate - device certification
        id: device_runtime_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.emulator_certification.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate device_certification \
            --command 'flutter test --no-pub integration_test/runtime/app_smoke_test.dart' \
            --result "$GATE_RESULT"

      - name: Runtime gate - provider runtime
        id: provider_runtime_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ (steps.product_workflow.outcome == 'success' && (steps.notification_delivery.outcome == 'success' || steps.notification_delivery.outcome == 'skipped')) && 'pass' || 'fail' }}
        run: |
          if [ "${{ steps.notification_delivery.conclusion }}" != 'skipped' ]; then
            CI=true node tools/write-evidence.mjs \
              --gate provider_runtime \
              --command 'staging-product-smoke + staging-notification-delivery' \
              --result "$GATE_RESULT" \
              --note 'Final human receipt is attested by the provider, not by this run.'
          fi

      - name: Staging operational gate
        id: operational_gate
        if: ${{ always() && steps.provider_integration.outcome == 'success' && (steps.notification_delivery.outcome == 'success' || steps.notification_delivery.outcome == 'skipped') && (steps.dr_drill.outcome == 'success' || steps.dr_drill.outcome == 'skipped') }}
        working-directory: backend
        env:
          STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
          STAGING_METRICS_TOKEN: ${{ env.STAGING_METRICS_TOKEN }}
        run: node ../tools/staging-operational-gate.mjs

      - name: Emit certification status
        id: certification_status
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          status=PASS
          for result in \
            "${{ steps.provider_integration.outcome }}" \
            "${{ steps.product_workflow.outcome }}" \
            "${{ steps.notification_delivery.outcome }}" \
            "${{ steps.postgres_runtime.outcome }}" \
            "${{ steps.s3_runtime.outcome }}" \
            "${{ steps.perf_gate.outcome }}" \
            "${{ steps.android_quality.outcome }}" \
            "${{ steps.dr_drill.outcome }}" \
            "${{ steps.emulator_certification.outcome }}" \
            "${{ steps.operational_gate.outcome }}"; do
            case "$result" in
              success|skipped) ;;
              *) status=BLOCKED ;;
            esac
          done

          # PostHog is optional when no credential is configured, but once the
          # staging project token exists its ingestion preflight is a required
          # certification gate.
          if [ "${{ steps.posthog_runtime.outputs.configured }}" = "true" ] &&              [ "${{ steps.posthog_runtime.outcome }}" != "success" ]; then
            status=BLOCKED
          fi

          echo "certification_status=$status" >> "$GITHUB_OUTPUT"
          echo "certification_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "certification_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "certification_attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          printf 'certification_status=%s\ncertification_run_id=%s\ncertification_sha=%s\ncertification_attempt=%s\n' "$status" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"

      - name: Upload staging certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-staging-certification-evidence-${{ github.run_id }}
          path: |
            docs/audit/evidence/*.json
            backend/perf-smoke.json
            ${{ runner.temp }}/hope-dr-restore-evidence.txt
            ${{ runner.temp }}/staging-notification-delivery.log
          if-no-files-found: warn
