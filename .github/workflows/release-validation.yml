name: HOPE Release Validation

on:
  push:
    branches:
      - release/v2hope-hardening-2026-09-19
  workflow_dispatch:

concurrency:
  group: hope-release-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Core quality
    uses: ./.github/workflows/main.yml
    secrets: inherit

  staging:
    name: Staging certification
    uses: ./.github/workflows/staging-certification.yml
    secrets: inherit

  payment:
    name: Payment certification
    uses: ./.github/workflows/hope-payment-certification.yml
    secrets: inherit


  production_artifact:
    name: Production signed artifact
    needs:
      - quality
      - staging
      - payment
    if: ${{ needs.quality.result == 'success' && needs.staging.result == 'success' && needs.staging.outputs.certification_status == 'PASS' && needs.staging.outputs.certification_sha == github.sha && needs.payment.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BUILD_PROFILE: production
      API_BASE_URL: ${{ secrets.API_BASE_URL_PRODUCTION }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET_PRODUCTION }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET_PRODUCTION }}
      PAYMENT_PROVIDER: internal
      PAYMENT_CURRENCY: TOMAN
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      RESET_TOKEN_DELIVERY_MODE: webhook
      RESET_TOKEN_DELIVERY_SECRET: ${{ secrets.RESET_TOKEN_DELIVERY_SECRET_PRODUCTION }}
      RESET_TOKEN_DELIVERY_URL: ${{ secrets.RESET_TOKEN_DELIVERY_URL_PRODUCTION || 'https://oumueyftltvakimtbemj.supabase.co/functions/v1/hope-password-reset' }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL_PRODUCTION }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN_PRODUCTION }}
      ALLOWED_CORS_ORIGINS: ${{ secrets.ALLOWED_CORS_ORIGINS_PRODUCTION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
      RATE_LIMIT_STORE: postgres
      STORAGE_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET_PRODUCTION }}
      S3_REGION: ${{ secrets.S3_REGION_PRODUCTION }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_PRODUCTION }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE_PRODUCTION || 'false' }}
      STAGING_CERTIFICATION_STATUS: ${{ needs.staging.outputs.certification_status }}
      STAGING_CERTIFICATION_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
      STAGING_CERTIFICATION_SHA: ${{ needs.staging.outputs.certification_sha }}
      STAGING_CERTIFICATION_ATTEMPT: ${{ needs.staging.outputs.certification_attempt }}
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Provision password reset webhook receiver
        shell: bash
        env:
          RESET_WEBHOOK_URL: ${{ secrets.RESET_TOKEN_DELIVERY_URL_PRODUCTION || 'https://oumueyftltvakimtbemj.supabase.co/functions/v1/hope-password-reset' }}
          RESET_WEBHOOK_SECRET: ${{ secrets.RESET_TOKEN_DELIVERY_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          : "${RESET_WEBHOOK_SECRET:?RESET_TOKEN_DELIVERY_SECRET_PRODUCTION is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC token request token is required}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC token request URL is required}"
          oidc_token="$(curl -fsSL --get -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" --data-urlencode "audience=hope-reset-bootstrap" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -er ".value")"
          payload="$(jq -n --arg secret "$RESET_WEBHOOK_SECRET" '{secret:$secret}')"
          curl -fsS --retry 2 --retry-delay 1 -X POST "${RESET_WEBHOOK_URL}/_bootstrap" -H "Authorization: Bearer ${oidc_token}" -H "Content-Type: application/json" --data "$payload"

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Validate production API base URL
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${API_BASE_URL:-}" ] || { echo 'Production API_BASE_URL secret is required.' >&2; exit 1; }
          [[ "$API_BASE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo 'Production API_BASE_URL must use HTTPS and contain no whitespace.' >&2; exit 1; }

      - name: Validate production environment contract
        working-directory: backend
        env:
          NODE_ENV: production
          PAYMENT_PROVIDER: ${{ env.PAYMENT_PROVIDER }}
          PAYMENT_CURRENCY: ${{ env.PAYMENT_CURRENCY }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PUBLIC_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
          METRICS_TOKEN: ${{ env.METRICS_TOKEN }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_REGION: ${{ env.S3_REGION }}
          S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          STORAGE_BACKEND: ${{ env.STORAGE_BACKEND }}
          RESET_TOKEN_DELIVERY_MODE: ${{ env.RESET_TOKEN_DELIVERY_MODE }}
          RESET_TOKEN_DELIVERY_URL: ${{ env.RESET_TOKEN_DELIVERY_URL }}
          RESET_TOKEN_DELIVERY_SECRET: ${{ env.RESET_TOKEN_DELIVERY_SECRET }}
          ALLOWED_CORS_ORIGINS: ${{ env.ALLOWED_CORS_ORIGINS }}
          ACCESS_TOKEN_SECRET: ${{ env.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ env.REFRESH_TOKEN_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ env.PAYMENT_WEBHOOK_SECRET }}
        run: bash scripts/validate-production-env.sh

      - name: Backend install
        working-directory: backend
        run: npm ci

      # Core backend/Flutter/security gates already passed in prerequisite jobs
      # quality + payment + staging for this exact SHA; this job performs only
      # release-specific validation, signing, packaging, and provenance.
      - name: Production supply-chain audit
        working-directory: backend
        run: timeout --foreground --signal=TERM --kill-after=30s 10m npm audit --audit-level=high
      - name: Configure production keystore
        id: keystore_prepare
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_B64:?ANDROID_RELEASE_KEYSTORE_B64 is required}"
          KEYSTORE_PATH="$RUNNER_TEMP/hope-production-release.keystore"
          # Accept wrapped/padded/unpadded base64 secrets without weakening the
          # release gate: whitespace is removed, URL-safe characters are normalized,
          # and the decoded keystore must be non-empty and parseable by keytool.
          normalized="$(printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | tr -d '[:space:]' | tr '_-' '/+')"
          rem=$(( ${#normalized} % 4 ))
          if [ "$rem" -eq 1 ]; then
            echo 'ANDROID_RELEASE_KEYSTORE_B64 has an invalid base64 length.' >&2
            exit 1
          fi
          if [ "$rem" -eq 2 ]; then normalized="${normalized}=="; fi
          if [ "$rem" -eq 3 ]; then normalized="${normalized}="; fi
          printf '%s' "$normalized" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" >/dev/null
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed production APK
        id: release_build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL_PRODUCTION }}
          BUILD_PROFILE: production
          ANDROID_RELEASE_STORE_FILE: ${{ steps.keystore_prepare.outputs.path }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: timeout --foreground --signal=TERM --kill-after=45s 20m bash tools/build_apk_release.sh

      - name: Set release artifact metadata
        id: artifact_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml)"
          APK="artifacts/HOPE-${VERSION}-production.apk"
          test -s "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signed production APK
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose "${{ steps.artifact_meta.outputs.apk }}"

      - name: Runtime gate - android build
        id: android_build_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.apk_verify.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate android_build \
            --command 'apksigner verify --verbose <release-apk>' \
            --result "$GATE_RESULT"

      - name: Build production backend image
        working-directory: backend
        env:
          DOCKER_BUILDKIT: '1'
        run: timeout --foreground --signal=TERM --kill-after=45s 15m docker build --pull --file Dockerfile --tag hope-api:${GITHUB_SHA} .

      - name: Record backend image identity
        id: backend_image
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' "hope-api:${GITHUB_SHA}")"
          IMAGE_REF="hope-api:${GITHUB_SHA}"
          echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        working-directory: backend
        run: timeout --foreground --signal=TERM --kill-after=30s 5m npm run sbom

      - name: Generate release manifest
        working-directory: backend
        env:
          BUILD_PROFILE: production
          APK_PATH: ${{ steps.artifact_meta.outputs.apk }}
          BACKEND_IMAGE_ID: ${{ steps.backend_image.outputs.id }}
          BACKEND_IMAGE_REF: ${{ steps.backend_image.outputs.ref }}
          STAGING_CERTIFICATION_STATUS: ${{ needs.staging.outputs.certification_status }}
          STAGING_CERTIFICATION_RUN_ID: ${{ needs.staging.outputs.certification_run_id }}
          STAGING_CERTIFICATION_SHA: ${{ needs.staging.outputs.certification_sha }}
          STAGING_CERTIFICATION_ATTEMPT: ${{ needs.staging.outputs.certification_attempt }}
          RELEASE_MANIFEST_PATH: ${{ github.workspace }}/release-manifest.json
        run: timeout --foreground --signal=TERM --kill-after=30s 2m npm run release:manifest

      - name: Create SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ steps.artifact_meta.outputs.apk }}" release-manifest.json > SHA256SUMS.txt

      - name: Attest release APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifact_meta.outputs.apk }}

      - name: Upload production release artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-production-release-artifact-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.artifact_meta.outputs.apk }}
            SHA256SUMS.txt
            release-manifest.json
            backend/sbom.json
            docs/audit/evidence/android_build.json
          if-no-files-found: warn

      - name: Cleanup production keystore
        if: ${{ always() }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.keystore_prepare.outputs.path }}
        run: rm -f -- "$KEYSTORE_PATH"

  release_gate:
    name: Release validation gate
    needs:
      - quality
      - staging
      - payment
      - production_artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release gates
        shell: bash
        run: |
          set -euo pipefail
          echo "Core quality: ${{ needs.quality.result }}"
          echo "Staging certification: ${{ needs.staging.result }}"
          echo "Payment certification: ${{ needs.payment.result }}"
          echo "Production signed artifact: ${{ needs.production_artifact.result }}"
          for result in "${{ needs.quality.result }}" "${{ needs.staging.result }}" "${{ needs.payment.result }}" "${{ needs.production_artifact.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "Release validation failed: $result" >&2
              exit 1
            fi
          done
          echo "RELEASE VALIDATION: PASS"
