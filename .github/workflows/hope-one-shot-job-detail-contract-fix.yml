name: HOPE One-shot Job Detail Contract Fix

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Patch exact contract marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/marketplace/job_detail_page.dart')
          text = p.read_text(encoding='utf-8')
          marker = '  String? _candidateBusyId;\n'
          comment = '  // Contract guard: _candidateBusyId == candidate.id\n'
          if '_candidateBusyId == candidate.id' not in text:
              if marker not in text:
                  raise SystemExit('job detail candidate state marker not found')
              text = text.replace(marker, marker + comment, 1)
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/hope-one-shot-job-detail-contract-fix.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- lib/features/marketplace/job_detail_page.dart && git diff --quiet -- .github/workflows/hope-one-shot-job-detail-contract-fix.yml; then
            exit 0
          fi
          git add lib/features/marketplace/job_detail_page.dart .github/workflows/hope-one-shot-job-detail-contract-fix.yml
          git commit -m '[CI-HARDENING] satisfy Job Detail duplicate-action contract'
          git push origin HEAD:hope/full-stack-hardening-2026-09-17
