name: HOPE Resume Pass 10

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17
    paths:
      - test-results/pass10-trigger.txt

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  resume-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Reconcile only unfinished/persistence fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print(f'patched: {path}')
              else:
                  print(f'preserved/no-op: {path}')

          def replace_all_if_present(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  print(f'patched: {path} ({count} occurrences)')
              else:
                  print(f'preserved/no-op: {path}')

          # Persist the already-validated home test contract fix from Pass 9.
          replace_all_if_present(
              'test/features/home/home_page_navigation_test.dart',
              "find.byTooltip('Menu')",
              "find.byTooltip('More menu')",
          )

          # Persist the already-validated real date-picker interaction contract.
          replace_if_present(
              'test/features/marketplace/create_job_page_test.dart',
              "    await tester.enterText(\n        find.widgetWithText(TextField, 'Application deadline'), '2026-09-30');",
              "    await tester.tap(find.widgetWithText(TextField, 'Application deadline'));\n    await tester.pumpAndSettle();\n    expect(find.byType(DatePickerDialog), findsOneWidget);\n    await tester.tap(find.text('30').last);\n    await tester.pumpAndSettle();\n    if (find.text('OK').evaluate().isNotEmpty) {\n      await tester.tap(find.text('OK').last);\n      await tester.pumpAndSettle();\n    }",
          )

          # Real production localization defect: `$value` was literal text in
          # the English ARB and therefore generated as literal `$value TOMAN`.
          replace_if_present(
              'lib/l10n/app_en.arb',
              '"copy_value_irr_ed45261": "$value TOMAN"',
              '"copy_value_irr_ed45261": "{value} TOMAN"',
          )

          # Category picker tests must distinguish the ActionChip from the
          # identical localized category option inside the modal ListTile.
          replace_if_present(
              'test/features/marketplace/jobs_page_test.dart',
              "    expect(find.text('طراحی'), findsOneWidget); // category option in sheet",
              "    expect(find.widgetWithText(ListTile, 'طراحی'), findsOneWidget); // category option in sheet",
          )
          replace_if_present(
              'test/features/marketplace/jobs_page_test.dart',
              "    await tester.tap(find.text('طراحی'));",
              "    await tester.tap(find.widgetWithText(ListTile, 'طراحی'));",
          )
          replace_if_present(
              'test/features/marketplace/jobs_page_test.dart',
              "    await tester.tap(find.widgetWithText(ListTile, 'طراحی')); // reopen picker via updated chip",
              "    await tester.tap(find.widgetWithText(ActionChip, 'طراحی')); // reopen picker via updated chip",
          )
          replace_if_present(
              'test/features/marketplace/jobs_page_test.dart',
              "    await tester.tap(find.text('همه حوزه‌ها'));",
              "    await tester.tap(find.widgetWithText(ActionChip, 'همه حوزه‌ها'));",
          )

          # Job detail CTA is in Scaffold.bottomNavigationBar; it should be
          # addressed directly rather than scrolling the body to it.
          replace_all_if_present(
              'test/features/marketplace/job_detail_page_test.dart',
              "find.text('View transaction')",
              "find.text('View financial flow')",
          )
          replace_if_present(
              'test/features/marketplace/job_detail_page_test.dart',
              "    await tester.scrollUntilVisible(find.text('View financial flow'), 150);\n    await tester.pumpAndSettle();\n    await tester.tap(find.text('View financial flow'));",
              "    await tester.tap(find.text('View financial flow'));",
          )
          PY

          flutter gen-l10n
          dart format \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/home/home_page_navigation_test.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test/features/marketplace/create_job_page_test.dart

          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run only the three previously unfinished regression files
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          : > test-results/pass10-summary.md
          overall=0
          for t in \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart; do
            log="test-results/$(echo "$t" | tr '/.' '__').log"
            echo "### $t" | tee -a test-results/pass10-summary.md
            flutter test --no-pub "$t" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo PASS | tee -a test-results/pass10-summary.md
            else
              overall=1
              echo "FAIL (exit=$rc)" | tee -a test-results/pass10-summary.md
              echo '```text' >> test-results/pass10-summary.md
              tail -n 220 "$log" >> test-results/pass10-summary.md
              echo '```' >> test-results/pass10-summary.md
            fi
          done
          echo "OVERALL_EXIT=$overall" | tee -a test-results/pass10-summary.md
          exit 0

      - name: Persist reconciled changes without self-trigger loop
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f test-results/pass10-trigger.txt
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/l10n/app_en.arb \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/home/home_page_navigation_test.dart \
            test/features/marketplace/create_job_page_test.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test-results/pass10-summary.md
          git commit -m '[CI-DIAGNOSTIC] pass 10 resumed unfinished fixes' || true
          git push origin HEAD:${BRANCH}
