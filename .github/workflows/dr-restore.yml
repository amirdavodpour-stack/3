name: Disaster recovery restore drill

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      RAILWAY_TOKEN:
        required: true
      SOURCE_DATABASE_URL:
        required: true
      DRILL_DATABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  dr-restore:
    name: DR restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
      RTO_TARGET_SECONDS: '900'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Start Railway Postgres SSH tunnel
        id: postgres_tunnel
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required}"
          npm install -g @railway/cli@5.30.1 >/dev/null
          railway whoami >/dev/null
          railway connect Postgres --tunnel-only --port 15432 --project "8c686259-09c6-4609-bbe7-4ea25e769e18" --environment "5a435e97-1e7a-4a5c-952c-19da2f10d955" >"$RUNNER_TEMP/railway-postgres-tunnel.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/railway-postgres-tunnel.pid"
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then
              echo 'Railway Postgres SSH tunnel is ready.'
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/railway-postgres-tunnel.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/railway-postgres-tunnel.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/railway-postgres-tunnel.log"
          exit 1

      - name: Prepare tunneled source URL
        id: tunneled_source
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          source_url="$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.hostname="127.0.0.1"; u.port="15432"; process.stdout.write(u.toString())')"
          echo "SOURCE_DATABASE_TUNNELED_URL=$source_url" >> "$GITHUB_ENV"

      - name: Verify target isolation
        shell: bash
        run: |
          set -euo pipefail
          : "${SOURCE_DATABASE_URL:?SOURCE_DATABASE_URL is required}"
          : "${DRILL_DATABASE_URL:?DRILL_DATABASE_URL is required}"
          test "$SOURCE_DATABASE_URL" != "$DRILL_DATABASE_URL"
          echo "Source and DR target are distinct; source will be reached through the private Railway SSH tunnel."

      - name: DR restore drill
        id: dr_restore
        shell: bash
        run: bash backend/scripts/dr-restore-drill.sh

      - name: Validate restored migration state
        id: migration_state
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DRILL_DATABASE_URL }}
        run: npm run migrate:status

      - name: Financial integrity probe on restored target
        id: financial_probe
        shell: bash
        env:
          TARGET_DATABASE_URL: ${{ env.DRILL_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM wallet_accounts WHERE currency <> 'TOMAN') THEN
              RAISE EXCEPTION 'DR violation: non-TOMAN wallet currency';
            END IF;
            IF EXISTS (SELECT 1 FROM wallet_accounts WHERE available_balance < 0 OR locked_balance < 0) THEN
              RAISE EXCEPTION 'DR violation: negative wallet balance';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM journals j
              LEFT JOIN (
                SELECT journal_id, COUNT(*) AS entry_count,
                       COALESCE(SUM(debit),0) AS debit_total,
                       COALESCE(SUM(credit),0) AS credit_total
                FROM ledger_entries
                GROUP BY journal_id
              ) e ON e.journal_id = j.id
              WHERE j.status = 'POSTED'
                AND (COALESCE(e.entry_count,0) = 0 OR e.debit_total <> e.credit_total OR e.debit_total <= 0)
            ) THEN
              RAISE EXCEPTION 'DR violation: posted journal is not balanced';
            END IF;
            IF EXISTS (
              SELECT 1 FROM payouts
              WHERE (status IN ('SUCCEEDED','FAILED') AND completed_at IS NULL)
                 OR (status NOT IN ('SUCCEEDED','FAILED') AND completed_at IS NOT NULL)
                 OR (provider_ref IS NOT NULL AND status <> 'SUCCEEDED')
                 OR (status = 'SUCCEEDED' AND NULLIF(BTRIM(provider_ref),'') IS NULL)
            ) THEN
              RAISE EXCEPTION 'DR violation: payout invariant failed';
            END IF;
          END $$;
          SELECT 'DR financial integrity PASS' AS result;
          SQL

      - name: Runtime gate - DR restore
        id: dr_restore_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.dr_restore.outcome == 'success' && steps.migration_state.outcome == 'success' && steps.financial_probe.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs             --gate dr_restore             --command 'bash backend/scripts/dr-restore-drill.sh + migrate:status + financial integrity probe'             --result "$GATE_RESULT"

      - name: Upload DR evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-dr-restore-${{ github.run_id }}
          path: docs/audit/evidence/dr_restore.json
          if-no-files-found: warn
