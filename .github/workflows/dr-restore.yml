name: Disaster recovery restore drill

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SOURCE_DATABASE_URL:
        required: true
      DRILL_DATABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  dr-restore:
    name: DR restore drill
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
      RTO_TARGET_SECONDS: '900'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: DR restore drill
        id: dr_restore
        shell: bash
        run: |
          set -euo pipefail
          : "${SOURCE_DATABASE_URL:?SOURCE_DATABASE_URL is required}"
          : "${DRILL_DATABASE_URL:?DRILL_DATABASE_URL is required}"
          bash backend/scripts/dr-restore-drill.sh

      - name: Runtime gate - dr restore
        id: dr_restore_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.dr_restore.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate dr_restore \
            --command 'bash backend/scripts/dr-restore-drill.sh' \
            --result "$GATE_RESULT"

      - name: Upload DR evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-dr-restore-${{ github.run_id }}
          path: docs/audit/evidence/dr_restore.json
          if-no-files-found: warn
