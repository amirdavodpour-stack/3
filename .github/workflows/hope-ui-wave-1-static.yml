# Wave 1 static gate intentionally runs on every working-branch push so each visual batch has a fresh verification record.
name: HOPE UI Wave 1 Static Verification

on:
  # Verification is PR-scoped so one commit produces one authoritative static record.
  pull_request:
    branches:
      - feat/google-sign-in-2026-09-20

concurrency:
  # Isolate verification by exact commit so a wedged older runner cannot starve the current head.
  group: hope-ui-wave-1-static-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || (!contains(github.event.pull_request.title, '[runtime-capture-fa]') && !contains(github.event.pull_request.title, '[runtime-capture-fa-home]')) }}
    name: Wave 1 Flutter + backend + visual guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend fast tests
        working-directory: backend
        run: npm run test:fast
      - name: Backend security audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Backend static check
        working-directory: backend
        run: npm run check
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify Flutter lockfile
        run: bash tools/verify-pubspec-lock-fresh.sh
      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Contrast guard
        run: python3 tool/contrast_check.py
      - name: Design/runtime source guard
        run: bash tools/verify-design-quality.sh
      - name: Runtime source guard
        run: bash test/runtime/premium_visual_wave_source_test.sh
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # Bound the wave lane: a failing widget test must never consume 10-minute defaults.
      # Grouped wave checkpoint: trigger verification from the current immutable HEAD.
      # Wave 1 contract reconciliation follows a single verification run.
      # Wave 1 verification trigger: execute the bounded suite against the latest branch head.

      - name: Wave 15 single Flutter test
        if: ${{ !contains(github.event.pull_request.title, '[wave15-preverified]') }}
        timeout-minutes: 5
        run: timeout --foreground --signal=TERM --kill-after=30s 270s flutter test --no-pub test/core/ui/premium_visual_wave_15_test.dart
