name: HOPE Active Hardening Gate

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  hardening-gate:
    if: >-
      !contains(github.event.head_commit.message, '[CI-ACTIVE]') &&
      !contains(github.event.head_commit.message, '[CI-CLEANUP]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Persist confirmed source and test contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_all(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              changed = text.replace(old, new)
              if changed != text:
                  p.write_text(changed, encoding='utf-8')
                  print(f'patched {path}')
              else:
                  print(f'no-op {path}')

          def patch_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print(f'patched {path}')
              else:
                  print(f'no-op {path}: expected contract not present')

          patch_all(
              'test/features/home/home_page_navigation_test.dart',
              "find.byTooltip('Menu')",
              "find.byTooltip('More menu')",
          )

          patch_all(
              'test/features/marketplace/job_detail_page_test.dart',
              "find.text('View transaction')",
              "find.text('View financial flow')",
          )

          patch_once(
              'test/features/marketplace/job_detail_page_test.dart',
              "    await _pump(tester, job: _job());\n    expect(find.text('Mission details'), findsOneWidget);",
              "    await _pump(tester, job: _job());\n    final scrollable = tester.state<ScrollableState>(find.byType(Scrollable).first);\n    scrollable.position.jumpTo(scrollable.position.maxScrollExtent);\n    await tester.pumpAndSettle();\n    expect(find.text('Mission details'), findsOneWidget);",
          )

          patch_once(
              'test/features/marketplace/job_detail_page_test.dart',
              "    await _pump(tester, job: _job(kind: 'JOB'));\n    expect(find.text('Job details'), findsOneWidget);",
              "    await _pump(tester, job: _job(kind: 'JOB'));\n    final scrollable = tester.state<ScrollableState>(find.byType(Scrollable).first);\n    scrollable.position.jumpTo(scrollable.position.maxScrollExtent);\n    await tester.pumpAndSettle();\n    expect(find.text('Job details'), findsOneWidget);",
          )

          patch_once(
              'lib/features/marketplace/job_detail_page.dart',
              "                  const SizedBox(height: 13),\n                  _JobLifecycleCard(job: j),",
              "                  if (isJob) ...[\n                    const SizedBox(height: 13),\n                    HopeSurface(\n                      padding: const EdgeInsets.all(16),\n                      child: Row(\n                        crossAxisAlignment: CrossAxisAlignment.start,\n                        children: [\n                          const Icon(Icons.verified_user_outlined),\n                          const SizedBox(width: 10),\n                          Expanded(\n                            child: Text(\n                              HopeCopy.of(context)\n                                  .copy_job_applications_are_reviewed_by_an_admin__5098e17,\n                            ),\n                          ),\n                        ],\n                      ),\n                    ),\n                  ],\n                  const SizedBox(height: 13),\n                  _JobLifecycleCard(job: j),",
          )

          patch_once(
              'test/features/marketplace/create_job_page_test.dart',
              "    await tester.enterText(\n        find.widgetWithText(TextField, 'Application deadline'), '2026-09-30');",
              "    await tester.tap(find.widgetWithText(TextField, 'Application deadline'));\n    await tester.pumpAndSettle();\n    expect(find.byType(DatePickerDialog), findsOneWidget);\n    await tester.tap(find.text('30').last);\n    await tester.pumpAndSettle();\n    if (find.text('OK').evaluate().isNotEmpty) {\n      await tester.tap(find.text('OK').last);\n      await tester.pumpAndSettle();\n    }",
          )

          patch_once(
              'lib/l10n/app_en.arb',
              '"copy_value_irr_ed45261": "$value TOMAN"',
              '"copy_value_irr_ed45261": "{value} TOMAN"',
          )

          jobs = Path('test/features/marketplace/jobs_page_test.dart')
          text = jobs.read_text(encoding='utf-8')
          text = text.replace("expect(find.text('طراحی'), findsOneWidget); // category option in sheet", "expect(find.widgetWithText(ListTile, 'طراحی'), findsOneWidget); // category option in sheet")
          text = text.replace("await tester.tap(find.text('طراحی'));", "await tester.tap(find.widgetWithText(ListTile, 'طراحی'));")
          text = text.replace("await tester.tap(find.widgetWithText(ListTile, 'طراحی')); // reopen picker via updated chip", "await tester.tap(find.widgetWithText(ActionChip, 'طراحی')); // reopen picker via updated chip")
          text = text.replace("await tester.tap(find.text('همه حوزه‌ها'));", "await tester.tap(find.widgetWithText(ActionChip, 'همه حوزه‌ها'));")
          jobs.write_text(text, encoding='utf-8')

          tx = Path('test/features/transactions/transaction_page_test.dart')
          text = tx.read_text(encoding='utf-8')
          legacy = "    expect(find.text('1000000 TOMAN'), findsOneWidget);"
          if legacy in text:
              text = text.replace(legacy, "    expect(\n      find.byWidgetPredicate((widget) {\n        if (widget is! Text || widget.data == null) return false;\n        return widget.data!.replaceAll(',', '') == '1000000 TOMAN';\n      }),\n      findsOneWidget,\n    );", 1)
              tx.write_text(text, encoding='utf-8')
              print('patched transaction amount contract')
          else:
              print('transaction amount contract already hardened')
          PY

          flutter gen-l10n
          dart format \
            lib/features/marketplace/job_detail_page.dart \
            lib/core/ui/premium_components.dart \
            lib/features/transactions/transaction_widgets.part.dart \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/home/home_page_navigation_test.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test/features/marketplace/create_job_page_test.dart

          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run focused regression suite
        id: focused
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          : > test-results/active-hardening-summary.md
          overall=0
          tests=(
            test/features/home/home_page_navigation_test.dart
            test/features/profile/profile_page_test.dart
            test/features/transactions/transaction_page_test.dart
            test/features/marketplace/jobs_page_test.dart
            test/features/marketplace/job_detail_page_test.dart
            test/features/marketplace/create_job_page_test.dart
            test/core/router/app_routes_test.dart
          )
          for t in "${tests[@]}"; do
            slug=$(echo "$t" | tr '/.' '__')
            log="test-results/active_${slug}.log"
            echo "### $t" | tee -a test-results/active-hardening-summary.md
            flutter test --no-pub "$t" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo PASS | tee -a test-results/active-hardening-summary.md
            else
              overall=1
              echo "FAIL (exit=$rc)" | tee -a test-results/active-hardening-summary.md
              echo '```text' >> test-results/active-hardening-summary.md
              tail -n 260 "$log" >> test-results/active-hardening-summary.md
              echo '```' >> test-results/active-hardening-summary.md
            fi
          done
          echo "OVERALL_EXIT=$overall" | tee -a test-results/active-hardening-summary.md
          echo "$overall" > test-results/active-hardening-exit.txt
          exit 0

      - name: Persist source, tests and diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/marketplace/job_detail_page.dart \
            lib/core/ui/premium_components.dart \
            lib/features/transactions/transaction_widgets.part.dart \
            lib/l10n/app_en.arb \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/home/home_page_navigation_test.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test/features/marketplace/create_job_page_test.dart \
            test/core/router/app_routes_test.dart \
            test-results/active-hardening-summary.md \
            test-results/active-hardening-exit.txt \
            test-results/active_*.log
          git commit -m '[CI-ACTIVE] persist hardening and focused regression results' || true
          git push origin HEAD:${BRANCH}

      - name: Enforce focused regression gate
        if: always()
        shell: bash
        run: |
          test "$(cat test-results/active-hardening-exit.txt)" = "0"
