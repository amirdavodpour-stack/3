name: Free LLM Agent Contract

on:
  pull_request:
    paths:
      - "tools/free-llm-agent.mjs"
      - "tools/tests/free-llm-agent.test.mjs"
      - "docs/agents/free-llm-coding-agent.md"
      - ".github/workflows/free-llm-agent-contract.yml"
  push:
    branches:
      - "feat/google-sign-in-2026-09-20"
    paths:
      - "tools/free-llm-agent.mjs"
      - "tools/tests/free-llm-agent.test.mjs"
      - "docs/agents/free-llm-coding-agent.md"
      - ".github/workflows/free-llm-agent-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Node agent contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Syntax check
        run: node --check tools/free-llm-agent.mjs

      - name: Contract tests
        run: node --test tools/tests/free-llm-agent.test.mjs
