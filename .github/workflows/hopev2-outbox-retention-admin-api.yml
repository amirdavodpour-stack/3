name: HOPEv2 Outbox Retention Admin API

on:
  push:
    branches:
      - fix/hopev2-outbox-retention-admin-api-20261111
    paths:
      - ".github/workflows/hopev2-outbox-retention-admin-api.yml"
      - "backend/package.json"
      - "backend/openapi/openapi.yaml"
      - "backend/src/routes/admin_routes.js"
      - "backend/tests/outbox-retention-admin-routes.test.mjs"

permissions:
  contents: read

concurrency:
  group: hopev2-outbox-retention-admin-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node24:
    name: Node 24 Outbox retention Admin API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax and full backend fast suite
        working-directory: backend
        run: |
          npm run check
          npm run test:fast
