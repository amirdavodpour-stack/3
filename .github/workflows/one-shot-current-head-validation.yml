name: HOPE One-Shot Current HEAD Validation

on:
  workflow_dispatch:

concurrency:
  group: hope-one-shot-current-head-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality + audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend static check
        working-directory: backend
        run: npm run check

      - name: Backend security audit
        working-directory: backend
        run: npm audit --audit-level=high

  flutter:
    name: Flutter analyze + full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter lockfile
        run: bash tools/verify-pubspec-lock-fresh.sh

      - name: Design/runtime guardrails
        run: bash tools/verify-design-quality.sh

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter full test suite
        run: flutter test --no-pub

      - name: Capture expanded Flutter test output
        if: ${{ always() }}
        shell: bash
        run: flutter test --no-pub -r expanded > flutter-test-expanded.log 2>&1 || true

      - name: Upload expanded Flutter output
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: hope-flutter-expanded-${{ github.sha }}-${{ github.run_id }}
          path: flutter-test-expanded.log
          if-no-files-found: warn