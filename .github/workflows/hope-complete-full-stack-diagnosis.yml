name: HOPE Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find, validate, extract and install source
        shell: bash
        env:
          ZIP_NAME: HOPE-V8-clean-source-with-certification-scorecards.zip
        run: |
          set -Eeuo pipefail

          REPO_ROOT="$GITHUB_WORKSPACE"
          TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/hope-bootstrap.XXXXXX")"
          EXTRACT_DIR="$TMP_DIR/extracted"

          cleanup() {
            rm -rf "$TMP_DIR"
          }

          trap cleanup EXIT

          echo "============================================================"
          echo " HOPE BOOTSTRAP"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $REPO_ROOT"
          echo
          echo "Expected ZIP:"
          echo "  $ZIP_NAME"
          echo

          # ------------------------------------------------------
          # Locate exact ZIP
          # ------------------------------------------------------

          echo "Searching for source ZIP..."

          ZIP_FILE=""

          while IFS= read -r -d '' candidate; do
            ZIP_FILE="$candidate"
            break
          done < <(
            find "$REPO_ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              -not -path "$REPO_ROOT/.git/*" \
              -print0
          )

          if [[ -z "$ZIP_FILE" ]]; then
            echo
            echo "ERROR: Source ZIP was not found."
            echo
            echo "Expected:"
            echo "  $ZIP_NAME"
            echo
            echo "ZIP files currently present:"
            find "$REPO_ROOT" \
              -type f \
              -iname "*.zip" \
              -not -path "$REPO_ROOT/.git/*" \
              -print || true
            exit 1
          fi

          echo "Source ZIP:"
          echo "  ${ZIP_FILE#$REPO_ROOT/}"
          echo

          # ------------------------------------------------------
          # Validate ZIP
          # ------------------------------------------------------

          echo "Checking ZIP integrity..."

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"
          echo

          # ------------------------------------------------------
          # Extract
          # ------------------------------------------------------

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting source..."

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extraction: OK"
          echo

          # ------------------------------------------------------
          # Detect archive root
          # ------------------------------------------------------

          shopt -s nullglob dotglob

          TOP_LEVEL_ITEMS=("$EXTRACT_DIR"/*)

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 0 ]]; then
            echo "ERROR: ZIP contains no files."
            exit 1
          fi

          SOURCE_ROOT="$EXTRACT_DIR"

          # Handle archives such as:
          #
          # archive.zip
          #   └── hope_clean_work/
          #       ├── lib/
          #       ├── backend/
          #       ├── test/
          #       └── ...
          #
          # We want the CONTENTS of hope_clean_work in the repository
          # root, not the hope_clean_work directory itself.

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 1 &&
                -d "${TOP_LEVEL_ITEMS[0]}" ]]; then

            POSSIBLE_ROOT="${TOP_LEVEL_ITEMS[0]}"

            INNER_ITEMS=("$POSSIBLE_ROOT"/*)

            if [[ "${#INNER_ITEMS[@]}" -gt 0 ]]; then
              SOURCE_ROOT="$POSSIBLE_ROOT"
            fi
          fi

          echo "Detected source root:"
          echo "  ${SOURCE_ROOT#$TMP_DIR/}"
          echo

          # ------------------------------------------------------
          # Validate extracted paths
          # ------------------------------------------------------

          echo "Validating extracted paths..."

          while IFS= read -r -d '' path; do

            # SOURCE_ROOT itself is not an archive entry.
            [[ "$path" == "$SOURCE_ROOT" ]] && continue

            relative="${path#"$SOURCE_ROOT"/}"

            # Reject path traversal.
            if [[ "$relative" == ".." ||
                  "$relative" == ../* ||
                  "$relative" == */../* ||
                  "$relative" == *"/.." ]]; then

              echo "ERROR: Unsafe path detected:"
              echo "  $relative"
              exit 1
            fi

            # Reject absolute paths.
            if [[ "$relative" == /* ]]; then
              echo "ERROR: Absolute path detected:"
              echo "  $relative"
              exit 1
            fi

          done < <(
            find "$SOURCE_ROOT" \
              -mindepth 1 \
              -print0
          )

          echo "Path validation: OK"
          echo

          # ------------------------------------------------------
          # Show source statistics before installation
          # ------------------------------------------------------

          echo "Source statistics:"

          SOURCE_FILE_COUNT="$(
            find "$SOURCE_ROOT" \
              -type f \
              | wc -l
          )"

          SOURCE_DIR_COUNT="$(
            find "$SOURCE_ROOT" \
              -type d \
              | wc -l
          )"

          echo "  Files:       $SOURCE_FILE_COUNT"
          echo "  Directories: $SOURCE_DIR_COUNT"
          echo

          # ------------------------------------------------------
          # Install source into repository root
          # ------------------------------------------------------

          echo "Installing source into repository root..."

          if command -v rsync >/dev/null 2>&1; then

            rsync -a \
              --exclude='.git/' \
              "$SOURCE_ROOT/" \
              "$REPO_ROOT/"

          else

            cp -a \
              "$SOURCE_ROOT"/. \
              "$REPO_ROOT/"

          fi

          echo "Source installation: OK"
          echo

          # ------------------------------------------------------
          # Remove ZIP from working tree
          # ------------------------------------------------------

          echo "Removing bootstrap ZIP from working tree..."

          rm -f "$ZIP_FILE"

          echo "ZIP removed."
          echo

          # ------------------------------------------------------
          # Verify ZIP is gone
          # ------------------------------------------------------

          if [[ -e "$ZIP_FILE" ]]; then
            echo "ERROR: ZIP could not be removed."
            exit 1
          fi

          # ------------------------------------------------------
          # Verify repository source
          # ------------------------------------------------------

          echo "Running post-install verification..."

          if [[ -f "$REPO_ROOT/pubspec.yaml" ]]; then
            echo "  Flutter project: detected"
          fi

          if [[ -d "$REPO_ROOT/lib" ]]; then
            echo "  Flutter source: detected"
          fi

          if [[ -d "$REPO_ROOT/test" ]]; then
            echo "  Flutter tests: detected"
          fi

          if [[ -d "$REPO_ROOT/integration_test" ]]; then
            echo "  Integration tests: detected"
          fi

          if [[ -d "$REPO_ROOT/backend" ]]; then
            echo "  Backend: detected"
          fi

          if [[ -d "$REPO_ROOT/android" ]]; then
            echo "  Android project: detected"
          fi

          echo

          # ------------------------------------------------------
          # Final ZIP check
          # ------------------------------------------------------

          REMAINING_ZIPS="$(
            find "$REPO_ROOT" \
              -type f \
              -iname "*.zip" \
              -not -path "$REPO_ROOT/.git/*" \
              -print
          )"

          if [[ -n "$REMAINING_ZIPS" ]]; then
            echo "WARNING: Other ZIP files remain in repository:"
            echo "$REMAINING_ZIPS"
            echo
          fi

          # ------------------------------------------------------
          # Git status
          # ------------------------------------------------------

          echo "Git status:"
          echo "------------------------------------------------------------"

          git status --short

          echo
          echo "============================================================"
          echo " BOOTSTRAP COMPLETED SUCCESSFULLY"
          echo "============================================================"

      # --------------------------------------------------------
      # Commit changes
      # --------------------------------------------------------

      - name: Commit bootstrapped source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Bootstrap source from project archive"

          git push
