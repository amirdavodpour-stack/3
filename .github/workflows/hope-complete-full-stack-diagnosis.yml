name: HOPE Bootstrap Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install HOPE source archive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================================
      # 2. BOOTSTRAP
      # ==========================================================

      - name: Extract and install source archive
        shell: bash
        env:
          ZIP_NAME: HOPE-V8-clean-source-with-certification-scorecards.zip
        run: |
          set -Eeuo pipefail

          REPO_ROOT="${GITHUB_WORKSPACE}"
          WORK_DIR="${RUNNER_TEMP}/hope-bootstrap"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          ZIP_FILE=""
          EXTRACT_DIR="$WORK_DIR/extracted"

          echo "============================================================"
          echo " HOPE SOURCE BOOTSTRAP"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $REPO_ROOT"
          echo
          echo "Expected archive:"
          echo "  $ZIP_NAME"
          echo

          # ------------------------------------------------------
          # Locate exact archive
          # ------------------------------------------------------

          echo "Searching for archive..."

          mapfile -d '' ZIP_CANDIDATES < <(
            find "$REPO_ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              -not -path "$REPO_ROOT/.git/*" \
              -print0
          )

          if [[ "${#ZIP_CANDIDATES[@]}" -eq 0 ]]; then
            echo
            echo "ERROR: Archive not found."
            echo
            echo "Files matching *.zip:"
            find "$REPO_ROOT" \
              -type f \
              -iname "*.zip" \
              -not -path "$REPO_ROOT/.git/*" \
              -print \
              || true

            echo
            echo "If the ZIP is not committed to the repository,"
            echo "this bootstrap workflow cannot access it."
            exit 1
          fi

          if [[ "${#ZIP_CANDIDATES[@]}" -gt 1 ]]; then
            echo
            echo "ERROR: Multiple copies of the expected archive were found:"
            printf '  %s\n' "${ZIP_CANDIDATES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_CANDIDATES[0]}"

          echo "Archive found:"
          echo "  ${ZIP_FILE#$REPO_ROOT/}"
          echo

          # ------------------------------------------------------
          # Validate ZIP
          # ------------------------------------------------------

          echo "Validating ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP integrity: OK"
          echo

          # ------------------------------------------------------
          # Extract to temporary directory
          # ------------------------------------------------------

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting archive..."

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extraction: OK"
          echo

          # ------------------------------------------------------
          # Detect archive root
          # ------------------------------------------------------

          echo "Detecting archive structure..."

          shopt -s nullglob dotglob

          TOP_LEVEL_ITEMS=("$EXTRACT_DIR"/*)

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 0 ]]; then
            echo "ERROR: Archive is empty."
            exit 1
          fi

          SOURCE_ROOT="$EXTRACT_DIR"

          # If archive contains exactly one directory:
          #
          # archive.zip
          # └── hope_clean_work/
          #     ├── pubspec.yaml
          #     ├── lib/
          #     ├── backend/
          #     └── ...
          #
          # use that directory as source root.

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 1 ]] &&
             [[ -d "${TOP_LEVEL_ITEMS[0]}" ]]; then

            POSSIBLE_ROOT="${TOP_LEVEL_ITEMS[0]}"

            INNER_ITEMS=("$POSSIBLE_ROOT"/*)

            if [[ "${#INNER_ITEMS[@]}" -gt 0 ]]; then
              SOURCE_ROOT="$POSSIBLE_ROOT"
            fi
          fi

          echo "Source root:"
          echo "  ${SOURCE_ROOT#$WORK_DIR/}"
          echo

          # ------------------------------------------------------
          # Security validation
          # ------------------------------------------------------

          echo "Checking extracted paths..."

          while IFS= read -r -d '' ITEM; do

            RELATIVE="${ITEM#"$SOURCE_ROOT"/}"

            # Root itself is not an archive entry.
            [[ "$ITEM" == "$SOURCE_ROOT" ]] && continue

            # Reject traversal.
            case "$RELATIVE" in
              ..|../*|*/../*|*/..)
                echo
                echo "ERROR: Unsafe path detected:"
                echo "  $RELATIVE"
                exit 1
                ;;
            esac

            # Reject absolute paths.
            if [[ "$RELATIVE" == /* ]]; then
              echo
              echo "ERROR: Absolute path detected:"
              echo "  $RELATIVE"
              exit 1
            fi

          done < <(
            find "$SOURCE_ROOT" \
              -mindepth 1 \
              -print0
          )

          echo "Path validation: OK"
          echo

          # ------------------------------------------------------
          # Statistics
          # ------------------------------------------------------

          FILE_COUNT="$(
            find "$SOURCE_ROOT" \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          DIR_COUNT="$(
            find "$SOURCE_ROOT" \
              -type d \
              | wc -l \
              | tr -d ' '
          )"

          echo "Archive statistics:"
          echo "  Files:       $FILE_COUNT"
          echo "  Directories: $DIR_COUNT"
          echo

          # ------------------------------------------------------
          # Required source detection
          # ------------------------------------------------------

          echo "Checking expected project structure..."

          REQUIRED_FOUND=0

          if [[ -f "$SOURCE_ROOT/pubspec.yaml" ]]; then
            echo "  [OK] pubspec.yaml"
            REQUIRED_FOUND=$((REQUIRED_FOUND + 1))
          else
            echo "  [WARN] pubspec.yaml not found"
          fi

          if [[ -d "$SOURCE_ROOT/lib" ]]; then
            echo "  [OK] lib/"
            REQUIRED_FOUND=$((REQUIRED_FOUND + 1))
          else
            echo "  [WARN] lib/ not found"
          fi

          if [[ -d "$SOURCE_ROOT/android" ]]; then
            echo "  [OK] android/"
            REQUIRED_FOUND=$((REQUIRED_FOUND + 1))
          else
            echo "  [WARN] android/ not found"
          fi

          if [[ -d "$SOURCE_ROOT/backend" ]]; then
            echo "  [OK] backend/"
            REQUIRED_FOUND=$((REQUIRED_FOUND + 1))
          else
            echo "  [INFO] backend/ not found"
          fi

          if [[ -d "$SOURCE_ROOT/test" ]]; then
            echo "  [OK] test/"
            REQUIRED_FOUND=$((REQUIRED_FOUND + 1))
          else
            echo "  [INFO] test/ not found"
          fi

          echo

          if [[ "$REQUIRED_FOUND" -lt 2 ]]; then
            echo
            echo "ERROR: Archive does not look like the expected HOPE source."
            echo "Refusing to install."
            exit 1
          fi

          # ------------------------------------------------------
          # Install
          # ------------------------------------------------------

          echo "Installing source into repository root..."
          echo

          if command -v rsync >/dev/null 2>&1; then

            rsync \
              -a \
              --exclude='.git/' \
              "$SOURCE_ROOT/" \
              "$REPO_ROOT/"

          else

            cp -a \
              "$SOURCE_ROOT"/. \
              "$REPO_ROOT/"

          fi

          echo
          echo "Installation: OK"
          echo

          # ------------------------------------------------------
          # Remove source ZIP
          # ------------------------------------------------------

          echo "Removing source archive from repository..."

          rm -f "$ZIP_FILE"

          if [[ -e "$ZIP_FILE" ]]; then
            echo "ERROR: Could not remove source ZIP."
            exit 1
          fi

          echo "Archive removed: OK"
          echo

          # ------------------------------------------------------
          # Verify project
          # ------------------------------------------------------

          echo "Post-install verification:"
          echo

          [[ -f "$REPO_ROOT/pubspec.yaml" ]] \
            && echo "  [OK] Flutter project"

          [[ -d "$REPO_ROOT/lib" ]] \
            && echo "  [OK] Flutter source"

          [[ -d "$REPO_ROOT/test" ]] \
            && echo "  [OK] Flutter tests"

          [[ -d "$REPO_ROOT/integration_test" ]] \
            && echo "  [OK] Integration tests"

          [[ -d "$REPO_ROOT/backend" ]] \
            && echo "  [OK] Backend"

          [[ -d "$REPO_ROOT/android" ]] \
            && echo "  [OK] Android"

          # Preserve certification / scorecards if supplied by archive.
          if [[ -d "$REPO_ROOT/.github/workflows" ]]; then
            echo "  [OK] GitHub workflows"
          fi

          if [[ -d "$REPO_ROOT/tools" ]]; then
            echo "  [OK] tools/"
          fi

          echo

          # ------------------------------------------------------
          # Git status
          # ------------------------------------------------------

          echo "============================================================"
          echo " GIT STATUS"
          echo "============================================================"
          echo

          git status --short

          echo

      # ==========================================================
      # 3. COMMIT
      # ==========================================================

      - name: Commit installed source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit \
            -m "Bootstrap HOPE source from clean reference archive"

      # ==========================================================
      # 4. PUSH
      # ==========================================================

      - name: Push bootstrapped source
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          echo "Pushing to:"
          echo "  origin/$BRANCH"
          echo

          git push origin "HEAD:$BRANCH"

          echo
          echo "============================================================"
          echo " BOOTSTRAP COMPLETE"
          echo "============================================================"
