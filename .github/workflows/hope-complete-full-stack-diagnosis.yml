name: HOPE Bootstrap Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hope-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install HOPE source archive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================================
      # 2. FIND + VALIDATE + EXTRACT + INSTALL
      # ==========================================================

      - name: Extract and install source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          REPO_ROOT="${GITHUB_WORKSPACE}"
          WORK_DIR="${RUNNER_TEMP}/hope-bootstrap"
          EXTRACT_DIR="${WORK_DIR}/extracted"

          rm -rf "$WORK_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "============================================================"
          echo " HOPE SOURCE BOOTSTRAP"
          echo "============================================================"
          echo
          echo "Repository:"
          echo "  $REPO_ROOT"
          echo

          # ------------------------------------------------------
          # Locate ZIP
          # ------------------------------------------------------

          echo "Searching for source archive..."
          echo

          mapfile -d '' ZIP_CANDIDATES < <(
            find "$REPO_ROOT" \
              -type f \
              -iname "*.zip" \
              -not -path "$REPO_ROOT/.git/*" \
              -not -path "$REPO_ROOT/.github/*" \
              -print0
          )

          ZIP_COUNT="${#ZIP_CANDIDATES[@]}"

          echo "ZIP files found: $ZIP_COUNT"
          echo

          if [[ "$ZIP_COUNT" -eq 0 ]]; then
            echo "ERROR: No ZIP source archive found."
            exit 1
          fi

          if [[ "$ZIP_COUNT" -gt 1 ]]; then
            echo "ERROR: Multiple ZIP files found."
            echo
            printf '  %s\n' "${ZIP_CANDIDATES[@]}"
            echo
            echo "Keep exactly one project source ZIP in the repository."
            exit 1
          fi

          ZIP_FILE="${ZIP_CANDIDATES[0]}"

          echo "Selected source archive:"
          echo "  ${ZIP_FILE#$REPO_ROOT/}"
          echo

          # ------------------------------------------------------
          # ZIP integrity
          # ------------------------------------------------------

          echo "Checking ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP integrity: OK"
          echo

          # ------------------------------------------------------
          # Extract
          # ------------------------------------------------------

          echo "Extracting archive..."

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extraction: OK"
          echo

          # ------------------------------------------------------
          # Detect archive root
          # ------------------------------------------------------

          echo "Detecting archive structure..."

          shopt -s nullglob dotglob

          TOP_LEVEL_ITEMS=("$EXTRACT_DIR"/*)

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 0 ]]; then
            echo "ERROR: Archive is empty."
            exit 1
          fi

          SOURCE_ROOT="$EXTRACT_DIR"

          # Support:
          #
          # ZIP
          # └── project/
          #     ├── pubspec.yaml
          #     ├── lib/
          #     └── backend/
          #
          # as well as:
          #
          # ZIP
          # ├── pubspec.yaml
          # ├── lib/
          # └── backend/

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 1 ]] &&
             [[ -d "${TOP_LEVEL_ITEMS[0]}" ]]; then

            POSSIBLE_ROOT="${TOP_LEVEL_ITEMS[0]}"

            INNER_ITEMS=("$POSSIBLE_ROOT"/*)

            if [[ "${#INNER_ITEMS[@]}" -gt 0 ]]; then
              SOURCE_ROOT="$POSSIBLE_ROOT"
            fi
          fi

          echo "Detected source root:"
          echo "  ${SOURCE_ROOT#$WORK_DIR/}"
          echo

          # ------------------------------------------------------
          # Validate archive paths
          # ------------------------------------------------------

          echo "Validating extracted paths..."

          while IFS= read -r -d '' ITEM; do

            [[ "$ITEM" == "$SOURCE_ROOT" ]] && continue

            RELATIVE="${ITEM#"$SOURCE_ROOT"/}"

            case "$RELATIVE" in
              ..|../*|*/../*|*/..)
                echo
                echo "ERROR: Unsafe path detected:"
                echo "  $RELATIVE"
                exit 1
                ;;
            esac

            if [[ "$RELATIVE" == /* ]]; then
              echo
              echo "ERROR: Absolute path detected:"
              echo "  $RELATIVE"
              exit 1
            fi

          done < <(
            find "$SOURCE_ROOT" \
              -mindepth 1 \
              -print0
          )

          echo "Path validation: OK"
          echo

          # ------------------------------------------------------
          # Source statistics
          # ------------------------------------------------------

          FILE_COUNT="$(
            find "$SOURCE_ROOT" \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          DIR_COUNT="$(
            find "$SOURCE_ROOT" \
              -type d \
              | wc -l \
              | tr -d ' '
          )"

          echo "Archive statistics:"
          echo "  Files:       $FILE_COUNT"
          echo "  Directories: $DIR_COUNT"
          echo

          # ------------------------------------------------------
          # Verify this is actually HOPE source
          # ------------------------------------------------------

          echo "Checking project structure..."
          echo

          if [[ -f "$SOURCE_ROOT/pubspec.yaml" ]]; then
            echo "  [OK] pubspec.yaml"
          else
            echo "  [ERROR] pubspec.yaml missing"
            exit 1
          fi

          if [[ -d "$SOURCE_ROOT/lib" ]]; then
            echo "  [OK] lib/"
          else
            echo "  [ERROR] lib/ missing"
            exit 1
          fi

          if [[ -d "$SOURCE_ROOT/android" ]]; then
            echo "  [OK] android/"
          else
            echo "  [WARN] android/ missing"
          fi

          if [[ -d "$SOURCE_ROOT/backend" ]]; then
            echo "  [OK] backend/"
          else
            echo "  [INFO] backend/ not present"
          fi

          if [[ -d "$SOURCE_ROOT/test" ]]; then
            echo "  [OK] test/"
          else
            echo "  [INFO] test/ not present"
          fi

          if [[ -d "$SOURCE_ROOT/integration_test" ]]; then
            echo "  [OK] integration_test/"
          else
            echo "  [INFO] integration_test/ not present"
          fi

          echo

          # ------------------------------------------------------
          # Install source
          # ------------------------------------------------------

          echo "Installing source into repository root..."
          echo

          rsync \
            -a \
            --exclude='.git/' \
            "$SOURCE_ROOT/" \
            "$REPO_ROOT/"

          echo
          echo "Source installation: OK"
          echo

          # ------------------------------------------------------
          # Remove ZIP
          # ------------------------------------------------------

          echo "Removing source archive..."

          rm -f "$ZIP_FILE"

          if [[ -e "$ZIP_FILE" ]]; then
            echo "ERROR: Failed to remove ZIP."
            exit 1
          fi

          echo "Source archive removed: OK"
          echo

          # ------------------------------------------------------
          # Verify installed source
          # ------------------------------------------------------

          echo "Post-install verification:"
          echo

          [[ -f "$REPO_ROOT/pubspec.yaml" ]] \
            && echo "  [OK] Flutter project"

          [[ -d "$REPO_ROOT/lib" ]] \
            && echo "  [OK] Flutter source"

          [[ -d "$REPO_ROOT/android" ]] \
            && echo "  [OK] Android project"

          [[ -d "$REPO_ROOT/backend" ]] \
            && echo "  [OK] Backend"

          [[ -d "$REPO_ROOT/test" ]] \
            && echo "  [OK] Flutter tests"

          [[ -d "$REPO_ROOT/integration_test" ]] \
            && echo "  [OK] Integration tests"

          [[ -d "$REPO_ROOT/tools" ]] \
            && echo "  [OK] tools/"

          [[ -d "$REPO_ROOT/.github/workflows" ]] \
            && echo "  [OK] GitHub workflows"

          echo

          # ------------------------------------------------------
          # Important certification / scorecard preservation check
          # ------------------------------------------------------

          echo "Checking certification / scorecard files..."

          CERT_FOUND=0

          if find "$REPO_ROOT" \
              -type f \
              \( \
                -iname "*certification*" \
                -o \
                -iname "*scorecard*" \
              \) \
              -not -path "$REPO_ROOT/.git/*" \
              | grep -q .; then

            CERT_FOUND=1
            echo "  [OK] Certification / scorecard artifacts detected"

          else

            echo "  [INFO] No certification / scorecard filename detected"

          fi

          echo

          # ------------------------------------------------------
          # Show git changes
          # ------------------------------------------------------

          echo "============================================================"
          echo " GIT STATUS"
          echo "============================================================"
          echo

          git status --short

          echo
          echo "Bootstrap installation finished."

      # ==========================================================
      # 3. COMMIT
      # ==========================================================

      - name: Commit bootstrapped source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Bootstrap HOPE source from project archive"

      # ==========================================================
      # 4. PUSH
      # ==========================================================

      - name: Push bootstrapped source
        shell: bash
        run: |
          set -Eeuo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          echo "Pushing changes..."
          echo "Branch: $BRANCH"

          git push origin "HEAD:$BRANCH"

          echo
          echo "============================================================"
          echo " HOPE BOOTSTRAP COMPLETED SUCCESSFULLY"
          echo "============================================================"
