name: HOPE Complete Full-Stack Test

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hope-full-stack-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC
  FLUTTER_VERSION: "3.47.2"
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  TEST_DIR: "test-results"

jobs:

  # ============================================================
  # 1. ENVIRONMENT + STRUCTURE
  # ============================================================

  environment:
    name: Environment & Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_android: ${{ steps.detect.outputs.has_android }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_integration: ${{ steps.detect.outputs.has_integration }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project components
        id: detect
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          HAS_FLUTTER=false
          HAS_BACKEND=false
          HAS_ANDROID=false
          HAS_TESTS=false
          HAS_INTEGRATION=false

          [[ -f pubspec.yaml ]] && HAS_FLUTTER=true
          [[ -d backend ]] && HAS_BACKEND=true
          [[ -d android ]] && HAS_ANDROID=true
          [[ -d test ]] && HAS_TESTS=true
          [[ -d integration_test ]] && HAS_INTEGRATION=true

          echo "has_flutter=$HAS_FLUTTER" >> "$GITHUB_OUTPUT"
          echo "has_backend=$HAS_BACKEND" >> "$GITHUB_OUTPUT"
          echo "has_android=$HAS_ANDROID" >> "$GITHUB_OUTPUT"
          echo "has_tests=$HAS_TESTS" >> "$GITHUB_OUTPUT"
          echo "has_integration=$HAS_INTEGRATION" >> "$GITHUB_OUTPUT"

          {
            echo "# HOPE Test Environment"
            echo
            echo "SHA: $(git rev-parse HEAD)"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo
            echo "Flutter: $HAS_FLUTTER"
            echo "Backend: $HAS_BACKEND"
            echo "Android: $HAS_ANDROID"
            echo "Tests: $HAS_TESTS"
            echo "Integration: $HAS_INTEGRATION"
            echo
            echo "## Repository structure"
            echo '```text'
            find . \
              -maxdepth 3 \
              -type d \
              -not -path './.git*' \
              -not -path './build*' \
              | sort
            echo '```'
          } > "$TEST_DIR/environment.md"

      - name: Upload environment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-test-environment
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 2. FLUTTER ANALYZE
  # ============================================================

  flutter_analyze:
    name: Flutter Analyze
    needs: environment
    if: needs.environment.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Flutter analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          flutter analyze \
            --no-fatal-infos \
            2>&1 | tee "$TEST_DIR/flutter-analyze.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "$TEST_DIR/flutter-analyze.exitcode"

          if [[ "$CODE" -ne 0 ]]; then
            echo "Flutter analyze FAILED with exit code $CODE"
          else
            echo "Flutter analyze PASSED"
          fi

          exit 0

      - name: Analyze result summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Flutter Analyze"
            echo
            echo "Exit code: $(cat "$TEST_DIR/flutter-analyze.exitcode" 2>/dev/null || echo unknown)"
            echo
            echo "## Errors"
            grep -nE \
              "error •|error:|Error:|ERROR" \
              "$TEST_DIR/flutter-analyze.log" \
              || true
          } > "$TEST_DIR/flutter-analyze-summary.md"

      - name: Upload analyze result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-flutter-analyze
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 3. FLUTTER TESTS
  # ============================================================

  flutter_tests:
    name: Flutter Tests
    needs: environment
    if: needs.environment.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # ----------------------------------------------------------
      # IMPORTANT:
      # The test command NEVER stops this job.
      # We capture the exit code and continue.
      # ----------------------------------------------------------

      - name: Run Flutter tests
        id: flutter_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          flutter test \
            --no-pub \
            --reporter expanded \
            2>&1 | tee "$TEST_DIR/flutter-test.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "$TEST_DIR/flutter-test.exitcode"

          echo "Flutter test exit code: $CODE"

          exit 0

      # ----------------------------------------------------------
      # Always attempt coverage separately.
      # ----------------------------------------------------------

      - name: Generate Flutter coverage
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          set +e

          flutter test \
            --no-pub \
            --coverage \
            2>&1 | tee "$TEST_DIR/flutter-coverage.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "$TEST_DIR/flutter-coverage.exitcode"

          exit 0

      - name: Extract Flutter test failures
        if: always()
        shell: bash
        run: |
          set +e

          LOG="$TEST_DIR/flutter-test.log"
          OUT="$TEST_DIR/flutter-failures.md"

          {
            echo "# Flutter Test Failure Extraction"
            echo

            if [[ -f "$LOG" ]]; then

              echo "## Failed tests"
              grep -nE \
                "FAILED|Test failed|Some tests failed|Expected:|Actual:|Which:|Exception:|Error:" \
                "$LOG" \
                || true

              echo
              echo "## Test result summary"
              grep -nE \
                "All tests passed|tests? passed|tests? failed|passed|failed" \
                "$LOG" \
                | tail -n 100 \
                || true

            else
              echo "Flutter test log not found."
            fi

          } > "$OUT"

      - name: Upload Flutter tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-flutter-tests
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore


  # ============================================================
  # 4. BACKEND TESTS
  # ============================================================

  backend_tests:
    name: Backend Tests
    needs: environment
    if: needs.environment.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: List backend scripts
        working-directory: backend
        shell: bash
        run: |
          set +e
          npm run > "../$TEST_DIR/backend-scripts.txt" 2>&1
          exit 0

      # ----------------------------------------------------------
      # MAIN TEST
      # ----------------------------------------------------------

      - name: Backend main test suite
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e

          npm run test --if-present \
            2>&1 | tee "../$TEST_DIR/backend-test.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "../$TEST_DIR/backend-test.exitcode"

          echo "Backend main tests exit code: $CODE"

          exit 0

      # ----------------------------------------------------------
      # PostgreSQL MUST STILL RUN EVEN IF MAIN TEST FAILED
      # ----------------------------------------------------------

      - name: Backend PostgreSQL tests
        if: always()
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e

          npm run test:postgres --if-present \
            2>&1 | tee "../$TEST_DIR/backend-postgres.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "../$TEST_DIR/backend-postgres.exitcode"

          exit 0

      # ----------------------------------------------------------
      # S3 MUST STILL RUN
      # ----------------------------------------------------------

      - name: Backend S3 tests
        if: always()
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e

          npm run test:s3 --if-present \
            2>&1 | tee "../$TEST_DIR/backend-s3.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "../$TEST_DIR/backend-s3.exitcode"

          exit 0

      - name: Backend failure extraction
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "# Backend Test Diagnostics"
            echo

            for FILE in \
              backend-test \
              backend-postgres \
              backend-s3
            do
              echo "## $FILE"

              if [[ -f "$TEST_DIR/$FILE.exitcode" ]]; then
                echo "Exit code: $(cat "$TEST_DIR/$FILE.exitcode")"
              else
                echo "Exit code: not available"
              fi

              if [[ -f "$TEST_DIR/$FILE.log" ]]; then
                echo
                grep -nE \
                  "FAIL|FAILED|Error|error|Exception|Assertion|Expected|Received|Timeout" \
                  "$TEST_DIR/$FILE.log" \
                  | tail -n 200 \
                  || true
              fi

              echo
            done

          } > "$TEST_DIR/backend-failures.md"

      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-backend-tests
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 5. BACKEND QUALITY
  # ============================================================

  backend_quality:
    name: Backend Quality & Security
    needs: environment
    if: needs.environment.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: npm audit
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e

          mkdir -p "../$TEST_DIR"

          npm audit \
            --audit-level=high \
            2>&1 | tee "../$TEST_DIR/npm-audit.log"

          echo "${PIPESTATUS[0]}" > "../$TEST_DIR/npm-audit.exitcode"

          exit 0

      - name: Backend syntax check
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e

          mkdir -p "../$TEST_DIR"

          FAILED=0

          while IFS= read -r -d '' FILE; do
            echo "Checking: $FILE"

            node --check "$FILE" \
              2>&1 | tee -a "../$TEST_DIR/backend-syntax.log"

            CODE=${PIPESTATUS[0]}

            if [[ "$CODE" -ne 0 ]]; then
              FAILED=1
            fi

          done < <(
            find . \
              -type f \
              \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) \
              -not -path './node_modules/*' \
              -print0
          )

          echo "$FAILED" > "../$TEST_DIR/backend-syntax.exitcode"

          exit 0

      - name: Upload backend quality
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-backend-quality
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 6. FINANCIAL CORE
  # ============================================================

  financial_core:
    name: Financial Core Verification
    needs: environment
    if: needs.environment.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Financial architecture scan
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          REPORT="$TEST_DIR/financial-core.md"

          {
            echo "# Financial Core Verification"
            echo

            echo "## Wallet / Ledger"
            find backend lib \
              -type f \
              \( \
                -iname "*wallet*" \
                -o -iname "*ledger*" \
                -o -iname "*transaction*" \
                -o -iname "*payment*" \
                -o -iname "*payout*" \
              \) \
              2>/dev/null \
              | sort || true

            echo
            echo "## State Machine"
            grep -RniE \
              "FUND|PAY|LOCK|COMPLETE|APPROVE|REFUND|RELEASE|PAYOUT|HOLD|PENDING|FAILED" \
              backend \
              --exclude-dir=node_modules \
              2>/dev/null \
              | head -n 500 || true

            echo
            echo "## Idempotency"
            grep -RniE \
              "idempot|request.?id|operation.?id|dedup|unique.*transaction" \
              backend \
              --exclude-dir=node_modules \
              2>/dev/null \
              | head -n 300 || true

            echo
            echo "## Concurrency"
            grep -RniE \
              "transaction|BEGIN|COMMIT|ROLLBACK|FOR UPDATE|atomic|lock" \
              backend \
              --exclude-dir=node_modules \
              2>/dev/null \
              | head -n 300 || true

          } > "$REPORT"

          exit 0

      - name: Upload financial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-financial-core
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 7. ANDROID / GRADLE
  # ============================================================

  android_tests:
    name: Android Gradle Tests
    needs: environment
    if: needs.environment.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # IMPORTANT:
      # test and lint are completely independent.
      # Neither is allowed to stop the other.

      - name: Gradle test
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set +e

          mkdir -p "../$TEST_DIR"

          chmod +x ./gradlew

          ./gradlew test \
            --continue \
            2>&1 | tee "../$TEST_DIR/gradle-test.log"

          echo "${PIPESTATUS[0]}" > "../$TEST_DIR/gradle-test.exitcode"

          exit 0

      - name: Gradle lint
        if: always()
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set +e

          chmod +x ./gradlew

          ./gradlew lint \
            --continue \
            2>&1 | tee "../$TEST_DIR/gradle-lint.log"

          echo "${PIPESTATUS[0]}" > "../$TEST_DIR/gradle-lint.exitcode"

          exit 0

      - name: Gradle failure extraction
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "# Android / Gradle Diagnostics"
            echo

            for FILE in gradle-test gradle-lint; do

              echo "## $FILE"

              if [[ -f "$TEST_DIR/$FILE.exitcode" ]]; then
                echo "Exit code: $(cat "$TEST_DIR/$FILE.exitcode")"
              fi

              if [[ -f "$TEST_DIR/$FILE.log" ]]; then
                echo
                grep -nE \
                  "FAILURE:|FAILED|FAIL|error:|ERROR|Exception|Caused by:|What went wrong" \
                  "$TEST_DIR/$FILE.log" \
                  | tail -n 250 \
                  || true
              fi

              echo
            done

          } > "$TEST_DIR/gradle-failures.md"

      - name: Upload Android tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-android-tests
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 8. APK
  # ============================================================

  android_apk:
    name: Debug APK Build
    needs:
      - environment
      - flutter_analyze
      - flutter_tests

    if: always() &&
        needs.environment.outputs.has_flutter == 'true' &&
        needs.environment.outputs.has_android == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          flutter build apk \
            --debug \
            --verbose \
            2>&1 | tee "$TEST_DIR/flutter-apk-build.log"

          echo "${PIPESTATUS[0]}" > "$TEST_DIR/flutter-apk-build.exitcode"

          exit 0

      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          find build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            > "$TEST_DIR/apk-files.txt"

          exit 0

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-debug-apk
          path: |
            build/app/outputs/apk/**/*.apk
            test-results/
          if-no-files-found: ignore


  # ============================================================
  # 9. AAB
  # ============================================================

  android_aab:
    name: Debug AAB Build
    needs:
      - environment
      - flutter_analyze
      - flutter_tests

    if: always() &&
        needs.environment.outputs.has_flutter == 'true' &&
        needs.environment.outputs.has_android == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build debug AAB
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          flutter build appbundle \
            --debug \
            --verbose \
            2>&1 | tee "$TEST_DIR/flutter-aab-build.log"

          echo "${PIPESTATUS[0]}" > "$TEST_DIR/flutter-aab-build.exitcode"

          exit 0

      - name: Locate AAB
        if: always()
        shell: bash
        run: |
          set +e

          find build/app/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print \
            > "$TEST_DIR/aab-files.txt"

          exit 0

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-debug-aab
          path: |
            build/app/outputs/bundle/**/*.aab
            test-results/
          if-no-files-found: ignore


  # ============================================================
  # 10. INTEGRATION TESTS
  # ============================================================

  integration_tests:
    name: Flutter Integration Tests
    needs: environment
    if: needs.environment.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify Android tooling
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            command -v sdkmanager || true
            command -v avdmanager || true
            command -v emulator || true
            command -v adb || true

            sdkmanager --list_installed 2>&1 || true
          } | tee "$TEST_DIR/android-tooling.log"

          exit 0

      - name: Install Android SDK components
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64" \
            2>&1 | tee "$TEST_DIR/android-sdk-install.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "$TEST_DIR/android-sdk-install.exitcode"

          exit 0

      - name: Create emulator
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          echo "no" | avdmanager create avd \
            --force \
            --name hope-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            2>&1 | tee "$TEST_DIR/emulator-create.log"

          echo "${PIPESTATUS[0]}" > "$TEST_DIR/emulator-create.exitcode"

          exit 0

      - name: Start emulator
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          nohup emulator \
            -avd hope-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

          adb wait-for-device

          timeout 240 bash -c '
            until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "1"; do
              sleep 2
            done
          '

          CODE=$?

          echo "$CODE" > "$TEST_DIR/emulator-boot.exitcode"

          if [[ "$CODE" -eq 0 ]]; then
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
          fi

          exit 0

      - name: Run integration tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          flutter test \
            --no-pub \
            integration_test \
            -d emulator-5554 \
            2>&1 | tee "$TEST_DIR/integration-test.log"

          CODE=${PIPESTATUS[0]}

          echo "$CODE" > "$TEST_DIR/integration-test.exitcode"

          exit 0

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "# Emulator Diagnostics"
            echo

            adb devices -l 2>&1 || true

            echo
            echo "## Boot"
            adb shell getprop sys.boot_completed 2>&1 || true

            echo
            echo "## Flutter devices"
            flutter devices 2>&1 || true

            echo
            echo "## Emulator log"
            if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
              tail -n 500 "$RUNNER_TEMP/emulator.log"
            fi

          } > "$TEST_DIR/emulator-diagnostics.md"

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-integration-tests
          path: |
            test-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore


  # ============================================================
  # 11. CERTIFICATION
  # ============================================================

  certification:
    name: Certification & Release Gates
    needs: environment

    if: needs.environment.outputs.has_flutter == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        continue-on-error: true
        run: |
          set +e
          flutter pub get
          exit 0

      - name: Certification discovery
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          {
            echo "# Certification Discovery"
            echo

            find . \
              -type f \
              \( \
                -iname "*certification*" \
                -o -iname "*scorecard*" \
                -o -iname "*release*gate*" \
              \) \
              -not -path './.git/*' \
              -not -path './build/*' \
              | sort

            echo
            echo "## tools/"
            find tools -maxdepth 3 -type f 2>/dev/null | sort || true

          } > "$TEST_DIR/certification-discovery.md"

      - name: Android toolchain certification
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [[ -f tools/ci-android-toolchain.sh ]]; then

            bash tools/ci-android-toolchain.sh \
              2>&1 | tee "$TEST_DIR/ci-android-toolchain.log"

            echo "${PIPESTATUS[0]}" \
              > "$TEST_DIR/ci-android-toolchain.exitcode"

          else

            echo "NOT_PRESENT" \
              > "$TEST_DIR/ci-android-toolchain.exitcode"

            echo "tools/ci-android-toolchain.sh not present"

          fi

          exit 0

      - name: Debug APK certification
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [[ -f tools/build_apk_debug.sh ]]; then

            bash tools/build_apk_debug.sh \
              2>&1 | tee "$TEST_DIR/build-apk-debug-script.log"

            echo "${PIPESTATUS[0]}" \
              > "$TEST_DIR/build-apk-debug-script.exitcode"

          else

            echo "NOT_PRESENT" \
              > "$TEST_DIR/build-apk-debug-script.exitcode"

            echo "tools/build_apk_debug.sh not present"

          fi

          exit 0

      - name: Upload certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-certification
          path: test-results/
          if-no-files-found: ignore


  # ============================================================
  # 12. MASTER DIAGNOSTIC GATE
  # ============================================================

  final_gate:
    name: HOPE Final Diagnostic Gate

    needs:
      - environment
      - flutter_analyze
      - flutter_tests
      - backend_tests
      - backend_quality
      - financial_core
      - android_tests
      - android_apk
      - android_aab
      - integration_tests
      - certification

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Evaluate all gates
        shell: bash
        run: |
          set +e

          mkdir -p "$TEST_DIR"

          FAILED=0

          {
            echo "# HOPE Full-Stack Diagnostic Result"
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Environment | ${{ needs.environment.result }} |"
            echo "| Flutter Analyze | ${{ needs.flutter_analyze.result }} |"
            echo "| Flutter Tests | ${{ needs.flutter_tests.result }} |"
            echo "| Backend Tests | ${{ needs.backend_tests.result }} |"
            echo "| Backend Quality | ${{ needs.backend_quality.result }} |"
            echo "| Financial Core | ${{ needs.financial_core.result }} |"
            echo "| Android Tests | ${{ needs.android_tests.result }} |"
            echo "| APK | ${{ needs.android_apk.result }} |"
            echo "| AAB | ${{ needs.android_aab.result }} |"
            echo "| Integration | ${{ needs.integration_tests.result }} |"
            echo "| Certification | ${{ needs.certification.result }} |"
            echo

            echo "## Gate Evaluation"
            echo

          } > "$TEST_DIR/final-diagnostic.md"

          check_gate() {
            NAME="$1"
            RESULT="$2"

            case "$RESULT" in

              success)
                echo "[PASS] $NAME" \
                  | tee -a "$TEST_DIR/final-diagnostic.md"
                ;;

              skipped)
                echo "[SKIP] $NAME" \
                  | tee -a "$TEST_DIR/final-diagnostic.md"
                ;;

              *)
                echo "[FAIL] $NAME -> $RESULT" \
                  | tee -a "$TEST_DIR/final-diagnostic.md"

                FAILED=1
                ;;

            esac
          }

          check_gate "Environment" "${{ needs.environment.result }}"
          check_gate "Flutter Analyze" "${{ needs.flutter_analyze.result }}"
          check_gate "Flutter Tests" "${{ needs.flutter_tests.result }}"
          check_gate "Backend Tests" "${{ needs.backend_tests.result }}"
          check_gate "Backend Quality" "${{ needs.backend_quality.result }}"
          check_gate "Financial Core" "${{ needs.financial_core.result }}"
          check_gate "Android Tests" "${{ needs.android_tests.result }}"
          check_gate "APK" "${{ needs.android_apk.result }}"
          check_gate "AAB" "${{ needs.android_aab.result }}"
          check_gate "Integration" "${{ needs.integration_tests.result }}"
          check_gate "Certification" "${{ needs.certification.result }}"

          echo >> "$TEST_DIR/final-diagnostic.md"

          if [[ "$FAILED" -ne 0 ]]; then

            echo "FINAL RESULT: FAIL" \
              | tee -a "$TEST_DIR/final-diagnostic.md"

          else

            echo "FINAL RESULT: PASS" \
              | tee -a "$TEST_DIR/final-diagnostic.md"

          fi

          # IMPORTANT:
          # The final gate is the ONLY place where the workflow
          # intentionally returns non-zero.

          exit "$FAILED"

      - name: Upload MASTER diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-master-diagnostic
          path: test-results/
          if-no-files-found: ignore

      - name: Generate GitHub summary
        if: always()
        shell: bash
        run: |
          {
            echo "# HOPE Full-Stack Diagnostic"
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Environment | ${{ needs.environment.result }} |"
            echo "| Flutter Analyze | ${{ needs.flutter_analyze.result }} |"
            echo "| Flutter Tests | ${{ needs.flutter_tests.result }} |"
            echo "| Backend Tests | ${{ needs.backend_tests.result }} |"
            echo "| Backend Quality | ${{ needs.backend_quality.result }} |"
            echo "| Financial Core | ${{ needs.financial_core.result }} |"
            echo "| Android Tests | ${{ needs.android_tests.result }} |"
            echo "| APK | ${{ needs.android_apk.result }} |"
            echo "| AAB | ${{ needs.android_aab.result }} |"
            echo "| Integration | ${{ needs.integration_tests.result }} |"
            echo "| Certification | ${{ needs.certification.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
