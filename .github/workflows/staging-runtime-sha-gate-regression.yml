name: Staging runtime SHA gate regression

on:
  pull_request:
    branches:
      - integration/hopev2-refreshed-candidate-20261117
    paths:
      - '.github/workflows/staging-certification.yml'
      - 'backend/src/app.js'
      - 'backend/tests/staging-runtime-sha-gate-contract.test.mjs'
      - '.github/workflows/staging-runtime-sha-gate-regression.yml'
  push:
    branches:
      - fix/hopev2-staging-runtime-sha-gate-20261117
      - fix/hopev2-staging-runtime-sha-redirect-guard-20261117
    paths:
      - '.github/workflows/staging-certification.yml'
      - 'backend/src/app.js'
      - 'backend/tests/staging-runtime-sha-gate-contract.test.mjs'
      - '.github/workflows/staging-runtime-sha-gate-regression.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Runtime SHA fail-closed contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Runtime SHA contract regression
        working-directory: backend
        run: node --test tests/staging-runtime-sha-gate-contract.test.mjs

      - name: Backend static checks
        working-directory: backend
        run: npm run check

      - name: Backend fast regression suite
        working-directory: backend
        run: npm run test:fast
