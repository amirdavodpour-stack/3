name: HOPE DR Restore Current-Step Retry

on:
  push:
    branches:
      - chore/android-emulator-cert-clean-2026-09-19
  workflow_dispatch:

concurrency:
  group: hope-dr-restore-current-step-retry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dr-restore-current:
    name: Retry DR restore drill only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
      DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
      RTO_TARGET_SECONDS: '900'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          if ! apt-cache show postgresql-client-18 >/dev/null 2>&1; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/pgdg.asc >/dev/null
            echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -y
          fi
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Start Railway Postgres SSH tunnel
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${RAILWAY_SSH_PRIVATE_KEY:?RAILWAY_SSH_PRIVATE_KEY is required}"

          RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '
')"
          RAILWAY_API_TOKEN="$(printf '%s' "${RAILWAY_API_TOKEN:-}" | tr -d '
')"
          RAILWAY_SSH_PRIVATE_KEY="$(printf '%s' "$RAILWAY_SSH_PRIVATE_KEY" | tr -d '')"

          install -d -m 700 "$HOME/.ssh"
          umask 077
          key_file="$HOME/.ssh/id_ed25519"
          raw_key="$RAILWAY_SSH_PRIVATE_KEY"

          if printf '%s' "$raw_key" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            printf '%s
' "$raw_key" | sed 's/\\n/
/g' > "$key_file"
          else
            compact_key="$(printf '%s' "$raw_key" | tr -d '[:space:]')"
            decoded_key="$RUNNER_TEMP/railway-dr-key.bin"
            printf '%s' "$compact_key" | base64 --decode > "$decoded_key"
            if head -c 15 "$decoded_key" | grep -aq '^openssh-key-v1'; then
              {
                printf '%s
' '-----BEGIN OPENSSH PRIVATE KEY-----'
                base64 --wrap=64 "$decoded_key"
                printf '%s
' '-----END OPENSSH PRIVATE KEY-----'
              } > "$key_file"
            else
              tr -d '' < "$decoded_key" > "$RUNNER_TEMP/railway-dr-key.txt"
              grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$RUNNER_TEMP/railway-dr-key.txt"
              cat "$RUNNER_TEMP/railway-dr-key.txt" > "$key_file"
            fi
          fi

          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$HOME/.ssh/id_ed25519.pub"
          test "$(ssh-keygen -lf "$HOME/.ssh/id_ed25519.pub" | awk '{print $2}')" = 'SHA256:/Lrb+F+ajiLSfE93dOL7jMsajR7AMlKoSNTLchVjn3w'

          npm install -g --allow-scripts=@railway/cli @railway/cli@5.30.1 >/dev/null
          project_id='8c686259-09c6-4609-bbe7-4ea25e769e18'
          environment_id='5a435e97-1e7a-4a5c-952c-19da2f10d955'
          workspace_id='e6af3417-6d75-46e1-b1e3-e1aae3374974'

          tunnel_log="$RUNNER_TEMP/railway-postgres-tunnel.log"
          project_ok=false
          if [ -n "$RAILWAY_TOKEN" ]; then
            env -u RAILWAY_API_TOKEN -u RAILWAY_TOKEN RAILWAY_TOKEN="$RAILWAY_TOKEN"               railway connect Postgres --tunnel-only --port 15432               --project "$project_id" --environment "$environment_id" >"$tunnel_log" 2>&1 &
            tunnel_pid=$!
            for _ in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then project_ok=true; break; fi
              if ! kill -0 "$tunnel_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$project_ok" != true ]; then
              cat "$tunnel_log" >&2 || true
              kill "$tunnel_pid" 2>/dev/null || true
            fi
          fi

          if [ "$project_ok" != true ]; then
            : "${RAILWAY_API_TOKEN:?RAILWAY_API_TOKEN is required for workspace fallback}"
            rm -f "$key_file" "$HOME/.ssh/id_ed25519.pub"
            ssh-keygen -t ed25519 -N '' -C "hope-github-actions-dr-$GITHUB_RUN_ID" -f "$key_file" >/dev/null
            chmod 600 "$key_file"
            workspace_key_name="hope-github-actions-dr-$GITHUB_RUN_ID"
            env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN"               railway ssh keys add --workspace "$workspace_id"               --key "$HOME/.ssh/id_ed25519.pub" --name "$workspace_key_name"
            cleanup_workspace_key() {
              set +e
              env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN"                 railway ssh keys remove --workspace "$workspace_id" "$workspace_key_name" >/tmp/hope-dr-key-cleanup.log 2>&1
            }
            trap cleanup_workspace_key EXIT
            env -u RAILWAY_TOKEN RAILWAY_API_TOKEN="$RAILWAY_API_TOKEN"               railway connect Postgres --tunnel-only --port 15432               --project "$project_id" --environment "$environment_id"               >"$tunnel_log" 2>&1 &
            tunnel_pid=$!
            for _ in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then project_ok=true; break; fi
              if ! kill -0 "$tunnel_pid" 2>/dev/null; then cat "$tunnel_log" >&2; exit 1; fi
              sleep 1
            done
          fi

          [ "$project_ok" = true ]
          pg_isready -h 127.0.0.1 -p 15432

      - name: Prepare tunneled source URL
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.hostname="127.0.0.1"; u.port="15432"; process.stdout.write(u.toString())')"
          echo "SOURCE_DATABASE_TUNNELED_URL=$source_url" >> "$GITHUB_ENV"

      - name: Retry only DR restore drill
        env:
          SOURCE_DATABASE_URL: ${{ env.SOURCE_DATABASE_TUNNELED_URL }}
          DRILL_DATABASE_URL: ${{ env.DRILL_DATABASE_URL }}
          DRILL_EVIDENCE_FILE: ${{ runner.temp }}/hope-dr-restore-evidence.txt
        run: |
          set -euo pipefail
          bash backend/scripts/dr-restore-drill.sh
