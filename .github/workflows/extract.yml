name: HOPE Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          REPO_ROOT="$GITHUB_WORKSPACE"
          TMP_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "$TMP_DIR"
          }

          trap cleanup EXIT

          echo "Repository: $REPO_ROOT"

          echo "Searching for ZIP..."

          mapfile -d '' ZIP_CANDIDATES < <(
            find "$REPO_ROOT" \
              -type f \
              -iname "*.zip" \
              -not -path "$REPO_ROOT/.git/*" \
              -print0
          )

          if [[ "${#ZIP_CANDIDATES[@]}" -eq 0 ]]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          if [[ "${#ZIP_CANDIDATES[@]}" -gt 1 ]]; then
            echo "Multiple ZIP files found:"
            printf ' - %s\n' "${ZIP_CANDIDATES[@]#$REPO_ROOT/}"
            echo
            echo "Set ZIP_NAME to select the intended archive."
            exit 1
          fi

          ZIP_FILE="${ZIP_CANDIDATES[0]}"

          echo "Using:"
          echo "  ${ZIP_FILE#$REPO_ROOT/}"

          echo "Checking ZIP integrity..."

          unzip -t "$ZIP_FILE" >/dev/null

          EXTRACT_DIR="$TMP_DIR/extracted"

          mkdir -p "$EXTRACT_DIR"

          echo "Extracting..."

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          shopt -s nullglob dotglob

          TOP_LEVEL_ITEMS=("$EXTRACT_DIR"/*)

          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 0 ]]; then
            echo "ERROR: ZIP is empty."
            exit 1
          fi

          SOURCE_ROOT="$EXTRACT_DIR"

          # Detect an unnecessary single top-level directory.
          if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 1 && -d "${TOP_LEVEL_ITEMS[0]}" ]]; then
            INNER_ITEMS=("${TOP_LEVEL_ITEMS[0]}"/*)

            if [[ "${#INNER_ITEMS[@]}" -gt 0 ]]; then
              SOURCE_ROOT="${TOP_LEVEL_ITEMS[0]}"
            fi
          fi

          echo "Source root:"
          echo "  ${SOURCE_ROOT#$TMP_DIR/}"

          echo "Validating archive paths..."

          while IFS= read -r -d '' path; do
            relative="${path#$SOURCE_ROOT/}"

            if [[ "$relative" == ../* || "$relative" == */../* ]]; then
              echo "ERROR: Unsafe path detected: $relative"
              exit 1
            fi

            if [[ "$relative" == /* ]]; then
              echo "ERROR: Absolute path detected: $relative"
              exit 1
            fi
          done < <(find "$SOURCE_ROOT" -print0)

          echo "Copying source into repository root..."

          if command -v rsync >/dev/null 2>&1; then
            rsync -a \
              --exclude='.git/' \
              "$SOURCE_ROOT/" \
              "$REPO_ROOT/"
          else
            cp -a "$SOURCE_ROOT"/. "$REPO_ROOT"/
          fi

          echo "Removing ZIP from repository working tree..."

          rm -f "$ZIP_FILE"

          echo
          echo "Bootstrap completed."

          echo
          echo "Repository status:"
          git status --short

      - name: Commit bootstrapped source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap source from project archive"
          git push
