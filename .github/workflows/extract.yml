#!/usr/bin/env bash

set -Eeuo pipefail

###############################################################################
# HOPE Repository Bootstrap
#
# Purpose:
#   Locate the project ZIP inside the repository, extract it, and synchronize
#   its complete contents into the repository root.
#
# Usage:
#   ./bootstrap.sh
#
# Optional:
#   ZIP_NAME="HOPE-V8-clean-source-with-certification-scorecards.zip" ./bootstrap.sh
###############################################################################

SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
REPO_ROOT="$SCRIPT_DIR"

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------

ZIP_NAME="${ZIP_NAME:-}"

TMP_DIR="$(mktemp -d "${TMPDIR:-/tmp}/hope-bootstrap.XXXXXX")"

cleanup() {
    rm -rf "$TMP_DIR"
}

trap cleanup EXIT

log() {
    printf '\n[%s] %s\n' "BOOTSTRAP" "$*"
}

fail() {
    printf '\n[BOOTSTRAP ERROR] %s\n' "$*" >&2
    exit 1
}

# ---------------------------------------------------------------------------
# Repository validation
# ---------------------------------------------------------------------------

cd "$REPO_ROOT"

if [[ ! -d "$REPO_ROOT/.git" ]]; then
    fail "Repository root not found: $REPO_ROOT"
fi

log "Repository root: $REPO_ROOT"

# ---------------------------------------------------------------------------
# Locate ZIP
# ---------------------------------------------------------------------------

log "Searching for project ZIP..."

ZIP_FILE=""

if [[ -n "$ZIP_NAME" ]]; then
    while IFS= read -r -d '' candidate; do
        ZIP_FILE="$candidate"
        break
    done < <(
        find "$REPO_ROOT" \
            -type f \
            -name "$ZIP_NAME" \
            -not -path "$REPO_ROOT/.git/*" \
            -print0
    )

    [[ -n "$ZIP_FILE" ]] || fail "ZIP '$ZIP_NAME' was not found."
else
    mapfile -d '' ZIP_CANDIDATES < <(
        find "$REPO_ROOT" \
            -type f \
            \( -iname "*.zip" \) \
            -not -path "$REPO_ROOT/.git/*" \
            -print0
    )

    if [[ "${#ZIP_CANDIDATES[@]}" -eq 0 ]]; then
        fail "No ZIP file was found inside the repository."
    fi

    if [[ "${#ZIP_CANDIDATES[@]}" -gt 1 ]]; then
        echo
        echo "Multiple ZIP files were found:"
        echo

        for i in "${!ZIP_CANDIDATES[@]}"; do
            printf '  [%d] %s\n' "$((i + 1))" "${ZIP_CANDIDATES[$i]#$REPO_ROOT/}"
        done

        echo
        fail "Set ZIP_NAME to explicitly select the project ZIP."
    fi

    ZIP_FILE="${ZIP_CANDIDATES[0]}"
fi

log "Using ZIP:"
log "  ${ZIP_FILE#$REPO_ROOT/}"

# ---------------------------------------------------------------------------
# ZIP integrity check
# ---------------------------------------------------------------------------

log "Checking ZIP integrity..."

unzip -t "$ZIP_FILE" >/dev/null \
    || fail "ZIP integrity check failed."

# ---------------------------------------------------------------------------
# Extract
# ---------------------------------------------------------------------------

EXTRACT_DIR="$TMP_DIR/extracted"

mkdir -p "$EXTRACT_DIR"

log "Extracting ZIP..."

unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR" \
    || fail "ZIP extraction failed."

# ---------------------------------------------------------------------------
# Detect archive layout
# ---------------------------------------------------------------------------

log "Analyzing archive layout..."

shopt -s nullglob dotglob

TOP_LEVEL_ITEMS=("$EXTRACT_DIR"/*)

if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 0 ]]; then
    fail "ZIP is empty."
fi

SOURCE_ROOT="$EXTRACT_DIR"

# Detect the common case:
#
# archive.zip
#   └── project/
#       ├── lib/
#       ├── backend/
#       └── pubspec.yaml
#
# In that case we want project/*, not project/ itself.
if [[ "${#TOP_LEVEL_ITEMS[@]}" -eq 1 && -d "${TOP_LEVEL_ITEMS[0]}" ]]; then
    POSSIBLE_ROOT="${TOP_LEVEL_ITEMS[0]}"

    INNER_ITEMS=("$POSSIBLE_ROOT"/*)

    if [[ "${#INNER_ITEMS[@]}" -gt 0 ]]; then
        SOURCE_ROOT="$POSSIBLE_ROOT"
    fi
fi

log "Archive source root:"
log "  ${SOURCE_ROOT#$TMP_DIR/}"

# ---------------------------------------------------------------------------
# Safety validation
# ---------------------------------------------------------------------------

log "Validating archive paths..."

while IFS= read -r -d '' file; do
    relative="${file#$SOURCE_ROOT/}"

    if [[ "$relative" == "../"* || "$relative" == *"/../"* ]]; then
        fail "Unsafe archive path detected: $relative"
    fi

    if [[ "$relative" == /* ]]; then
        fail "Absolute archive path detected: $relative"
    fi
done < <(find "$SOURCE_ROOT" -print0)

# ---------------------------------------------------------------------------
# Synchronize archive contents into repository root
# ---------------------------------------------------------------------------

log "Synchronizing archive contents into repository root..."

# rsync is preferred because it correctly handles:
#   - hidden files
#   - directories
#   - executable permissions
#   - timestamps
#   - nested structures
#
# IMPORTANT:
#   --delete is intentionally NOT used.
#
# This means files already present in main but not present in the ZIP are
# NOT deleted. This protects the repository from accidental source loss.

if command -v rsync >/dev/null 2>&1; then

    rsync -a \
        --exclude='.git/' \
        "$SOURCE_ROOT/" \
        "$REPO_ROOT/"

else

    log "rsync unavailable; using cp fallback."

    cp -a "$SOURCE_ROOT"/. "$REPO_ROOT"/
fi

# ---------------------------------------------------------------------------
# Never leave the bootstrap ZIP inside the resulting source tree
# ---------------------------------------------------------------------------

log "Removing bootstrap ZIP from repository working tree..."

rm -f "$ZIP_FILE"

# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------

log "Running post-bootstrap verification..."

if [[ ! -f "$REPO_ROOT/pubspec.yaml" ]]; then
    log "WARNING: pubspec.yaml was not found."
fi

if [[ -d "$REPO_ROOT/lib" ]]; then
    log "Flutter source detected."
fi

if [[ -d "$REPO_ROOT/test" ]]; then
    log "Flutter tests detected."
fi

if [[ -d "$REPO_ROOT/integration_test" ]]; then
    log "Integration tests detected."
fi

if [[ -d "$REPO_ROOT/backend" ]]; then
    log "Backend source detected."
fi

# ---------------------------------------------------------------------------
# Git status
# ---------------------------------------------------------------------------

log "Bootstrap completed."

echo
echo "============================================================"
echo " HOPE BOOTSTRAP COMPLETE"
echo "============================================================"
echo
echo "Repository:"
echo "  $REPO_ROOT"
echo
echo "Source:"
echo "  ${SOURCE_ROOT#$TMP_DIR/}"
echo
echo "ZIP:"
echo "  $(basename "$ZIP_FILE")"
echo
echo "Git status:"
echo "------------------------------------------------------------"

git status --short

echo
echo "============================================================"
echo " The ZIP contents have been placed into repository root."
echo "============================================================"
