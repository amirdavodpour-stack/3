name: Isolated performance retry

on:
  push:
    branches:
      - hope/perf-retry-2026-09-17

permissions:
  contents: read

jobs:
  perf-retry:
    name: Performance retry only
    runs-on: ubuntu-latest
    env:
      PERF_BASE_URL: https://v2hope-production-7e9e.up.railway.app
      PERF_REQUESTS: '500'
      PERF_CONCURRENCY: '50'
      PERF_P95_BUDGET_MS: '500'
      PERF_P99_BUDGET_MS: '1000'
      PERF_MAX_5XX_RATE: '0.01'
      PERF_OUTPUT: perf-smoke.json
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Performance smoke retry
        run: node backend/tools/perf-smoke.mjs

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-performance-retry-${{ github.run_id }}
          path: perf-smoke.json
          if-no-files-found: warn
