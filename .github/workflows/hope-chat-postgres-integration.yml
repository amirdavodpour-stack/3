name: HOPE chat PostgreSQL integration

on:
  pull_request:
    branches:
      - feat/ui-v2-wave-1-execution-2026-10-07
    paths:
      - "backend/src/db/migrations/03*.js"
      - "backend/src/repository/human_chat.js"
      - "backend/src/routes/human_chat_routes.js"
      - "backend/src/services/human_chat.js"
      - "backend/tests/human-chat*.test.mjs"
      - "backend/tests/postgres-*.test.mjs"
      - "backend/tools/run-chat-postgres-isolated.mjs"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/hope-chat-postgres-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hope-chat-postgres-integration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  postgres-chat:
    name: PostgreSQL migration 034 and human-chat regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hope_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run isolated real-PostgreSQL integration tests
        working-directory: backend
        run: npm run test:chat-postgres:isolated
