name: HOPEv2 Free Staging validation

on:
  push:
    branches:
      - integration/hopev2-free-staging-serverless-20261119
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/hopev2-free-staging-validation.yml"
  pull_request:
    branches:
      - integration/hopev2-combined-candidate-runtime-sdk-retry-20261118
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/hopev2-free-staging-validation.yml"

permissions:
  contents: read

concurrency:
  group: hopev2-free-staging-validation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Node 24 backend contracts and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend syntax and static checks
        working-directory: backend
        run: npm run check

      - name: Migration syntax checks
        working-directory: backend
        run: npm run check:migrations

      - name: Backend fast regression suite
        working-directory: backend
        run: npm run test:fast

      - name: Dependency security audit
        working-directory: backend
        run: npm audit --audit-level=high
