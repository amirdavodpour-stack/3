name: Bootstrap Free LLM Coding Agent

on:
  push:
    branches:
      - feat/google-sign-in-2026-09-20
    paths:
      - .github/workflows/bootstrap-free-llm-agent.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize agent files
        env:
          AGENT_GZ_B64: |
            
          TEST_GZ_B64: |
            
          DOCS_GZ_B64: |
            
          WORKFLOW_GZ_B64: |
            
        run: |
          mkdir -p tools/tests docs/agents
          printf '%s' "$AGENT_GZ_B64" | base64 --decode | gzip -d > tools/free-llm-agent.mjs
          printf '%s' "$TEST_GZ_B64" | base64 --decode | gzip -d > tools/tests/free-llm-agent.test.mjs
          printf '%s' "$DOCS_GZ_B64" | base64 --decode | gzip -d > docs/agents/free-llm-coding-agent.md
          printf '%s' "$WORKFLOW_GZ_B64" | base64 --decode | gzip -d > .github/workflows/free-llm-agent-contract.yml
          node --check tools/free-llm-agent.mjs
          node --test tools/tests/free-llm-agent.test.mjs

      - name: Replace bootstrap with final files
        run: |
          rm .github/workflows/bootstrap-free-llm-agent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/free-llm-agent.mjs tools/tests/free-llm-agent.test.mjs docs/agents/free-llm-coding-agent.md .github/workflows/free-llm-agent-contract.yml .github/workflows/bootstrap-free-llm-agent.yml
          git commit -m "chore: add free LLM coding agent"
          git push origin HEAD:${GITHUB_REF_NAME}
