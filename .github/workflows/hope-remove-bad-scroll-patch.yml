name: HOPE Remove Incorrect Job Detail Scroll Patch

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  repair-tests:
    if: >-
      contains(github.event.head_commit.message, '[CI-TRIGGER]') &&
      !contains(github.event.head_commit.message, '[CI-CONTRACT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Remove bad scroll injection and run focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/features/marketplace/job_detail_page_test.dart')
          text = p.read_text(encoding='utf-8')
          blocks = [
              "    final scrollable =\n        tester.state<ScrollableState>(find.byType(Scrollable).first);\n    scrollable.position.jumpTo(scrollable.position.maxScrollExtent);\n    await tester.pumpAndSettle();\n",
              "    final scrollable =\n        tester.state<ScrollableState>(find.byType(Scrollable).first);\n    scrollable.position.jumpTo(scrollable.position.maxScrollExtent);\n    await tester.pumpAndSettle();\n",
          ]
          for b in blocks:
              text = text.replace(b, '')
          p.write_text(text, encoding='utf-8')
          PY
          flutter pub get
          dart format test/features/marketplace/job_detail_page_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          set +e
          mkdir -p test-results
          : > test-results/job-detail-regression-summary.md
          overall=0
          for t in \
            test/features/marketplace/job_detail_page_test.dart \
            test/features/marketplace/create_job_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/profile/profile_page_test.dart \
            test/features/home/home_page_navigation_test.dart \
            test/core/router/app_routes_test.dart; do
            log="test-results/jobfix_$(echo "$t" | tr '/.' '__').log"
            flutter test --no-pub "$t" >"$log" 2>&1
            rc=$?
            echo "$t: $rc" | tee -a test-results/job-detail-regression-summary.md
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          echo "OVERALL_EXIT=$overall" | tee -a test-results/job-detail-regression-summary.md
          echo "$overall" > test-results/job-detail-regression-exit.txt
          exit 0
      - name: Persist test repair and results
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/features/marketplace/job_detail_page_test.dart test-results/job-detail-regression-summary.md test-results/job-detail-regression-exit.txt test-results/jobfix_*.log .github/workflows/hope-remove-bad-scroll-patch.yml
          git commit -m '[CI-CONTRACT] remove incorrect job detail scroll patch' || true
          git push origin HEAD:${BRANCH}
      - name: Enforce focused gate
        if: always()
        shell: bash
        run: test "$(cat test-results/job-detail-regression-exit.txt)" = "0"
