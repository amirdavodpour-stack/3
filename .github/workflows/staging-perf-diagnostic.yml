name: Staging performance diagnostic

on:
  push:
    paths:
      - '.github/workflows/staging-perf-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Staging performance diagnostic
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://v2hope-production-7e9e.up.railway.app' }}
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN || secrets.METRICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '24'

      - name: Run targeted endpoint diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/perf-diagnostic
          node > artifacts/perf-diagnostic/staging-perf-diagnostic.json <<'NODE'
          import fs from 'node:fs/promises';
          import { performance } from 'node:perf_hooks';

          const baseUrl = String(process.env.STAGING_BASE_URL || '').replace(/\/$/, '');
          if (!/^https:\/\/[^\s]+$/.test(baseUrl)) throw new Error('STAGING_BASE_URL must be an HTTPS URL');
          const metricsToken = String(process.env.STAGING_METRICS_TOKEN || '');
          const endpoints = ['/live', '/health', '/api/v1/jobs'];
          const requestsPerEndpoint = 60;
          const concurrency = 20;

          async function one(endpoint) {
            const started = performance.now();
            try {
              const response = await fetch(`${baseUrl}${endpoint}`, {
                headers: { 'Cache-Control': 'no-cache' },
              });
              const latencyMs = performance.now() - started;
              return {
                endpoint,
                latencyMs,
                status: response.status,
                instanceId: response.headers.get('x-instance-id') || null,
              };
            } catch (error) {
              return {
                endpoint,
                latencyMs: performance.now() - started,
                status: 0,
                instanceId: null,
                error: error?.message || String(error),
              };
            }
          }

          async function runEndpoint(endpoint) {
            const results = [];
            let next = 0;
            async function worker() {
              while (true) {
                const index = next++;
                if (index >= requestsPerEndpoint) return;
                results.push(await one(endpoint));
              }
            }
            await Promise.all(Array.from({ length: concurrency }, () => worker()));
            const sorted = results.map((r) => r.latencyMs).sort((a, b) => a - b);
            const percentile = (p) => sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * p) - 1))] || 0;
            const statuses = Object.fromEntries(
              [...new Set(results.map((r) => r.status))].sort((a, b) => a - b).map((status) => [String(status), results.filter((r) => r.status === status).length]),
            );
            const instances = Object.fromEntries(
              [...new Set(results.map((r) => r.instanceId).filter(Boolean))].sort().map((id) => [id, results.filter((r) => r.instanceId === id).length]),
            );
            return {
              requests: results.length,
              statuses,
              instances,
              latencyMs: {
                p50: Number(percentile(0.50).toFixed(2)),
                p95: Number(percentile(0.95).toFixed(2)),
                p99: Number(percentile(0.99).toFixed(2)),
                max: Number(Math.max(...sorted, 0).toFixed(2)),
              },
              errors: results.filter((r) => r.error).slice(0, 10),
            };
          }

          const warmup = [];
          for (const endpoint of endpoints) warmup.push(await one(endpoint));
          const perEndpoint = {};
          for (const endpoint of endpoints) perEndpoint[endpoint] = await runEndpoint(endpoint);

          const metricsSamples = [];
          if (metricsToken) {
            for (let i = 0; i < 12; i += 1) {
              const response = await fetch(`${baseUrl}/metrics`, {
                headers: { 'x-metrics-token': metricsToken, 'Cache-Control': 'no-cache' },
              });
              const body = await response.json();
              metricsSamples.push({
                status: response.status,
                instanceId: response.headers.get('x-instance-id') || null,
                route: body?.routes?.['GET /api/v1/jobs'] || null,
                slowestRoutes: body?.slowestRoutes || null,
                latency: body?.latency || null,
                recentHealth: body?.recentHealth || null,
              });
            }
          }

          const report = {
            schemaVersion: 1,
            target: baseUrl,
            workload: { requestsPerEndpoint, concurrency, endpoints },
            warmup,
            perEndpoint,
            metricsSamples,
          };
          await fs.writeFile('artifacts/perf-diagnostic/staging-perf-diagnostic.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: hope-staging-perf-diagnostic-${{ github.run_id }}
          path: artifacts/perf-diagnostic/staging-perf-diagnostic.json
          if-no-files-found: error
