name: Staging performance diagnostic

on:
  push:
    paths:
      - '.github/workflows/staging-perf-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Staging performance diagnostic
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://v2hope-production-7e9e.up.railway.app' }}
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN || secrets.METRICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '24'

      - name: Run targeted endpoint diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/perf-diagnostic
          node > artifacts/perf-diagnostic/staging-perf-diagnostic.json <<'NODE'
          import fs from 'node:fs/promises';
          import https from 'node:https';
          import { performance } from 'node:perf_hooks';

          const baseUrl = String(process.env.STAGING_BASE_URL || '').replace(/\/$/, '');
          if (!/^https:\/\/[^\s]+$/.test(baseUrl)) throw new Error('STAGING_BASE_URL must be an HTTPS URL');
          const metricsToken = String(process.env.STAGING_METRICS_TOKEN || '');
          const endpoints = ['/live', '/health', '/api/v1/jobs'];

          function percentile(sorted, p) {
            return sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * p) - 1))] || 0;
          }

          async function fetchOne(endpoint) {
            const started = performance.now();
            try {
              const response = await fetch(`${baseUrl}${endpoint}`, {
                headers: { 'Cache-Control': 'no-cache' },
              });
              // Consume the body so the connection can be reused deterministically.
              await response.arrayBuffer();
              return {
                endpoint,
                latencyMs: performance.now() - started,
                status: response.status,
                instanceId: response.headers.get('x-instance-id') || null,
              };
            } catch (error) {
              return {
                endpoint,
                latencyMs: performance.now() - started,
                status: 0,
                instanceId: null,
                error: error?.message || String(error),
              };
            }
          }

          function nativeRequest(endpoint, agent) {
            return new Promise((resolve) => {
              const started = performance.now();
              const request = https.request(`${baseUrl}${endpoint}`, {
                method: 'GET',
                agent,
                headers: { 'Cache-Control': 'no-cache' },
              }, (response) => {
                response.resume();
                response.on('end', () => resolve({
                  endpoint,
                  latencyMs: performance.now() - started,
                  status: response.statusCode || 0,
                }));
              });
              request.setTimeout(20000, () => request.destroy(new Error('timeout')));
              request.on('error', (error) => resolve({
                endpoint,
                latencyMs: performance.now() - started,
                status: 0,
                error: error?.message || String(error),
              }));
              request.end();
            });
          }

          async function runMixed(totalRequests, concurrency, requestFn) {
            const results = [];
            let next = 0;
            async function worker() {
              while (true) {
                const index = next++;
                if (index >= totalRequests) return;
                results.push(await requestFn(endpoints[index % endpoints.length]));
              }
            }
            const started = performance.now();
            await Promise.all(Array.from({ length: concurrency }, () => worker()));
            const elapsedMs = performance.now() - started;
            const latencies = results.map((r) => r.latencyMs).sort((a, b) => a - b);
            return {
              totalRequests,
              concurrency,
              elapsedMs: Number(elapsedMs.toFixed(2)),
              requestsPerSecond: Number(((results.length / elapsedMs) * 1000).toFixed(2)),
              statuses: Object.fromEntries(
                [...new Set(results.map((r) => r.status))].sort((a, b) => a - b).map((status) => [String(status), results.filter((r) => r.status === status).length]),
              ),
              latencyMs: {
                p50: Number(percentile(latencies, 0.50).toFixed(2)),
                p95: Number(percentile(latencies, 0.95).toFixed(2)),
                p99: Number(percentile(latencies, 0.99).toFixed(2)),
                max: Number(Math.max(...latencies, 0).toFixed(2)),
              },
              byEndpoint: Object.fromEntries(endpoints.map((endpoint) => {
                const values = results.filter((r) => r.endpoint === endpoint).map((r) => r.latencyMs).sort((a, b) => a - b);
                return [endpoint, {
                  requests: values.length,
                  p50: Number(percentile(values, 0.50).toFixed(2)),
                  p95: Number(percentile(values, 0.95).toFixed(2)),
                  p99: Number(percentile(values, 0.99).toFixed(2)),
                  max: Number(Math.max(...values, 0).toFixed(2)),
                }];
              })),
              errors: results.filter((r) => r.error).slice(0, 20),
            };
          }

          async function curlTiming(endpoint) {
            const { execFile } = await import('node:child_process');
            const { promisify } = await import('node:util');
            const exec = promisify(execFile);
            const url = `${baseUrl}${endpoint}`;
            try {
              const { stdout } = await exec('curl', [
                '--silent', '--show-error', '--output', '/dev/null', '--write-out',
                '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}',
                '--max-time', '20', url,
              ]);
              const [status, dns, connect, tls, startTransfer, total] = stdout.trim().split(/\s+/).map(Number);
              return { endpoint, status, dnsMs: dns * 1000, connectMs: connect * 1000, tlsMs: tls * 1000, startTransferMs: startTransfer * 1000, totalMs: total * 1000 };
            } catch (error) {
              return { endpoint, error: error?.message || String(error) };
            }
          }

          const warmup = [];
          for (const endpoint of endpoints) warmup.push(await fetchOne(endpoint));
          const mixed = await runMixed(500, 50, fetchOne);
          const nativeAgent = new https.Agent({ keepAlive: true, maxSockets: 50, maxFreeSockets: 50 });
          const nativeMixed = await runMixed(500, 50, (endpoint) => nativeRequest(endpoint, nativeAgent));
          nativeAgent.destroy();
          const curlTimingSamples = [];
          for (const endpoint of endpoints) {
            for (let i = 0; i < 3; i += 1) curlTimingSamples.push(await curlTiming(endpoint));
          }

          const metricsSamples = [];
          if (metricsToken) {
            for (let i = 0; i < 6; i += 1) {
              const response = await fetch(`${baseUrl}/metrics`, {
                headers: { 'x-metrics-token': metricsToken, 'Cache-Control': 'no-cache' },
              });
              const body = await response.json();
              metricsSamples.push({
                status: response.status,
                route: body?.routes?.['GET /api/v1/jobs'] || null,
                slowestRoutes: body?.slowestRoutes || null,
                latency: body?.latency || null,
                recentHealth: body?.recentHealth || null,
              });
            }
          }

          const report = {
            schemaVersion: 3,
            target: baseUrl,
            workload: { endpoints, totalRequests: 500, concurrency: 50 },
            warmup,
            fetchMixed: mixed,
            nativeHttpsMixed: nativeMixed,
            curlTimingSamples,
            metricsSamples,
          };
          await fs.writeFile('artifacts/perf-diagnostic/staging-perf-diagnostic.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: hope-staging-perf-diagnostic-${{ github.run_id }}
          path: artifacts/perf-diagnostic/staging-perf-diagnostic.json
          if-no-files-found: error
