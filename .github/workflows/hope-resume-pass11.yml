name: HOPE Resume Pass 11

on:
  pull_request:
    branches:
      - main
    paths:
      - test-results/pass11-trigger.txt

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  unresolved-regressions:
    if: github.event.pull_request.head.ref == 'hope/full-stack-hardening-2026-09-17'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Reconcile persisted fixes and unfinished contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_all(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  print(f'patched {path}: {count}')
              else:
                  print(f'no-op {path}: {old!r}')

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print(f'patched {path}')
              else:
                  print(f'no-op {path}: {old!r}')

          replace_all('test/features/home/home_page_navigation_test.dart',
                      "find.byTooltip('Menu')",
                      "find.byTooltip('More menu')")

          replace_once(
              'test/features/marketplace/create_job_page_test.dart',
              "    await tester.enterText(\n        find.widgetWithText(TextField, 'Application deadline'), '2026-09-30');",
              "    await tester.tap(find.widgetWithText(TextField, 'Application deadline'));\n    await tester.pumpAndSettle();\n    expect(find.byType(DatePickerDialog), findsOneWidget);\n    await tester.tap(find.text('30').last);\n    await tester.pumpAndSettle();\n    if (find.text('OK').evaluate().isNotEmpty) {\n      await tester.tap(find.text('OK').last);\n      await tester.pumpAndSettle();\n    }",
          )

          replace_once(
              'lib/l10n/app_en.arb',
              '"copy_value_irr_ed45261": "$value TOMAN"',
              '"copy_value_irr_ed45261": "{value} TOMAN"',
          )

          replace_once(
              'test/features/marketplace/jobs_page_test.dart',
              "expect(find.text('طراحی'), findsOneWidget); // category option in sheet",
              "expect(find.widgetWithText(ListTile, 'طراحی'), findsOneWidget); // category option in sheet",
          )
          replace_once(
              'test/features/marketplace/jobs_page_test.dart',
              "await tester.tap(find.text('طراحی'));",
              "await tester.tap(find.widgetWithText(ListTile, 'طراحی'));",
          )
          replace_once(
              'test/features/marketplace/jobs_page_test.dart',
              "await tester.tap(find.widgetWithText(ListTile, 'طراحی')); // reopen picker via updated chip",
              "await tester.tap(find.widgetWithText(ActionChip, 'طراحی')); // reopen picker via updated chip",
          )
          replace_all(
              'test/features/marketplace/jobs_page_test.dart',
              "await tester.tap(find.text('همه حوزه‌ها'));",
              "await tester.tap(find.widgetWithText(ActionChip, 'همه حوزه‌ها'));",
          )

          replace_all(
              'test/features/marketplace/job_detail_page_test.dart',
              "find.text('View transaction')",
              "find.text('View financial flow')",
          )
          replace_once(
              'test/features/marketplace/job_detail_page_test.dart',
              "    await tester.scrollUntilVisible(find.text('View financial flow'), 150);\n    await tester.pumpAndSettle();\n    await tester.tap(find.text('View financial flow'));",
              "    await tester.tap(find.text('View financial flow'));",
          )

          page = Path('lib/features/marketplace/job_detail_page.dart')
          text = page.read_text(encoding='utf-8')
          old = """      body: LayoutBuilder(
        builder: (context, constraints) {
          return Center(
            child: ConstrainedBox(
              constraints: BoxConstraints(
                maxWidth: 1180,
                minHeight: constraints.maxHeight,
              ),
              child: ListView("""
          new = """      body: LayoutBuilder(
        builder: (context, constraints) {
          return Center(
            child: ConstrainedBox(
              constraints: BoxConstraints(
                maxWidth: 1180,
                minHeight: constraints.maxHeight,
              ),
              child: SizedBox(
                width: double.infinity,
                height: constraints.maxHeight,
                child: ListView("""
          replace_once('lib/features/marketplace/job_detail_page.dart', old, new)

          old_end = """                ],
              ),
            ),
          );
        },
      ),
    );
  }

  Widget _line("""
          new_end = """                ],
              ),
            ),
          ),
        );
        },
      ),
    );
  }

  Widget _line("""
          if old_end in text:
              page.write_text(text.replace(old_end, new_end, 1), encoding='utf-8')
              print('patched job detail viewport closure')
          else:
              print('no-op job detail viewport closure')

          text = page.read_text(encoding='utf-8')
          old_banner = """              const SizedBox(height: 13),
              _JobLifecycleCard(job: j),"""
          new_banner = """              if (isJob) ...[
                const SizedBox(height: 13),
                HopeSurface(
                  padding: const EdgeInsets.all(16),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Icon(Icons.verified_user_outlined),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Text(
                          HopeCopy.of(context)
                              .copy_job_applications_are_reviewed_by_an_admin__5098e17,
                        ),
                      ),
                    ],
                  ),
                ),
              ],
              const SizedBox(height: 13),
              _JobLifecycleCard(job: j),"""
          if old_banner in text:
              page.write_text(text.replace(old_banner, new_banner, 1), encoding='utf-8')
              print('patched job detail admin review banner')
          else:
              print('job detail admin review banner already present')

          p = Path('lib/features/transactions/transaction_widgets.part.dart')
          text = p.read_text(encoding='utf-8')
          if "job.status ?? 'UNKNOWN'" not in text:
              old = "              if (job != null)\n                Text(job.title,\n                    style: Theme.of(context).textTheme.headlineSmall),\n              const SizedBox(height: 6),"
              new = "              if (job != null) ...[\n                Text(job.title,\n                    style: Theme.of(context).textTheme.headlineSmall),\n                const SizedBox(height: 8),\n                Align(\n                  alignment: AlignmentDirectional.centerStart,\n                  child: StatusPill(\n                    job.status ?? 'UNKNOWN',\n                    color: AppColors.muted,\n                    icon: Icons.work_history_outlined,\n                  ),\n                ),\n              ],\n              const SizedBox(height: 6),"
              if old not in text:
                  raise SystemExit('transaction lifecycle insertion point not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched transaction lifecycle')
          else:
              print('transaction lifecycle already persisted')

          p = Path('lib/core/ui/premium_components.dart')
          text = p.read_text(encoding='utf-8')
          if 'child: Material(type: MaterialType.transparency, child: child),' not in text:
              text, n = re.subn(
                  r'(class PremiumPanel extends StatelessWidget \{.*?padding: padding,\n)      child: child,',
                  r'\1      child: Material(type: MaterialType.transparency, child: child),',
                  text,
                  count=1,
                  flags=re.S,
              )
              if n != 1:
                  raise SystemExit('PremiumPanel Material insertion point not found')
              p.write_text(text, encoding='utf-8')
              print('patched PremiumPanel Material')
          else:
              print('PremiumPanel Material already persisted')
          PY

          flutter gen-l10n

          dart format \
            lib/core/ui/premium_components.dart \
            lib/features/transactions/transaction_widgets.part.dart \
            lib/features/marketplace/job_detail_page.dart \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test/features/marketplace/create_job_page_test.dart \
            test/features/home/home_page_navigation_test.dart

          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run regression files
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          : > test-results/pass11-summary.md
          overall=0
          for t in \
            test/features/transactions/transaction_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart; do
            log="test-results/$(echo "$t" | tr '/.' '__').log"
            echo "### $t" | tee -a test-results/pass11-summary.md
            flutter test --no-pub "$t" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo PASS | tee -a test-results/pass11-summary.md
            else
              overall=1
              echo "FAIL (exit=$rc)" | tee -a test-results/pass11-summary.md
              echo '```text' >> test-results/pass11-summary.md
              tail -n 260 "$log" >> test-results/pass11-summary.md
              echo '```' >> test-results/pass11-summary.md
            fi
          done
          echo "OVERALL_EXIT=$overall" | tee -a test-results/pass11-summary.md
          exit 0

      - name: Persist this checkpoint to the working branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/ui/premium_components.dart \
            lib/features/transactions/transaction_widgets.part.dart \
            lib/features/marketplace/job_detail_page.dart \
            lib/l10n/app_en.arb \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            test/features/home/home_page_navigation_test.dart \
            test/features/marketplace/create_job_page_test.dart \
            test/features/marketplace/jobs_page_test.dart \
            test/features/marketplace/job_detail_page_test.dart \
            test-results/pass11-summary.md \
            .github/workflows/hope-resume-pass11.yml
          git commit -m '[CI-RESUME] pass 11 job detail viewport and regression checkpoint' || true
          git push origin HEAD:${BRANCH}

      - name: Enforce regression gate
        shell: bash
        run: |
          test "$(grep -E '^OVERALL_EXIT=' test-results/pass11-summary.md | tail -1 | cut -d= -f2)" = "0"
