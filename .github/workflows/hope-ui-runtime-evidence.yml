name: HOPE UI Runtime Evidence

on:
  push:
    branches:
      - feat/google-sign-in-2026-09-20
  pull_request:
    branches:
      - Main

concurrency:
  group: hope-ui-runtime-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wallet-runtime-evidence:
    name: Wallet Android runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify HOPE design/runtime guardrails
        run: bash tools/verify-design-quality.sh

      - name: Prepare Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Android runtime evidence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash tools/hope-wallet-runtime-evidence.sh

      - name: Upload Wallet runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: hope-wallet-runtime-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            docs/audit/evidence/android-runtime/**
            ${{ runner.temp }}/hope-wallet-runtime.log
          if-no-files-found: warn
