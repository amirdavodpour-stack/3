# [runtime-capture-fa] exact-head certification retry after restoring Run #1765 capture contracts
name: HOPE UI Runtime Evidence
# [runtime-capture-fa] visual convergence wave jobs-wallet 2026-10-06

on:
  # Android rendered-evidence certification is explicit/manual by default.
  # One-shot feature-branch push bridge is enabled only for commits explicitly
  # marked [runtime-capture]; this exists because the connected GitHub
  # capability exposes no workflow_dispatch mutation and the phone-side
  # Termux shell cannot execute gh directly.
  workflow_dispatch:
    inputs:
      capture_locale:
        description: "Locale session to certify"
        required: true
        type: choice
        options:
          - fa
          - en

  # Current-head visual validation bridge: 2026-10-03 UI architecture batch.
# [runtime-capture] validate Wallet chunked settle diagnostic at exact current HEAD.
# [runtime-capture-fa] one-shot capture requested from GitHub connector.
# [runtime-capture-fa] validate bounded RegisterPage screenshot settling after transient driver hang.
# [runtime-capture-fa] fresh current-head capture requested after clearing prior run.
# [runtime-capture-fa] current-head capture requested after compact-search fix and recommendation fixture.
# [runtime-capture] hardened Android evidence trigger — swangle + natural driver teardown
# [runtime-capture-fa] validate grouped discovery + wallet hierarchy wave at current feature HEAD.
# [runtime-capture-fa] validate finance + opportunity-detail hierarchy wave at exact current feature HEAD.
# [runtime-capture-fa] validate grouped finance + discovery-detail consolidation.
# [runtime-capture-fa] validate compile-fix before next visual evidence wave.
# [runtime-capture-fa] validate explicit page-canvas surface after shared frame hardening.

  # Runtime capture is intentionally NOT push-triggered. A capture request is
  # represented by the PR title marker (or explicit workflow_dispatch) so a
  # single HEAD cannot launch duplicate runtime captures through push + PR.

  # Temporary observable PR trigger: title marker is toggled only for a
  # one-shot capture run because the GitHub connector exposes no dispatch mutation.
  pull_request:
    types: [edited, synchronize]

permissions:
  contents: read

jobs:
  critical-screens-runtime-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.title.from != null && (github.head_ref == 'fix/hopev2-visual-audit-v1-v2-2026-10-20' || github.head_ref == 'feat/google-sign-in-2026-09-20' || github.head_ref == 'feat/ui-v2-wave-1-execution-2026-10-07' || github.head_ref == 'feat/hopev2-kinetic-editorial-2026-10-16') && (contains(github.event.pull_request.title, '[runtime-capture-fa]') || contains(github.event.pull_request.title, '[runtime-capture-fa-home]') || contains(github.event.pull_request.title, '[runtime-capture-en-scale]'))) }}
    # Only an authorized runtime job acquires this lock. Skipped PR events cannot cancel capture.
    concurrency:
      group: hope-ui-runtime-evidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    name: Critical screens Android runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Align PR runtime checkout to exact feature HEAD
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          exact_head="$(git rev-parse HEAD^2)"
          git checkout --detach "$exact_head"
          test "$(git rev-parse HEAD)" = "$exact_head"
          echo "HOPE_RUNTIME_EXACT_HEAD:$exact_head"
          echo "HOPE_RUNTIME_EXACT_HEAD=$exact_head" >> "$GITHUB_ENV"

      - name: Checkout pinned Google TalkBack source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: google/talkback
          ref: 229212fdf5842191d0a93fc95d9ca1423b346866
          path: .ci/talkback
          fetch-depth: 1

      - name: Checkout pinned Android Emulator Runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: soloturn/android-emulator-runner
          ref: ab495a9b42f2af30f5222bd978136f9b0a85b68a
          path: .ci/android-emulator-runner
          fetch-depth: 1

      - name: Install pinned Android Emulator Runner dependencies
        working-directory: .ci/android-emulator-runner
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify pinned Android Emulator Runner
        run: |
          test -s .ci/android-emulator-runner/action.yml
          test -s .ci/android-emulator-runner/lib/main.js
          test -f .ci/android-emulator-runner/node_modules/@actions/core/package.json

      - name: Test Android ADB recovery contract
        run: bash test/runtime/android_runtime_adb_recovery_test.sh
      - name: Test Android Emulator package retry contract
        run: bash test/runtime/android_emulator_install_retry_test.sh
      - name: Test Android screenshot transport contract
        run: bash test/runtime/android_screenshot_transport_test.sh
      - name: Test TalkBack bound-service contract
        run: bash test/runtime/hope_enable_talkback_test.sh

      - name: Test Home source integrity
        run: sh test/runtime/home_source_integrity_test.sh
      - name: Test premium visual composition wave source integrity
        run: bash test/runtime/premium_visual_wave_source_test.sh

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache Android SDK components
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.1
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
          key: hope-android-sdk-api35-cmake3.22.1-default-${{ runner.os }}-v2

      - name: Cache Android AVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.1
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hope-android-avd-api35-default-pixel2-${{ runner.os }}-v2

      - name: Build pinned Google TalkBack accessibility service
        env:
          TALKBACK_SOURCE_SHA: 229212fdf5842191d0a93fc95d9ca1423b346866
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test "$(git -C .ci/talkback rev-parse HEAD)" = "$TALKBACK_SOURCE_SHA"
          grep -Fq 'talkbackApplicationId = "com.android.talkback"' .ci/talkback/shared.gradle
          grep -Fq 'com.google.android.marvin.talkback.TalkBackService' .ci/talkback/talkback/src/main/AndroidManifest.xml
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -d "$SDK_ROOT/ndk/28.2.13676358"
          # Patch only this disposable upstream checkout to include x86_64 for CI.
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a"/abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"/' .ci/talkback/shared.gradle
          grep -Fq 'abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"' .ci/talkback/shared.gradle
          # Avoid replacing the emulator's stock TalkBack package with a different signature.
          sed -i 's/talkbackApplicationId = "com.android.talkback"/talkbackApplicationId = "com.hopev2.ci.talkback"/' .ci/talkback/shared.gradle
          grep -Fq 'talkbackApplicationId = "com.hopev2.ci.talkback"' .ci/talkback/shared.gradle
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > .ci/talkback/local.properties
          ./android/gradlew --no-daemon --stacktrace -p .ci/talkback assemblePhoneDebug
          APK_PATH=".ci/talkback/build/outputs/apk/phone/debug/talkback-phone-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            find .ci/talkback -path '*/build/outputs/apk/*/*.apk' -type f -print
            echo "FAIL: pinned TalkBack debug APK was not produced at expected path." >&2
            exit 1
          fi
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK_PATH" | grep -Fq "package: name='com.hopev2.ci.talkback'"
          "$AAPT" dump xmltree "$APK_PATH" AndroidManifest.xml | grep -Fq 'com.google.android.marvin.talkback.TalkBackService'
          mkdir -p "$RUNNER_TEMP"
          cp "$APK_PATH" "$RUNNER_TEMP/hope-talkback.apk"
          printf '%s\n' "$TALKBACK_SOURCE_SHA" > "$RUNNER_TEMP/hope-talkback-source-sha.txt"
          sha256sum "$RUNNER_TEMP/hope-talkback.apk" | awk '{print $1}' > "$RUNNER_TEMP/hope-talkback-apk-sha256.txt"
          echo "HOPE_TALKBACK_BUILD_PASS:$TALKBACK_SOURCE_SHA:$(cat "$RUNNER_TEMP/hope-talkback-apk-sha256.txt")"

      - name: Verify HOPE design/runtime guardrails
        run: bash tools/verify-design-quality.sh

      - name: Prepare Flutter dependencies
        run: flutter pub get --enforce-lockfile

      # A green exact-HEAD static gate owns the sole consolidated Flutter invocation; [flutter-preverified] prevents a duplicate runtime test run.
      - name: Flutter visual wave focused gate
        if: ${{ !contains(github.event.pull_request.title, '[flutter-preverified]') }}
        run: flutter test --no-pub test/core/ui/premium_visual_wave_15_test.dart test/core/ui/hope_display_formatters_test.dart test/features/wallet/wave22_compact_wallet_test.dart test/features/jobs/saved_searches_page_test.dart test/features/transactions/transaction_page_test.dart test/features/marketplace/employer_candidate_matches_page_test.dart test/features/jobs/job_satisfaction_page_test.dart
      - name: Validate runtime evidence script syntax
        run: bash -n tools/hope-wallet-runtime-evidence.sh

      - name: Enforce successful Android runtime golden baseline
        run: bash test/runtime/android_runtime_golden_baseline_test.sh

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      # Android Emulator's host-side QEMU binary dynamically links PulseAudio
      # even for the non-interactive version probe used by the installer guard.
      # Hosted Ubuntu runners may omit this optional desktop runtime library.
      - name: Install Android Emulator host runtime libraries
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          ldconfig -p | grep -F 'libpulse.so.0'

      # Warm the latest emulator package with a bounded retry before the pinned
      # action invokes sdkmanager itself; this recovers from truncated SDK archives.
      - name: Prepare Android Emulator package with bounded retry
        env:
          HOPE_ANDROID_EMULATOR_INSTALL_ATTEMPTS: '3'
          HOPE_ANDROID_EMULATOR_INSTALL_RETRY_DELAY_SECONDS: '5'
        run: bash tools/install-android-emulator-retry.sh

      # Use the pinned runner that produced the fully green baseline certification; the full locale matrix is now 19 baseline + 6 responsive
      # on Run #35741811401. Keep the proven memory/AVD lifecycle contract intact.
      - name: Android runtime evidence
        uses: ./.ci/android-emulator-runner
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          HOPE_REQUIRE_GOOGLE_AUTH: '1'
          HOPE_CAPTURE_LOCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_locale || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-en-scale]') && 'en') || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[runtime-capture-fa]') || contains(github.event.pull_request.title, '[runtime-capture-fa-home]')) && 'fa') || ((contains(github.event.head_commit.message, '[runtime-capture-fa]') || contains(github.event.head_commit.message, '[runtime-capture-fa-home]')) && 'fa' || 'en') }}
          HOPE_CAPTURE_TEXT_SCALE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-en-scale]') && '1.5' || '1.0' }}
          HOPE_RUNTIME_STRICT_VALIDATION: '0'
          HOPE_TALKBACK_REQUIRED: '1'
          HOPE_TALKBACK_APK: ${{ runner.temp }}/hope-talkback.apk
          HOPE_TALKBACK_PACKAGE: com.hopev2.ci.talkback
          HOPE_TALKBACK_SOURCE_SHA: 229212fdf5842191d0a93fc95d9ca1423b346866
          HOPE_CAPTURE_HOME_ONLY: ${{ ((github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-fa-home]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[runtime-capture-fa-home]'))) && '1' || '0' }}
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          # Force AVD recreation and wipe user data before installing run-specific debug APKs.
          # Cached app packages may be signed by prior per-run keys, causing INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          # Emulator -wipe-data guarantees user apps/settings are removed even if AVD metadata is cached.
          # Use the current SwiftShader software renderer mode supported by modern Emulator releases.
          # Keep Vulkan explicitly disabled for deterministic GLES/PixelCopy capture on the headless lane.
          force-avd-creation: true
          cores: 4
          ram-size: 8192M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -wipe-data -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash tools/hope-wallet-runtime-evidence.sh

      - name: Validate runtime evidence artifact contents
        if: ${{ success() && !(github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-fa-home]')) }}
        env:
          HOPE_CAPTURE_LOCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_locale || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-en-scale]') && 'en') || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[runtime-capture-fa]') || contains(github.event.pull_request.title, '[runtime-capture-fa-home]')) && 'fa') || ((contains(github.event.head_commit.message, '[runtime-capture-fa]') || contains(github.event.head_commit.message, '[runtime-capture-fa-home]')) && 'fa' || 'en') }}
          HOPE_CAPTURE_TEXT_SCALE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-en-scale]') && '1.5' || '1.0' }}
        run: |
          test -d docs/audit/evidence/android-runtime
          png_count="$(find docs/audit/evidence/android-runtime -type f -name '*.png' | wc -l)"
          # Full capture gate: 19 baseline + 6 responsive + 10 scroll-end screenshots.
          test "${png_count}" -ge 35
          jq -e --arg sha "${HOPE_RUNTIME_EXACT_HEAD:-$GITHUB_SHA}" --arg locale "$HOPE_CAPTURE_LOCALE" --argjson scale "$HOPE_CAPTURE_TEXT_SCALE" --arg talkback_sha "229212fdf5842191d0a93fc95d9ca1423b346866" \
            '.sha == $sha and .capture_locale == $locale and .text_scale == $scale and .screens == 19 and .responsive_screens == 6 and .test_exit_code == 0 and .capture_transport == "native_android_pixelcopy" and .visual_capture_accessibility_service == "disabled" and .visual_capture_talkback_enabled == false and .visual_capture_accessibility_disable_verified == true and .talkback_semantics_mode == "separate_bound_service_pass" and .talkback_required == true and .talkback_enabled == true and .talkback_service_bound == true and .talkback_source_sha == $talkback_sha and (.talkback_apk_sha256 | length == 64) and .talkback_semantics_screens == 25 and .scroll_end_screens == 10 and .talkback_target_bounds_screens == 25 and .talkback_target_bounds_checked > 0 and .talkback_target_bounds_failures == 0 and .talkback_target_bounds_min_width_dp >= 48 and .talkback_target_bounds_min_height_dp >= 48' \
            docs/audit/evidence/android-runtime/metadata.json

      - name: Validate home-only diagnostic artifact contents
        if: ${{ success() && github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[runtime-capture-fa-home]') }}
        run: |
          test -s docs/audit/evidence/android-runtime/home-fa-rtl.png

      - name: Upload critical-screen runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: hope-critical-screens-runtime-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            docs/audit/evidence/android-runtime/**
            ${{ runner.temp }}/hope-*-runtime.log
          if-no-files-found: error
