# [runtime-capture-fa] navigation active-state calibration — exact-head capture.

# [runtime-capture-fa] exact-head validation for Home first-fold composition wave.

# [runtime-capture-fa] validate compact Profile account/trust summary wave at exact current HEAD.

# [runtime-capture-fa] validate isolated auth baseline driver session.

# [runtime-capture-fa] validate grouped Auth surface visual calibration.

# [runtime-capture-fa] rerun Auth visual evidence after ADB-offline failure and Login CTA fix.
# [runtime-capture-fa] validate PasswordReset bounded settle after compact Auth runtime timeout.
# [runtime-capture-fa] final grouped Opportunity Editorial wave: media hierarchy + opportunity hero calibration.
# [runtime-capture-fa] final capture after restoring exact #1560 runtime driver baseline.
# [runtime-capture-fa] verification capture after premium visual source guard correction at exact HEAD.
