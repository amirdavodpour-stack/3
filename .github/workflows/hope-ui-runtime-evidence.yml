name: HOPE UI Runtime Evidence

on:
  # Android rendered-evidence certification is explicit/manual by default.
  # One-shot feature-branch push bridge is enabled only for commits explicitly
  # marked [runtime-capture]; this exists because the connected GitHub
  # capability exposes no workflow_dispatch mutation and the phone-side
  # Termux shell cannot execute gh directly.
  workflow_dispatch:
    inputs:
      capture_locale:
        description: "Locale session to certify"
        required: true
        type: choice
        options:
          - fa
          - en

  push:
    branches:
      - feat/google-sign-in-2026-09-20

concurrency:
  group: hope-ui-runtime-evidence-${{ github.workflow }}-${{ github.ref }}
  # Evidence is exact-SHA bound. A newer feature-branch SHA supersedes an
  # older runtime run, so cancel stale in-progress captures instead of wasting
  # GitHub Free runner time and blocking the current evidence run.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  critical-screens-runtime-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[runtime-capture]')) }}
    name: Critical screens Android runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout pinned Android Emulator Runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: soloturn/android-emulator-runner
          ref: ab495a9b42f2af30f5222bd978136f9b0a85b68a
          path: .ci/android-emulator-runner
          fetch-depth: 1

      - name: Install pinned Android Emulator Runner dependencies
        working-directory: .ci/android-emulator-runner
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify pinned Android Emulator Runner
        run: |
          test -s .ci/android-emulator-runner/action.yml
          test -s .ci/android-emulator-runner/lib/main.js
          test -f .ci/android-emulator-runner/node_modules/@actions/core/package.json

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache Android SDK components
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.1
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
          key: hope-android-sdk-api35-cmake3.22.1-default-${{ runner.os }}-v1

      - name: Cache Android AVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.1
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hope-android-avd-api35-default-pixel2-${{ runner.os }}-v1

      - name: Verify HOPE design/runtime guardrails
        run: bash tools/verify-design-quality.sh

      - name: Prepare Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate runtime evidence script syntax
        run: bash -n tools/hope-wallet-runtime-evidence.sh

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      # Runtime evidence is tied to this exact feature-branch SHA; lib/assets changes trigger it.
      - name: Android runtime evidence
        uses: ./.ci/android-emulator-runner
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          HOPE_REQUIRE_GOOGLE_AUTH: '1'
          HOPE_CAPTURE_LOCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_locale || 'en' }}
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          force-avd-creation: false
          cores: 4
          ram-size: 6144M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash tools/hope-wallet-runtime-evidence.sh

      - name: Upload critical-screen runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: hope-critical-screens-runtime-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            docs/audit/evidence/android-runtime/**
            ${{ runner.temp }}/hope-*-runtime.log
          if-no-files-found: warn
