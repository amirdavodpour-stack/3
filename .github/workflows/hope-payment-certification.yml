name: HOPE Payment Certification

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hope-payment-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  payment-certification:
    name: Payment certification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hope -d hope_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://hope:hope@127.0.0.1:5432/hope_test
      NODE_ENV: test
      PAYMENT_PROVIDER: webhook
      PAYMENT_CURRENCY: TOMAN
      PAYMENT_PROVIDER_TOKEN: hope-ci-mock-provider-token-32-characters
      PAYMENT_PROVIDER_CREATE_URL: http://127.0.0.1:18080/create
      PAYMENT_PROVIDER_RELEASE_URL: http://127.0.0.1:18080/release
      PAYMENT_PROVIDER_REFUND_URL: http://127.0.0.1:18080/refund
      PAYMENT_WEBHOOK_SECRET: certification-webhook-secret-32-characters-minimum

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check payment provider service
        run: node --check tools/staging-payment-provider/server.mjs

      - name: Start local Mock Payment Provider
        working-directory: tools/staging-payment-provider
        env:
          PORT: '18080'
          PAYMENT_PROVIDER_TOKEN: hope-ci-mock-provider-token-32-characters
        run: |
          set -euo pipefail
          node server.mjs > "$RUNNER_TEMP/hope-mock-payment-provider.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hope-mock-payment-provider.pid"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/tmp/hope-mock-payment-health.json; then
              cat /tmp/hope-mock-payment-health.json
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hope-mock-payment-provider.log"
          exit 1

      - name: Run targeted payment certification
        id: targeted_payment
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ''
        run: npm run test:payment-certification

      - name: Run live Mock Payment Provider certification
        id: live_mock_payment
        continue-on-error: true
        working-directory: backend
        env:
          MOCK_PROVIDER_BASE_URL: http://127.0.0.1:18080
        run: npm run test:payment-mock-live

      - name: Run PostgreSQL migrations
        id: payment_migrations
        continue-on-error: true
        working-directory: backend
        run: npm run migrate

      - name: Run PostgreSQL webhook payment end-to-end
        id: payment_webhook_pg
        continue-on-error: true
        working-directory: backend
        env:
          REQUIRE_INTEGRATION: '1'
        run: npm run test:payment-webhook-postgres-e2e

      - name: Run PostgreSQL marketplace/payment lifecycle
        id: payment_postgres_lifecycle
        continue-on-error: true
        working-directory: backend
        env:
          REQUIRE_INTEGRATION: '1'
        run: npm run test:postgres

      - name: Run PostgreSQL internal wallet and ledger lifecycle
        id: payment_wallet_ledger
        continue-on-error: true
        working-directory: backend
        env:
          REQUIRE_INTEGRATION: '1'
        run: npm run test:payment-postgres-integration

      - name: Run PostgreSQL financial invariants
        id: payment_financial_invariants
        continue-on-error: true
        working-directory: backend
        run: npm run test:payment-postgres-invariants

      - name: Evaluate payment certification
        id: payment_certification_status
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          status=PASS
          for result in \
            "${{ steps.targeted_payment.outcome }}" \
            "${{ steps.live_mock_payment.outcome }}" \
            "${{ steps.payment_migrations.outcome }}" \
            "${{ steps.payment_webhook_pg.outcome }}" \
            "${{ steps.payment_postgres_lifecycle.outcome }}" \
            "${{ steps.payment_wallet_ledger.outcome }}" \
            "${{ steps.payment_financial_invariants.outcome }}"; do
            [ "$result" = "success" ] || status=BLOCKED
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf 'payment_certification_status=%s\n' "$status"
          [ "$status" = PASS ]

      - name: Capture Mock Payment Provider log
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f "$RUNNER_TEMP/hope-mock-payment-provider.log" ]; then
            cp "$RUNNER_TEMP/hope-mock-payment-provider.log" artifacts/hope-mock-payment-provider.log
          fi

      - name: Stop local Mock Payment Provider
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hope-mock-payment-provider.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hope-mock-payment-provider.pid")" 2>/dev/null || true
          fi

      - name: Generate evidence
        working-directory: backend
        if: always()
        run: |
          mkdir -p ../artifacts/HOPE_PAYMENT_CERTIFICATION
          printf '{"workflow":"HOPE Payment Certification","runId":"%s","sha":"%s","status":"%s"}\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.payment_certification_status.outputs.status }}" > ../artifacts/HOPE_PAYMENT_CERTIFICATION/summary.json
          git status --short > ../artifacts/HOPE_PAYMENT_CERTIFICATION/git-status.txt
          date -u > ../artifacts/HOPE_PAYMENT_CERTIFICATION/timestamp.txt
          tar -czf ../HOPE-PAYMENT-CERTIFICATION.tar.gz -C ../artifacts HOPE_PAYMENT_CERTIFICATION

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HOPE-PAYMENT-CERTIFICATION
          path: HOPE-PAYMENT-CERTIFICATION.tar.gz
          if-no-files-found: error
      - name: Enforce payment certification
        if: always()
        run: |
          test "${{ steps.payment_certification_status.outputs.status }}" = "PASS" || {
            echo "PAYMENT CERTIFICATION BLOCKED" >&2
            exit 1
          }
