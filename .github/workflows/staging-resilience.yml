name: Staging resilience drill

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      STAGING_BASE_URL:
        required: false
      API_BASE_URL_STAGING:
        required: false

permissions:
  contents: read

jobs:
  staging-resilience:
    name: Staging resilience
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || secrets.API_BASE_URL_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Runtime certification preflight
        run: bash tools/runtime-certification-preflight.sh

      - name: Staging resilience drill
        env:
          STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: bash tools/staging-resilience-drill.sh
