name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: hope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Backend and Flutter quality
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_BASE_URL_STAGING: ${{ secrets.API_BASE_URL_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate effective API base URL secret
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            effective_api_base_url="${API_BASE_URL_STAGING:-}"
            secret_label="API_BASE_URL_STAGING"
          else
            effective_api_base_url="${API_BASE_URL:-}"
            secret_label="API_BASE_URL"
          fi
          [ -n "$effective_api_base_url" ] || {
            echo "$secret_label secret is required for this event." >&2
            exit 1
          }
          [[ "$effective_api_base_url" =~ ^https://[^[:space:]]+$ ]] || {
            echo "$secret_label contains whitespace or is malformed; the API base URL must use HTTPS." >&2
            exit 1
          }

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend static check
        working-directory: backend
        run: npm run check

      - name: Runtime gate - npm audit
        id: npm_audit_gate
        working-directory: backend
        shell: bash
        run: |
          set -u
          result=pass
          npm audit --audit-level=high || result=fail
          CI=true node tools/write-evidence.mjs \
            --gate npm_audit \
            --command 'npm audit --audit-level=high' \
            --result "$result"
          if [ "$result" != pass ]; then
            status=1
          else
            status=0
          fi
          exit "$status"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter lockfile
        shell: bash
        run: bash tools/verify-pubspec-lock-fresh.sh

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter static and test gate
        id: flutter_gate
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --no-pub

      - name: Runtime gate - flutter toolchain
        id: flutter_runtime_evidence
        if: ${{ always() }}
        working-directory: backend
        env:
          GATE_RESULT: ${{ steps.flutter_gate.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          CI=true node tools/write-evidence.mjs \
            --gate flutter_toolchain \
            --command 'flutter analyze --no-fatal-warnings --no-fatal-infos && flutter test --no-pub' \
            --result "$GATE_RESULT"

      - name: Upload main evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-main-evidence-${{ github.run_id }}
          path: |
            docs/audit/evidence/*.json
          if-no-files-found: warn

  staging-performance:
    name: Staging performance smoke
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'Main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '24'

      - name: Staging performance smoke
        working-directory: backend
        env:
          PERF_BASE_URL: https://v2hope-production-7e9e.up.railway.app
          PERF_REQUESTS: '500'
          PERF_CONCURRENCY: '50'
          PERF_P95_BUDGET_MS: '500'
          PERF_P99_BUDGET_MS: '1000'
          PERF_MAX_5XX_RATE: '0.01'
        run: node ../tools/perf-smoke.mjs

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hope-staging-performance-${{ github.run_id }}
          path: backend/perf-smoke.json
          if-no-files-found: warn
