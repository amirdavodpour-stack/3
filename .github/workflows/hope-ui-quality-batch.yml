name: HOPE UI Quality Batch

on:
  push:
    branches:
      - feat/google-sign-in-2026-09-20

permissions:
  contents: read

jobs:
  ui-quality-batch:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-quality-batch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply analyzer machine fixes
        run: dart fix --apply
      - name: Targeted UI/state tests
        run: >
          flutter test --no-pub
          test/features/home/home_page_test.dart
          test/features/home/premium_home_feed_test.dart
          test/core/ui/premium_navigation_test.dart
          test/features/marketplace/job_detail_page_test.dart
          test/features/wallet/wallet_page_test.dart
          test/features/transactions/transaction_page_test.dart
      - name: Verify Flutter analyzer is clean
        run: flutter analyze
      - name: Normalize generated Flutter state
        run: |
          set -euo pipefail
          git restore -- \
            lib/l10n/generated/app_localizations.dart \
            lib/l10n/generated/app_localizations_en.dart \
            lib/l10n/generated/app_localizations_fa.dart \
            android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java || true
          git clean -fdX
      - name: Assert analyzer produced no repository changes
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
