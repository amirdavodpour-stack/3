name: HOPE Free LLM Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the repository coding agent"
        required: true
        type: string
      model:
        description: "Model for the primary provider; fallback providers use their own presets unless explicitly overridden"
        required: true
        default: "openrouter/free"
        type: string
      max_steps:
        description: "Maximum model/tool rounds (1-30)"
        required: true
        default: "12"
        type: string
      allow_git_write:
        description: "Allow the agent to commit, push, or create a PR"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hope-free-llm-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run HOPE Free LLM Coding Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout active branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Prepare Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare backend dependencies
        run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run repository coding agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_AGENT_PROVIDER: openrouter
          LLM_AGENT_PROVIDER_FALLBACKS: groq,gemini
          LLM_AGENT_MODEL: ${{ inputs.model }}
          LLM_AGENT_MAX_STEPS: ${{ inputs.max_steps }}
          LLM_AGENT_APPROVAL: auto
          LLM_AGENT_ALLOW_GIT_WRITE: ${{ inputs.allow_git_write && '1' || '0' }}
          LLM_AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME,,}" != "main"
          test "${GITHUB_REF_NAME,,}" != "master"
          set -o pipefail
          node tools/free-llm-agent.mjs "$LLM_AGENT_TASK" 2>&1 | tee agent-output.txt

      - name: Capture final working-tree evidence
        if: ${{ always() }}
        run: |
          git status --short --branch | tee agent-git-status.txt
          git diff --binary --no-ext-diff > agent-diff.patch
          git diff --stat | tee agent-diff-stat.txt

      - name: Upload agent evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: hope-free-llm-agent-${{ github.run_id }}
          path: |
            agent-output.txt
            agent-git-status.txt
            agent-diff.patch
            agent-diff-stat.txt
          if-no-files-found: warn
