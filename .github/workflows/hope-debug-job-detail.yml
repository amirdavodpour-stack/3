name: HOPE Verify Current Job Detail

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17
    paths:
      - test-results/debug-job-detail-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze current production source
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos >/tmp/job-detail-analyze.log 2>&1
          rc=$?
          {
            echo '# Current Job Detail Verification'
            echo
            echo "Branch: ${BRANCH}"
            echo "Analyze exit=${rc}"
            echo
            echo '## flutter analyze'
            echo '```text'
            cat /tmp/job-detail-analyze.log
            echo '```'
          } > test-results/job-detail-current-verification.md
          exit "$rc"

      - name: Add transient widget-tree diagnostics to test workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('test/features/marketplace/job_detail_page_test.dart')
          text = p.read_text(encoding='utf-8')

          first = """    await _pump(tester, job: _job());\n    expect(find.text('Mission details'), findsOneWidget);"""
          first_new = """    await _pump(tester, job: _job());\n    print('DEBUG mission scrollables: ${find.byType(Scrollable).evaluate().length}');\n    print('DEBUG mission text: ${tester.widgetList<Text>(find.byType(Text)).map((w) => w.data).whereType<String>().where((s) => s.contains('Mission') || s.contains('budget') || s.contains('Duration')).toList()}');\n    expect(find.text('Mission details'), findsOneWidget);"""
          if first not in text:
              raise SystemExit('mission insertion point not found')
          text = text.replace(first, first_new, 1)

          second = """    await _pump(tester, job: _job(kind: 'JOB'));\n    expect(find.text('Job details'), findsOneWidget);"""
          second_new = """    await _pump(tester, job: _job(kind: 'JOB'));\n    print('DEBUG job scrollables: ${find.byType(Scrollable).evaluate().length}');\n    print('DEBUG job text: ${tester.widgetList<Text>(find.byType(Text)).map((w) => w.data).whereType<String>().where((s) => s.contains('Job') || s.contains('Monthly') || s.contains('2026-09-30')).toList()}');\n    expect(find.text('Job details'), findsOneWidget);"""
          if second not in text:
              raise SystemExit('job insertion point not found')
          text = text.replace(second, second_new, 1)

          third = """    await _pump(\n      tester,\n      job: _job(kind: 'JOB', ownerId: 'u1'),\n      detail: detail,\n      userId: 'u1',\n    );\n\n    await tester.ensureVisible(find.text('Forwarded candidates'));"""
          third_new = """    await _pump(\n      tester,\n      job: _job(kind: 'JOB', ownerId: 'u1'),\n      detail: detail,\n      userId: 'u1',\n    );\n\n    print('DEBUG owner scrollables: ${find.byType(Scrollable).evaluate().length}');\n    print('DEBUG candidate text: ${tester.widgetList<Text>(find.byType(Text)).map((w) => w.data).whereType<String>().where((s) => s.contains('Forwarded') || s.contains('Anonymous') || s.contains('Interview') || s == 'Hire').toList()}');\n    await tester.ensureVisible(find.text('Forwarded candidates'));"""
          if third not in text:
              raise SystemExit('candidate insertion point not found')
          text = text.replace(third, third_new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Run exact unresolved job-detail regression test
        shell: bash
        run: |
          set +e
          flutter test --no-pub test/features/marketplace/job_detail_page_test.dart --reporter expanded >/tmp/job-detail-test.log 2>&1
          rc=$?
          {
            echo
            echo '## flutter test'
            echo "test_exit=${rc}"
            echo '```text'
            cat /tmp/job-detail-test.log
            echo '```'
          } >> test-results/job-detail-current-verification.md
          printf 'JOB_DETAIL_TEST_EXIT=%s\n' "$rc" >> test-results/job-detail-current-verification.md
          echo "JOB_DETAIL_TEST_EXIT=$rc"
          exit 0

      - name: Persist current verification checkpoint
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/job-detail-current-verification.md
          git commit -m '[CI-DIAGNOSTIC] persist current job detail regression output' || true
          git push origin HEAD:${BRANCH}
