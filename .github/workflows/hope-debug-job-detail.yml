name: HOPE Debug Job Detail

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17
    paths:
      - test-results/debug-job-detail-trigger.txt

permissions:
  contents: write

env:
  BRANCH: hope/full-stack-hardening-2026-09-17

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze current production source
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee /tmp/job-detail-analyze.log
      - name: Run exact unresolved job-detail test and persist result
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          flutter test --no-pub test/features/marketplace/job_detail_page_test.dart --reporter expanded > /tmp/job-detail-test.log 2>&1
          rc=$?
          {
            echo "# Job Detail Verification"
            echo
            echo "Branch: ${BRANCH}"
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "## Analyzer"
            echo '```text'
            cat /tmp/job-detail-analyze.log
            echo '```'
            echo
            echo "## Flutter test"
            echo "Exit code: $rc"
            echo '```text'
            cat /tmp/job-detail-test.log
            echo '```'
          } > test-results/job-detail-verification.md
          echo "TEST_EXIT=$rc" >> test-results/job-detail-verification.md
          exit 0
      - name: Persist verification checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/job-detail-verification.md
          git commit -m '[CI-DIAGNOSTIC] persist post-layout job detail verification' || true
          git push origin HEAD:${BRANCH}
