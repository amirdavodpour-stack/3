name: HOPEv2 Admin Outbox Retention Contract Tests

on:
  push:
    branches:
      - test/hopev2-admin-outbox-retention-contract-20261111
      - fix/hopev2-admin-outbox-retention-green-20261111
    paths:
      - ".github/workflows/hopev2-admin-outbox-retention-red.yml"
      - "backend/tests/admin-outbox-retention-routes.test.mjs"
      - "backend/tests/postgres-admin-outbox-retention-contract.test.mjs"
      - "backend/src/routes/admin_routes.js"
      - "backend/src/repository/outbox_retention.js"
      - "backend/openapi/openapi.yaml"
      - "backend/package-lock.json"

permissions:
  contents: read

concurrency:
  group: hopev2-admin-outbox-retention-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node24-route-contract:
    name: Node 24 Admin Outbox route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute isolated Admin route contract tests
        working-directory: backend
        run: node --test --test-concurrency=1 tests/admin-outbox-retention-routes.test.mjs
      - name: Check changed Admin and repository module syntax
        working-directory: backend
        run: node --check src/routes/admin_routes.js && node --check src/repository/outbox_retention.js
      - name: Validate added Outbox OpenAPI YAML fragments
        working-directory: backend
        run: |
          ruby <<'RUBY'
          require 'yaml'
          lines = File.readlines('openapi/openapi.yaml')
          schema_start = lines.index { |line| line.start_with?('    OutboxRetentionDryRunItem:') }
          paths_start = lines.index { |line| line == "  /admin/outbox-retention/dry-run:\n" }
          paths_end = lines.index { |line| line == "  /admin/audit:\n" }
          raise 'Outbox retention OpenAPI schema anchor is missing' unless schema_start
          raise 'Outbox retention OpenAPI path anchor is missing' unless paths_start && paths_end && paths_end > paths_start
          paths_marker = lines.index { |line| line == "paths:\n" }
          raise 'OpenAPI top-level paths marker is missing' unless paths_marker && paths_marker > schema_start
          schema_fragment = "components:\n  schemas:\n" + lines[schema_start...paths_marker].join
          paths_fragment = "paths:\n" + lines[paths_start...paths_end].join
          YAML.parse(schema_fragment)
          YAML.parse(paths_fragment)
          puts 'Added Outbox retention OpenAPI schema and paths fragments parse successfully'
          RUBY
      - name: Run backend fast regression suite
        working-directory: backend
        run: npm run test:fast

  postgres17-retention-contract:
    name: PostgreSQL 17 financial exclusion and audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope_test
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute isolated PostgreSQL contract tests
        working-directory: backend
        run: node --test --test-concurrency=1 --test-timeout=120000 tests/postgres-admin-outbox-retention-contract.test.mjs
