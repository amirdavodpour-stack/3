name: HOPEv2 Notification Outbox Payload v2

on:
  push:
    branches:
      - feat/hopev2-notification-outbox-payload-v2-20261111
    paths:
      - ".github/workflows/hopev2-notification-outbox-v2.yml"
      - "backend/src/repository/notifications.js"
      - "backend/src/repository/privacy.js"
      - "backend/src/outbox_handlers.js"
      - "backend/tests/notification-outbox-v2-contract.test.mjs"
      - "backend/tests/postgres-notification-outbox-v2-integration.test.mjs"

permissions:
  contents: read

concurrency:
  group: hopev2-notification-outbox-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node24:
    name: Notification Outbox v2 contracts (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify test syntax
        working-directory: backend
        run: node --check tests/notification-outbox-v2-contract.test.mjs && node --check tests/postgres-notification-outbox-v2-integration.test.mjs
      - name: Run RED-first Outbox v2 contracts
        working-directory: backend
        run: node --test tests/notification-outbox-v2-contract.test.mjs
      - name: Run backend fast regressions
        working-directory: backend
        run: npm run test:fast

  postgres17:
    name: Notification Outbox v2 integration (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope_test
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run PostgreSQL 17 Outbox v2 tests
        working-directory: backend
        run: node --test --test-concurrency=1 tests/postgres-notification-outbox-v2-integration.test.mjs
