name: Sync Google auth dependency locks

on:
  push:
    branches:
      - feat/google-sign-in-2026-09-20

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/google-sign-in-2026-09-20
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Sync backend package-lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Sync Flutter pubspec.lock
        run: flutter pub get

      - name: Commit generated lockfiles and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json pubspec.lock
          git rm .github/workflows/sync-google-auth-deps.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git commit -m "chore: sync Google auth dependency locks"
          git push origin HEAD:feat/google-sign-in-2026-09-20
