name: HOPE Diagnostic Pass 8

on:
  push:
    branches:
      - hope/full-stack-hardening-2026-09-17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    if: >-
      !startsWith(github.event.head_commit.message || '', '[CI-DIAGNOSTIC]') &&
      !startsWith(github.event.head_commit.message || '', '[CI-AUTOPASS]') &&
      !startsWith(github.event.head_commit.message || '', '[CI-VERIFY]') &&
      !startsWith(github.event.head_commit.message || '', '[CI-FIX]') &&
      !startsWith(github.event.head_commit.message || '', '[CI-CLEANUP]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: hope/full-stack-hardening-2026-09-17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter dependencies
        shell: bash
        run: flutter pub get

      - name: Apply safe production hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_line(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, n = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if n == 0:
                  print(f'no-op: {path}')
                  return
              p.write_text(new, encoding='utf-8')
              print(f'patched: {path}')

          replace_line(
              'lib/core/ui/premium_components.dart',
              r"^\s*final heroHeight = compact \? height\.clamp\(300\.0, 420\.0\)\.toDouble\(\) : height;\s*$",
              "    final heroHeight = compact\n        ? height.clamp(300.0, 420.0).toDouble()\n        : (height < 320 ? 320.0 : height);",
          )
          replace_line(
              'lib/core/ui/premium_components.dart',
              r"^\s*child: child,\s*$",
              "      child: Material(type: MaterialType.transparency, child: child),",
          )
          replace_line(
              'lib/features/transactions/transaction_widgets.part.dart',
              r"(?ms)^(\s*)if \(job != null\)\n\s*Text\(job\.title,\n\s*style: Theme\.of\(context\)\.textTheme\.headlineSmall\),\n\s*const SizedBox\(height: 6\),$",
              r"\1if (job != null) ...[\n\1  Text(job.title,\n\1      style: Theme.of(context).textTheme.headlineSmall),\n\1  const SizedBox(height: 8),\n\1  Align(\n\1    alignment: AlignmentDirectional.centerStart,\n\1    child: StatusPill(\n\1      job.status ?? 'UNKNOWN',\n\1      color: AppColors.muted,\n\1      icon: Icons.work_history_outlined,\n\1    ),\n\1  ),\n\1],\n\1const SizedBox(height: 6),",
          )
          PY

      - name: Format modified sources and analyze
        shell: bash
        run: |
          set -Eeuo pipefail
          dart format lib/core/ui/premium_components.dart lib/features/transactions/transaction_widgets.part.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run target tests independently and capture failures
        shell: bash
        run: |
          set +e
          mkdir -p test-results
          : > test-results/diagnostic-summary.md
          tests=(
            test/features/home/home_page_navigation_test.dart
            test/features/profile/profile_page_test.dart
            test/features/transactions/transaction_page_test.dart
            test/features/marketplace/jobs_page_test.dart
            test/features/marketplace/job_detail_page_test.dart
            test/features/marketplace/create_job_page_test.dart
            test/core/router/app_routes_test.dart
          )
          overall=0
          for t in "${tests[@]}"; do
            slug=$(echo "$t" | tr '/.' '__')
            log="test-results/${slug}.log"
            echo "### $t" | tee -a test-results/diagnostic-summary.md
            flutter test --no-pub "$t" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "PASS" | tee -a test-results/diagnostic-summary.md
            else
              overall=1
              echo "FAIL (exit=$rc)" | tee -a test-results/diagnostic-summary.md
              echo '```text' >> test-results/diagnostic-summary.md
              tail -n 180 "$log" >> test-results/diagnostic-summary.md
              echo '```' >> test-results/diagnostic-summary.md
            fi
          done
          echo "OVERALL_EXIT=$overall" | tee -a test-results/diagnostic-summary.md
          exit 0

      - name: Commit diagnostic snapshot and safe source hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'HOPE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/ui/premium_components.dart lib/features/transactions/transaction_widgets.part.dart
          git add test-results/diagnostic-summary.md
          git commit -m '[CI-DIAGNOSTIC] pass 8 isolated Flutter failure snapshot' || true
          git push origin HEAD:hope/full-stack-hardening-2026-09-17
