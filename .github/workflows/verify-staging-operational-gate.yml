name: Verify staging operational gate
on:
  pull_request:
    branches:
      - Main
concurrency:
  group: hope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  operational-gate:
    name: Staging operational gate only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_BASE_URL: https://v2hope-production-7e9e.up.railway.app
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Run operational gate
        working-directory: backend
        run: node ../tools/staging-operational-gate.mjs
