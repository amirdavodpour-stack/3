name: TEMP Android Production SHA1

on:
  pull_request:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Export production signing certificate SHA-1
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${STORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          normalized="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | tr '_-' '/+')"
          rem=$(( ${#normalized} % 4 ))
          if [ "$rem" -eq 1 ]; then
            echo "Invalid base64 length." >&2
            exit 1
          elif [ "$rem" -eq 2 ]; then
            normalized="${normalized}=="
          elif [ "$rem" -eq 3 ]; then
            normalized="${normalized}="
          fi
          keystore="$RUNNER_TEMP/hope-production-release.keystore"
          printf '%s' "$normalized" | base64 --decode > "$keystore"
          test -s "$keystore"

          set +e
          keytool -list -v -keystore "$keystore" -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/keytool.txt" 2> "$RUNNER_TEMP/keytool.err"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "keytool_exit_code=$rc"
            echo "The production signing keystore could not be opened with the configured store password."
            sed -n '1,20p' "$RUNNER_TEMP/keytool.err"
            exit "$rc"
          fi

          awk -F': ' '
            /^Alias name:/ { alias=$2 }
            /^Certificate fingerprint \(SHA1\):/ {
              printf "alias=%s\nSHA1=%s\n", alias, $2
              found=1
            }
          ' "$RUNNER_TEMP/keytool.txt" > android-production-sha1.txt

          grep -q '^SHA1=' android-production-sha1.txt
          printf 'Package name: com.hope.marketplace\n' >> android-production-sha1.txt


      - name: Upload fingerprint artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-production-sha1
          path: android-production-sha1.txt
          if-no-files-found: error
