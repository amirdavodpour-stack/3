name: Verify staging metrics secret

on:
  push:
    branches:
      - hope/verify-metrics-secret-2026-09-17

permissions:
  contents: read

jobs:
  verify:
    name: Verify STAGING_METRICS_TOKEN against staging /metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_BASE_URL: https://v2hope-production-7e9e.up.railway.app
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
    steps:
      - name: Verify secret presence and protected metrics authentication
        shell: bash
        run: |
          set -euo pipefail
          token="${STAGING_METRICS_TOKEN:-}"
          if [ -z "$token" ]; then
            echo 'STAGING_METRICS_TOKEN is NOT available to GitHub Actions.' >&2
            exit 1
          fi
          if [ "${#token}" -lt 24 ]; then
            echo 'STAGING_METRICS_TOKEN is available but too short (minimum 24 characters).' >&2
            exit 1
          fi

          code="$(curl --silent --show-error --output /tmp/metrics.json --write-out '%{http_code}' \
            --max-time 20 \
            -H 'accept: application/json' \
            -H "X-Metrics-Token: $token" \
            "$STAGING_BASE_URL/metrics")"

          if [ "$code" != '200' ]; then
            echo "STAGING_METRICS_TOKEN was supplied, but /metrics authentication returned HTTP $code." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/metrics.json', 'utf8'));
          const data = body?.data ?? body;
          if (!data || typeof data !== 'object') throw new Error('Invalid metrics payload');
          for (const [key, type] of [
            ['errors5xx', 'number'],
            ['outboxFailed', 'number'],
            ['outboxProcessed', 'number'],
          ]) {
            if (typeof data[key] !== type) throw new Error(`metrics.${key} missing or wrong type`);
          }
          if (typeof data.recentHealth?.errorRate5xx !== 'number') throw new Error('metrics.recentHealth.errorRate5xx missing');
          if (typeof data.recentHealth?.slowRequestRate !== 'number') throw new Error('metrics.recentHealth.slowRequestRate missing');
          if (typeof data.latency?.p95 !== 'number') throw new Error('metrics.latency.p95 missing');
          if (typeof data.latency?.p99 !== 'number') throw new Error('metrics.latency.p99 missing');
          if (data.health?.database?.status !== 'ok') throw new Error('metrics.health.database.status is not ok');
          console.log(JSON.stringify({
            status: 'PASS',
            secretPresent: true,
            metricsAuthenticated: true,
            database: data.health.database,
            recentHealth: data.recentHealth,
            latency: data.latency,
            outbox: { processed: data.outboxProcessed, failed: data.outboxFailed },
          }));
          NODE
