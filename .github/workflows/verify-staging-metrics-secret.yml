name: Verify staging metrics secret
on:
  push:
    branches:
      - hope/verify-metrics-secret-2026-09-17-rerun
permissions:
  contents: read
jobs:
  verify:
    name: Verify STAGING_METRICS_TOKEN against staging /metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_BASE_URL: https://v2hope-production-7e9e.up.railway.app
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
    steps:
      - name: Verify secret presence and protected metrics authentication
        shell: bash
        run: |
          set -euo pipefail
          token="${STAGING_METRICS_TOKEN:-}"
          test -n "$token"
          test "${#token}" -ge 24
          code="$(curl --silent --show-error --output /tmp/metrics.json --write-out '%{http_code}' --max-time 20 -H 'accept: application/json' -H "X-Metrics-Token: $token" "$STAGING_BASE_URL/metrics")"
          test "$code" = 200
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/metrics.json', 'utf8'));
          const data = body?.data ?? body;
          if (typeof data?.errors5xx !== 'number') throw new Error('errors5xx missing');
          if (typeof data?.outboxFailed !== 'number') throw new Error('outboxFailed missing');
          if (typeof data?.outboxProcessed !== 'number') throw new Error('outboxProcessed missing');
          if (data?.health?.database?.status !== 'ok') throw new Error('database health is not ok');
          console.log(JSON.stringify({status:'PASS',secretPresent:true,metricsAuthenticated:true,database:data.health.database,recentHealth:data.recentHealth,latency:data.latency,outbox:{processed:data.outboxProcessed,failed:data.outboxFailed}}));
          NODE
