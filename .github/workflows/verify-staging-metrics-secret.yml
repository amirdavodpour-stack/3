name: Verify staging metrics secret
on:
  push:
    branches:
      - hope/verify-metrics-secret-direct-2026-09-17
permissions:
  contents: read
jobs:
  verify:
    name: Verify STAGING_METRICS_TOKEN against staging /metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_BASE_URL: https://v2hope-production-7e9e.up.railway.app
      STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
    steps:
      - name: Verify secret
        shell: bash
        run: |
          set -euo pipefail
          token="${STAGING_METRICS_TOKEN:-}"
          test -n "$token"
          test "${#token}" -ge 24
          code="$(curl --silent --show-error --output /tmp/metrics.json --write-out '%{http_code}' --max-time 20 -H 'accept: application/json' -H "X-Metrics-Token: $token" "$STAGING_BASE_URL/metrics")"
          test "$code" = 200
          echo 'STAGING_METRICS_TOKEN authenticates successfully against staging /metrics.'
